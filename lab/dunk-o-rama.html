     from the second throw on, Call the move: name it right and your breath steadies and the target
     looks bigger. Round card is a field guide (spot it, fair version) with a verified Twain maxim.
     Lines written by the Twain seat; town issues only, no parties (inoculation research: Roozenbeek
     et al., Science Advances 2022).
     Earlier: 2026-11-06 | single-file, offline, no external hosts
     v0.2: cartoon glove on an elbow pivot replaces the slingshot; target hangs on two wires and
     sways/twists in the breeze; breathing sway on the aim (calm builds while you hold still,
     tremor after holding too long). Three modes on one button (Dark, Light, Sharp). Studio nav.
     Cast: original archetypes, no real people. -->

 {id:'fil',name:'Sen. Lyle Droneon',title:'The Filibusterer',level:'Easy. Moves: red herring, appeal to tradition, Gish gallop. Light breeze.',

/* ---------- the moves (v0.3): what each level teaches ---------- */
const MOVES={
 red:{name:'Red herring',def:'Drags a shiny, unrelated topic across the trail so you lose the scent.',spot:'Did the answer ever touch the question?',fair:'Answer the question, then raise the other topic.'},
 trad:{name:'Appeal to tradition',def:'Offers "we have always done it" as proof that it is right.',spot:'Ask why it was done that way, not how long.',fair:'Give the reason the old way still works.'},
 gish:{name:'Gish gallop',def:'Floods you with more claims than anyone could check, so the pile passes for proof.',spot:'Pick one claim and ask for the evidence.',fair:'Make your best point and stand on it.'},
 straw:{name:'Straw man',def:'Swaps your point for a flimsier one he can knock down.',spot:'Is that what was actually said?',fair:'Restate the other side so well they would agree, then answer it.'},
 dilemma:{name:'False dilemma',def:'Offers two choices when there are more.',spot:'Look for the third option he left out.',fair:'Lay out the real range of options.'},
 loaded:{name:'Loaded language',def:'Dresses a hard fact in soft words, or a soft fact in scary ones, so the words do your thinking.',spot:'Swap in plain words. Does it still sound fine?',fair:'Say the plain thing.'},
 band:{name:'Bandwagon',def:'Offers a crowd as proof.',spot:'Ask what the claim rests on besides a head count.',fair:'Give the reason the people agree.'},
 what:{name:'Whataboutism',def:'Answers a charge by pointing at somebody else\'s.',spot:'Is the first question still sitting there unanswered?',fair:'Answer for yourself, then raise the other matter.'},
 slope:{name:'Slippery slope',def:'Claims one small step leads straight to disaster, with no proof of the steps between.',spot:'Ask for the evidence for each step.',fair:'Argue about the step actually on the table.'},
 adhom:{name:'Ad hominem',def:'Attacks the person instead of the argument.',spot:'Would the claim be wrong if someone else said it?',fair:'Answer the evidence, whoever brought it.'},
 auth:{name:'False authority',def:'Borrows a famous name or a costume in place of real expertise.',spot:'Is this person an expert in this exact thing, and do other experts agree?',fair:'Cite people who actually know the field.'},
 cherry:{name:'Cherry picking',def:'Shows you the one good apple and hides the orchard.',spot:'Ask what the rest of the evidence says.',fair:'Show the whole picture, bad days included.'}
};
const LEVEL_MOVES={fil:['red','trad','gish'],spin:['straw','dilemma','loaded'],mayor:['band','what','slope'],lob:['adhom','auth','cherry']};
/* Lines written on set by the Twain seat. Studio drafts for founder edit. Town issues only, no parties. */
const LINES={
 fil:{
  red:['You ask about the pothole on Main Street. Let me ask you about the moon. Have you seen it lately? Magnificent.','Was the bridge money spent? A fair question. A fairer one: who brought the potato salad to the Fourth of July picnic? I did.','My opponent wants to talk about the school roof. I would rather talk about the flag on top of it. Look at it wave.'],
  trad:['We have always plowed the north side first. My grandfather plowed it first. He was snowed in for most of his life, but he was consistent.','The town clock has run eleven minutes slow for ninety years. That is not a broken clock. That is heritage.','This tank has dropped a senator every summer since 1952. Why change a thing that works? Wait. Strike that.'],
  gish:['I have nine reasons, which I will now list: one, two, three, the moon, taxes, my aunt, a sub-reason, page four, and nine.','Before you throw, consider my forty-one points. I will make them all at once so you cannot answer any of them.','The facts are on my side. All of them. Several hundred at once. Try checking them before the ball lands.']},
 spin:{
  straw:['My opponent wants a crosswalk on Elm Street. So he wants cars outlawed, horses back, and your grandmother walking to Ohio.','You want the library open on Sundays? Why do you hate weekends?','So you think I should answer questions. In other words, you want me interrogated under a hot lamp. Shameful.'],
  dilemma:['Either we paint the bandstand gold, or we let the town slide into the sea. Choose.','You are with the parking meters, or you are with chaos. There is no third thing. I checked.','Dunk me, or love freedom. You cannot do both.'],
  loaded:['The budget did not go over. It achieved surprise growth.','I did not miss the meeting. I gave it room to breathe.','That is not a pothole. It is a traffic-calming feature with historical depth.']},
 mayor:{
  band:['Everybody who is anybody supports the new parking garage. Ask them. They are all parked in it.','Ninety percent of the people at my birthday party agree with me.','The whole town is behind me. That roar you hear is them cheering. Or the Tilt-A-Whirl.'],
  what:['You want to know where the snowplow money went? What about the time you returned a library book late?','Sure, I missed the budget vote. But you missed the target twice. Who is really missing things here?','My fence is on the neighbor\'s lawn? And what about the neighbor\'s lawn, sitting right under my fence?'],
  slope:['Fix one pothole and they will want every pothole fixed, then sidewalks, then a moon base.','Give the dog park a water fountain, and next the dogs will want the vote.','Dunk me today, and tomorrow you dunk the fire chief. By Friday, nobody in this town is dry.']},
 lob:{
  adhom:['Why trust the crossing guard on traffic? Have you seen her hat?','The engineer says the bridge is unsafe. The engineer also drives a hatchback. Draw your own conclusions.','You cannot believe that kid about the lake. He is twelve, and he smells like the lake.'],
  auth:['Four out of five dentists agree my client\'s candy is good policy. The fifth is not on the payroll yet.','A famous actor who played a doctor on television says the water is fine. Who are you to argue with television?','My cousin read a website about bridges. Engineering is settled.'],

};

let AC=null;
function ac(){if(!sound)return null;if(!AC){try{AC=new(window.AudioContext||window.webkitAudioContext)()}catch(e){AC=null}}if(AC&&AC.state==='suspended')AC.resume();return AC}
function tone(fr,dur,type,vol,to){const a=ac();if(!a)return;const o=a.createOscillator(),g=a.createGain();o.type=type||'sine';o.frequency.setValueAtTime(fr,a.currentTime);if(to)o.frequency.exponentialRampToValueAtTime(to,a.currentTime+dur);g.gain.setValueAtTime(vol||.2,a.currentTime);g.gain.exponentialRampToValueAtTime(.0001,a.currentTime+dur);o.connect(g).connect(a.destination);o.start();o.stop(a.currentTime+dur)}
function noise(dur,vol,freq,type,to){const a=ac();if(!a)return;const n=Math.floor(a.sampleRate*dur),b=a.createBuffer(1,n,a.sampleRate),d=b.getChannelData(0);for(let i=0;i<n;i++)d[i]=Math.random()*2-1;const s=a.createBufferSource();s.buffer=b;const fl=a.createBiquadFilter();fl.type=type||'lowpass';fl.frequency.setValueAtTime(freq,a.currentTime);if(to)fl.frequency.exponentialRampToValueAtTime(to,a.currentTime+dur);const g=a.createGain();g.gain.setValueAtTime(vol,a.currentTime);g.gain.exponentialRampToValueAtTime(.0001,a.currentTime+dur);s.connect(fl).connect(g).connect(a.destination);s.start()}
const SFX={
 snap(p){noise(.18,.3+.2*p,700,'bandpass',3200);tone(320,.09,'square',.05,900)},

 bounce(v){tone(180+v*20,.08,'sine',Math.min(.25,.05+v*.03),90)},
 splash(){noise(.9,.5,1400,'lowpass',200);tone(90,.5,'sine',.3,45);setTimeout(()=>noise(.5,.2,3000,'highpass',800),120)},

function hud(){

function applyMode(){document.documentElement.setAttribute('data-comfort',mode);const nx=MODES[(MODES.indexOf(mode)+1)%3];$('modeBtn').setAttribute('aria-label',`Mode: ${MODE_NAME[mode]}. Switch to ${MODE_NAME[nx]}.`);}

applyMode();applySound();

 const L=$('seatList');L.innerHTML='';
 CAST.forEach((k,i)=>{const b=document.createElement('button');const best=store.get('best_'+k.id,0);
  b.innerHTML=`${k.title}: ${k.name}<small>${k.level} Best: ${best} of ${BALLS}</small>`;
  b.setAttribute('aria-pressed',i===ci?'true':'false');
  b.onclick=()=>{setCast(i);closeSheets();};L.appendChild(b);});

function openSheet(id){closeSheets();buildSeatList();$(id).classList.add('open');const b=$(id).querySelector('button');b&&b.focus();}

$('hint').onclick=()=>{ac();if(canThrow()&&!kb){kb={dx:0,dy:maxPull()*0.35,moved:0};breath.hold=0;breath.calm=0;}$('hint').classList.add('gone');cv.focus&&cv.focus();announce('Ball in hand. Arrow keys aim, space throws. On a touch screen, drag anywhere and let go.');};$('seatClose').onclick=closeSheets;
$('rAgain').onclick=()=>setCast(ci);$('rNext').onclick=()=>setCast((ci+1)%CAST.length);
addEventListener('keydown',e=>{if(e.key==='Escape')closeSheets();});

function setCast(i){ci=i;c=CAST[i];balls=BALLS;dunks=0;streak=0;roundOver=false;ball=null;anim=null;trail=[];lastPath=[];
 ch={yo:0,vy:0,rot:0,state:'sit',timer:0};seatA=0;tg={phi:0,dphi:0,psi:0,dpsi:0};$('result').style.display='none';newWind();hud();
 heck={active:false,move:null,called:null};heckN=0;thrown=0;rBoost=1;calmLock=false;stats={asked:0,right:0,seen:{}};$('callit').style.display='none';bubble.t=0;announce(`${c.title}, ${c.name}, is on the seat. ${c.level}`);}
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function pastMoves(){const out=[];for(const k of CAST){if(k===c)break;out.push(...LEVEL_MOVES[k.id]);}return out;}
let lastLine='';
function newHeckle(){
 const set=LEVEL_MOVES[c.id];if(heckN%set.length===0)heckOrder=shuffle(set);
 const mv=heckOrder[heckN%set.length];heckN++;
 const pool=LINES[c.id][mv].filter(l=>l!==lastLine);const line=pick(pool.length?pool:LINES[c.id][mv]);lastLine=line;
 heck={active:true,move:mv,called:null};say(line,999);
 const ask=thrown>=1;
 const box=$('callit');$('teach').textContent='';
 if(ask){
  const others=set.filter(m=>m!==mv),earlier=shuffle(pastMoves());
  const d2=earlier.length&&Math.random()<.5?earlier[0]:pick(others.filter(m=>m!==others[0]))||others[1];
  const chips=shuffle([mv,others[0],d2===mv?others[1]:d2]);
  $('chips').innerHTML='';
  chips.forEach(id=>{const b=document.createElement('button');b.type='button';b.textContent=MOVES[id].name;b.onclick=()=>callMove(id);$('chips').appendChild(b);});
  $('callQ').textContent='Call the move';$('callQ').style.display='block';box.style.display='block';
  announce(`${c.name} says: ${line} Call the move: ${chips.map(i=>MOVES[i].name).join(', ')}.`);
 }else{box.style.display='none';announce(`${c.name} says: ${line}`);}
}
function callMove(id){

 if(id===heck.move){heck.called=true;stats.right++;rBoost=1.22;calmLock=true;breath.calm=1;SFX.steady();setTimeout(()=>SFX.steady(),110);

  announce(`Called it. ${M.name}. ${M.def}`);}
 else{heck.called=false;tone(220,.18,'square',.05);
  $('teach').innerHTML=`<b>Not quite. That was ${M.name}.</b> ${M.def} Spot it: ${M.spot}`;
  announce(`Not quite. That was ${M.name}. ${M.def} Spot it: ${M.spot}`);}

}
function newWind(){wind=c.wind?Math.round((Math.random()*6-3)*10)/10:0;}

/* ---------- breathing ---------- */
function swayAmp(){let a=0.15-0.115*breath.calm;if(breath.hold>5)a+=Math.min(.18,(breath.hold-5)*.06);return a;}
function swayVec(){const m=maxPull(),A=swayAmp(),b=Math.sin(breath.ph);
 const shake=breath.hold>5?Math.sin(rt*19)*.35+Math.sin(rt*27)*.2:0;
 const ox=A*(Math.sin(rt*1.7)*.55+Math.sin(rt*4.3)*.25+shake);
 const oy=A*(b*b*b*.9+Math.sin(rt*2.9)*.2+shake*.6);
 return[ox*m,oy*m];}
function steadiness(){return breath.hold>5?'SHAKY':breath.calm>.8?'STEADY':'BREATHE';}

/* ---------- input ---------- */
function restPt(){return P(LAUNCH.x,LAUNCH.y,LAUNCH.z);}
function maxPull(){return Math.min(W,H)*0.24;}
function canThrow(){return !ball&&!anim&&balls>0&&!roundOver&&ch.state==='sit'&&!document.querySelector('.sheet.open');}
cv.addEventListener('pointerdown',e=>{ac();if(!canThrow())return;cv.setPointerCapture(e.pointerId);drag={x0:e.clientX,y0:e.clientY,dx:0,dy:0,lx:e.clientX,ly:e.clientY,moved:0};breath.hold=0;breath.calm=calmLock?1:0;cv.style.cursor='grabbing';});
cv.addEventListener('pointermove',e=>{if(!drag)return;drag.dx=e.clientX-drag.x0;drag.dy=e.clientY-drag.y0;drag.moved+=Math.hypot(e.clientX-drag.lx,e.clientY-drag.ly);drag.lx=e.clientX;drag.ly=e.clientY;});
cv.addEventListener('pointerup',()=>{if(!drag)return;const d=drag;drag=null;cv.style.cursor='grab';if(Math.hypot(d.dx,d.dy)>14)release(d.dx,d.dy);});
cv.addEventListener('pointercancel',()=>{drag=null;});
addEventListener('keydown',e=>{
 if(document.querySelector('.sheet.open')||$('result').style.display==='block')return;
 const k=e.key;if(!['ArrowLeft','ArrowRight','ArrowUp','ArrowDown',' ','Enter'].includes(k))return;
 if(e.target&&e.target.tagName==='BUTTON'&&(k===' '||k==='Enter'))return;
 if(!canThrow())return;e.preventDefault();ac();
 if(!kb){kb={dx:0,dy:maxPull()*0.35,moved:0};breath.hold=0;breath.calm=0;}const st=maxPull()*0.03;
 if(k==='ArrowLeft')kb.dx+=st;if(k==='ArrowRight')kb.dx-=st;if(k==='ArrowUp')kb.dy-=st;if(k==='ArrowDown')kb.dy+=st;
 if(k.startsWith('Arrow'))kb.moved+=6;
 if(k===' '||k==='Enter'){const d=kb;kb=null;release(d.dx,d.dy);}
});
function clampPull(dx,dy){const m=maxPull(),l=Math.hypot(dx,dy);if(l>m){dx*=m/l;dy*=m/l;}return[dx,dy];}
function aimPull(dx,dy){[dx,dy]=clampPull(dx,dy);const s=swayVec();return[dx+s[0],dy+s[1]];}
function launchState(dx,dy){
 const m=maxPull(),nx=dx/m,ny=dy/m,p=Math.min(1.1,Math.hypot(dx,dy)/m);
 return{x:LAUNCH.x,y:LAUNCH.y,z:LAUNCH.z,vx:-4.6*nx,vy:1+9*ny,vz:8+14*p,p,age:0,hitT:false,front:false,bonked:false};
}
function release(dx,dy){const v=aimPull(dx,dy);anim={v,t:0,launched:false};breath.hold=0;}
function launch(v){ball=launchState(v[0],v[1]);ball.rBoost=rBoost;rBoost=1;calmLock=false;thrown++;if(heck.move)stats.seen[heck.move]=1;heck.active=false;$('callit').style.display='none';bubble.t=Math.min(bubble.t,1.2);trail=[];lastPath=[];balls--;hud();SFX.snap(ball.p);$('hint').classList.add('gone');}

/* ---------- physics ---------- */
function tgtPos(){return{x:TGT.px+TGT.len*Math.sin(tg.phi),y:TGT.top-TGT.len*Math.cos(tg.phi)};}
function breeze(tt){return c.sway*(Math.sin(tt*.7)*.6+Math.sin(tt*1.9+1.3)*.3+Math.sin(tt*.23+2)*.5)+gust;}
function stepTarget(dt){
 gustT-=dt;if(gustT<=0){gustT=2+Math.random()*4;gust=(Math.random()<.5?-1:1)*c.sway*(1+Math.random());}
 gust*=Math.pow(.25,dt);
 const Fw=breeze(t);
 tg.dphi+=(-(G/TGT.len)*Math.sin(tg.phi)-.25*tg.dphi+Fw*.9)*dt;tg.phi+=tg.dphi*dt;
 tg.dpsi+=(-6*tg.psi-.6*tg.dpsi+Fw*2.2*c.tw)*dt;tg.psi+=tg.dpsi*dt;
 if(Math.abs(tg.psi)>1.3){tg.psi=Math.sign(tg.psi)*1.3;tg.dpsi*=-.3;}
}
function step(b,dt,live){
 const px=b.x,py=b.y,pz=b.z;
 b.vx+=wind*dt;b.vy-=G*dt;b.vx*=1-.02*dt;b.vz*=1-.02*dt;
 b.x+=b.vx*dt;b.y+=b.vy*dt;b.z+=b.vz*dt;b.age+=dt;
 if(!live)return;
 const cross=(zp)=>pz<zp&&b.z>=zp,at=(zp)=>{const k=(zp-pz)/(b.z-pz);return[px+(b.x-px)*k,py+(b.y-py)*k];};
 if(!b.hitT&&cross(TGT.z)){const[cx,cy]=at(TGT.z),T=tgtPos(),cw=Math.max(.12,Math.abs(Math.cos(tg.psi)));
  const tr=c.r*(b.rBoost||1);const ex=(cx-T.x)/(tr*cw+R*.6),ey=(cy-T.y)/(tr+R*.6),e2=ex*ex+ey*ey;
  const rx=(cx-T.x)/(tr*cw+.07+R),ry=(cy-T.y)/(tr+.07+R),r2=rx*rx+ry*ry;
  if(e2<1){b.hitT=true;b.z=TGT.z-.01;b.vz=-Math.abs(b.vz)*.35;b.vy=b.vy*.5+1.5;b.vx+=(cx-T.x)*4;tg.dphi+=b.vx*.25+(cx-T.x)*1.5;tg.dpsi+=(cx-T.x)*12;dunk(T);}
  else if(r2<1){b.hitT=true;b.z=TGT.z-.01;b.vz=-Math.abs(b.vz)*.3;b.vx+=(cx-T.x)*6;b.vy+=(cy-T.y)*6;tg.dpsi+=(cx-T.x)*16;tg.dphi+=(cx-T.x)*2;SFX.rim();rings.push({x:cx,y:cy,z:TGT.z,r:.05,a:1});say(pick(['So close it hurts.','Rim! Ha!','Ooh, the edge. Try again.']),2.2);announce('Off the rim.');}}
 if(!b.front&&cross(TANK.zf)){const[cx,cy]=at(TANK.zf);
  if(cx>TANK.x0-R&&cx<TANK.x1+R&&cy<TANK.cage+R){b.front=true;b.z=TANK.zf-.01;
   const glass=cy<TANK.glass;b.vz=-Math.abs(b.vz)*(glass?.32:.18);b.vx*=.7;b.vy*=glass?.8:.5;
   if(glass){SFX.glass();glassWob=1;slosh=Math.max(slosh,.4);}else{SFX.mesh();b.bonked=true;say(pick(c.bonk),2.6);announce('Hit the net.');}
   shakeIt(.25);}}
 if(b.z>14.2&&b.vz>0){b.z=14.2;b.vz=-b.vz*.3;SFX.bounce(2);}
 if(b.y<R){b.y=R;if(b.vy<0){const v=-b.vy;b.vy=v*.45;b.vx*=.78;b.vz*=.78;if(v>1.2)SFX.bounce(v);}}
}
function dunk(T){
 SFX.clang();tgtFlash=1;rings.push({x:T.x,y:T.y,z:TGT.z,r:.1,a:1});
 dunks++;streak++;hud();shakeIt(.6);hitPause=RM?0:.07;if(!RM){slow=.25;slowT=.45;}
 setTimeout(()=>{SFX.drop();ch.state='fall';ch.vy=.6;},90);
 pop={text:streak>1?`DUNK! ${streak} in a row`:'DUNK!',t:1.4};
 announce(`Dunk! ${c.name} hits the water. ${dunks} dunks, ${balls} balls left.`);
}
function shakeIt(a){if(!RM)shake=Math.max(shake,a);}
function splashAt(){
 SFX.splash();slosh=1.2;shakeIt(.4);
 for(let i=0;i<90;i++){const a=Math.random()*Math.PI*2,sp=1+Math.random()*3.2;
  parts.push({k:'drop',x:SEAT.x+Math.cos(a)*.3,y:TANK.water,z:SEAT.z+Math.sin(a)*.25,vx:Math.cos(a)*sp*.8,vy:3+Math.random()*5,vz:Math.sin(a)*sp*.6-(Math.random()<.25?2.5:0),life:2,r:.025+Math.random()*.045});}

}
function endBall(){
 if(!ball.hitT||ch.state==='sit'){streak=0;if(!ball.bonked&&!ball.hitT)say(pick(c.miss),2.6);}
 lastPath=trail.slice();ball=null;
 if(balls<=0)setTimeout(checkEnd,ch.state==='sit'?700:2600);else newWind();hud();
}
function checkEnd(){if(ball||balls>0||roundOver)return;if(ch.state!=='sit'){setTimeout(checkEnd,500);return;}
 roundOver=true;const key='best_'+c.id,best=store.get(key,0),nb=dunks>best;if(nb)store.set(key,dunks);
 $('rTitle').textContent=dunks===0?'Bone dry':dunks>=7?'Soaked':'Round over';
 $('rText').textContent=`${dunks} dunk${dunks===1?'':'s'} out of ${BALLS} on ${c.name}. ${nb?'New best!':'Best: '+Math.max(best,dunks)+'.'}`;
 const g=$('rGuide');g.innerHTML='';LEVEL_MOVES[c.id].forEach(id=>{const M=MOVES[id];const li=document.createElement('li');li.innerHTML=`<b>${M.name}.</b> ${M.def} <br>Spot it: ${M.spot} <br>Fair version: ${M.fair}`;g.appendChild(li);});
 $('rTwain').textContent='\u201c'+TWAIN[c.id].q+'\u201d';$('rTwainSrc').textContent=TWAIN[c.id].src;
 if(stats.asked)$('rText').textContent+=` You called ${stats.right} of ${stats.asked} moves.`;
 $('result').style.display='block';$('rAgain').focus();announce($('rText').textContent);}

/* ---------- update ---------- */
let last=performance.now(),wasSteady=false;
function frame(now){
 let rdt=Math.min(.05,(now-last)/1000);last=now;rt+=rdt;
 breath.ph+=rdt*2*Math.PI/3.6;
 const aiming=drag||kb;
 if(aiming){breath.hold+=rdt;const mv=aiming.moved;aiming.moved=0;
  if(mv>rdt*120)breath.calm=Math.max(0,breath.calm-.1);else breath.calm=Math.min(1,breath.calm+rdt/1.6);
  if(breath.hold>5)breath.calm=Math.max(0,breath.calm-rdt*.5);
  if(calmLock){breath.calm=1;breath.hold=Math.min(breath.hold,3);}
  const st=steadiness()==='STEADY';if(st&&!wasSteady)SFX.steady();wasSteady=st;}
 else{breath.calm=0;wasSteady=false;}
 if(hitPause>0){hitPause-=rdt;draw();requestAnimationFrame(frame);return;}
 if(slowT>0){slowT-=rdt;if(slowT<=0)slow=1;}
 const dt=rdt*slow;t+=dt;
 stepTarget(dt);
 if(anim){anim.t+=rdt;if(!anim.launched&&anim.t>=.08){anim.launched=true;launch(anim.v);}if(anim.t>.55)anim=null;}
 ready+=((canThrow()?1:0)-ready)*Math.min(1,rdt*7);
 if(ball){const n=6;for(let i=0;i<n;i++)step(ball,dt/n,true);
  trail.push({x:ball.x,y:ball.y,z:ball.z});if(trail.length>200)trail.shift();
  const sp=Math.hypot(ball.vx,ball.vy,ball.vz);
  if((sp<.5&&ball.y<=R+.01)||(ball.vz<0&&ball.z<2.2)||ball.age>6||Math.abs(ball.x)>12)endBall();}
 if(ch.state==='fall'){seatA=Math.min(1.25,seatA+dt*9);ch.vy-=G*dt;ch.yo+=ch.vy*dt;ch.rot=Math.max(-0.9,ch.rot-dt*3.5);
  if(SEAT.y+ch.yo<TANK.water+.05&&!ch.splashed){ch.splashed=true;splashAt();}
  if(SEAT.y+ch.yo<0.75){ch.yo=0.75-SEAT.y;ch.vy=0;ch.state='under';ch.timer=1.5;}}
 else if(ch.state==='under'){ch.timer-=dt;ch.yo=0.75-SEAT.y+Math.sin(t*3)*.04;if(Math.random()<dt*14)parts.push({k:'bub',x:SEAT.x+(Math.random()-.5)*.3,y:1.0,z:SEAT.z,vy:.8+Math.random(),life:1});
  if(ch.timer<=0){ch.state='climb';ch.timer=0;ch.splashed=false;say(pick(c.dunk),3.4);}}
 else if(ch.state==='climb'){ch.timer+=dt;const k=Math.min(1,ch.timer/1.1);const e=1-Math.pow(1-k,3);ch.yo=(0.75-SEAT.y)*(1-e);ch.rot=-0.9*(1-e);seatA=1.25*(1-Math.min(1,k*1.6));
  if(k>=1){ch.state='sit';ch.yo=0;ch.rot=0;seatA=0;}}
 for(const p of parts){p.life-=dt;if(p.k==='drop'){p.vy-=G*dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.z+=p.vz*dt;
   const inTank=p.x>TANK.x0&&p.x<TANK.x1&&p.z>TANK.zf&&p.z<TANK.zb;if((inTank&&p.y<TANK.water&&p.vy<0)||p.y<0||p.z<1.5)p.life=0;}
  else{p.y+=p.vy*dt;if(p.y>TANK.water)p.life=0;}}
 parts=parts.filter(p=>p.life>0);
 for(const r of rings){r.r+=dt*1.6;r.a-=dt*1.8;}rings=rings.filter(r=>r.a>0);
 slosh*=Math.pow(.35,dt);glassWob*=Math.pow(.02,dt);tgtFlash*=Math.pow(.05,dt);shake*=Math.pow(.004,rdt);
 if(pop){pop.t-=rdt;if(pop.t<=0)pop=null;}
 if(bubble.t>0)bubble.t-=rdt;
 if(canThrow()&&!heck.active&&bubble.t<=0.3&&!aiming)newHeckle();
 windShown+=(wind-windShown)*Math.min(1,rdt*3);
 draw();requestAnimationFrame(frame);
}

/* ---------- drawing helpers ---------- */
const OUT='#1b1328';
function rr(x,y,w,h,r,fill,stroke){ctx.beginPath();ctx.roundRect?ctx.roundRect(x,y,w,h,r):ctx.rect(x,y,w,h);if(fill){ctx.fillStyle=fill;ctx.fill();}if(stroke!==false)ctx.stroke();}
function circ(x,y,r,fill,stroke){ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);if(fill){ctx.fillStyle=fill;ctx.fill();}if(stroke!==false)ctx.stroke();}
function ell(x,y,rx,ry,fill,stroke,rot){ctx.beginPath();ctx.ellipse(x,y,Math.max(.001,rx),Math.max(.001,ry),rot||0,0,Math.PI*2);if(fill){ctx.fillStyle=fill;ctx.fill();}if(stroke!==false)ctx.stroke();}
function quad(a,b,c2,d,fill){ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.lineTo(c2.x,c2.y);ctx.lineTo(d.x,d.y);ctx.closePath();ctx.fillStyle=fill;ctx.fill();}
function rectW(x0,x1,y0,y1,z,fill){const a=P(x0,y1,z),b=P(x1,y0,z);ctx.fillStyle=fill;ctx.fillRect(a.x,a.y,b.x-a.x,b.y-a.y);return[a,b];}
function fitText(txt,x,y,maxW,size,wt){let fs=Math.round(size);ctx.font=`${wt} ${fs}px system-ui,sans-serif`;const w=ctx.measureText(txt).width;if(w>maxW){fs=Math.floor(fs*maxW/w);ctx.font=`${wt} ${fs}px system-ui,sans-serif`;}ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(txt,x,y);}

/* ---------- scene ---------- */
function drawBackdrop(){

 ctx.fillStyle=g;ctx.fillRect(0,0,W,hy+2);
 const fw=P(-9,6,40);ctx.save();ctx.strokeStyle=pl.sil;ctx.lineWidth=Math.max(1.5,fw.s*.08);
 ctx.beginPath();ctx.arc(fw.x,fw.y,fw.s*4.5,0,Math.PI*2);ctx.stroke();
 for(let i=0;i<12;i++){const a=i/12*Math.PI*2+t*.05;ctx.beginPath();ctx.moveTo(fw.x,fw.y);ctx.lineTo(fw.x+Math.cos(a)*fw.s*4.5,fw.y+Math.sin(a)*fw.s*4.5);ctx.stroke();
  ctx.fillStyle=i%2?'#ffd23f':'#ff7a59';ctx.beginPath();ctx.arc(fw.x+Math.cos(a)*fw.s*4.5,fw.y+Math.sin(a)*fw.s*4.5,fw.s*.25,0,Math.PI*2);ctx.fill();}

 else if(mood==='talk'){const o=.015+Math.abs(Math.sin(tm*14))*.035;ell(0,my,.05,o,'#5a1220');}
 else if(mood==='wet'){ctx.beginPath();ctx.moveTo(-.05,my+.01);ctx.quadraticCurveTo(0,my-.02,.05,my+.01);ctx.stroke();}
 else{ctx.beginPath();if(c.id==='lob'){ctx.moveTo(-.04,my);ctx.quadraticCurveTo(.02,my+.03,.06,my-.015);}else if(c.id==='mayor'){ctx.moveTo(-.07,my-.01);ctx.quadraticCurveTo(0,my+.06,.07,my-.01);ctx.closePath();ctx.fillStyle='#ffffff';ctx.fill();}else{ctx.moveTo(-.05,my);ctx.quadraticCurveTo(0,my+.035,.05,my);}ctx.stroke();}
 if(c.id==='fil'&&mood!=='under'){ctx.fillStyle='#e6e6ea';ctx.beginPath();ctx.moveTo(0,hY+.05);ctx.quadraticCurveTo(-.08,hY+.04,-.12,hY+.09);ctx.quadraticCurveTo(-.06,hY+.08,0,hY+.075);ctx.quadraticCurveTo(.06,hY+.08,.12,hY+.09);ctx.quadraticCurveTo(.08,hY+.04,0,hY+.05);ctx.fill();ctx.stroke();}
 if(mood==='wet'){for(let i=0;i<4;i++){const ph=(tm*1.5+i*.25)%1;circ(-.15+i*.1,hY+hr*.5+ph*.6,.018,'#9fd8ff',false);}}
 ctx.restore();
}

/* ---------- ball, glove arm, overlays ---------- */
function ballFill(x,y,r){const g=ctx.createRadialGradient(x-r*.35,y-r*.35,r*.1,x,y,r);g.addColorStop(0,'#ffffff');g.addColorStop(.35,'#ffd23f');g.addColorStop(1,'#d9861a');return g;}
function drawBallAt(x,y,z){const p=P(x,y,z),r=R*p.s;
 ctx.fillStyle=ballFill(p.x,p.y,r);ctx.beginPath();ctx.arc(p.x,p.y,r,0,7);ctx.fill();ctx.strokeStyle=OUT;ctx.lineWidth=Math.max(1.5,r*.08);ctx.stroke();
 ctx.strokeStyle='rgba(200,52,43,.8)';ctx.lineWidth=Math.max(1,r*.07);ctx.beginPath();ctx.arc(p.x,p.y,r*.75,-1,1.2);ctx.stroke();}
function drawShadow(b){const s=P(b.x,0,b.z);const k=Math.max(.2,1-b.y/5);ell(s.x,s.y,R*s.s*1.3*k,R*s.s*.35*k,'rgba(0,0,0,.35)',false);}
function previewPts(dx,dy){const b=launchState(dx,dy),pts=[];for(let i=0;i<200&&b.age<.4;i++){step(b,1/60,false);if(i%3===0)pts.push({x:b.x,y:b.y,z:b.z});if(b.z>TGT.z||b.y<0)break;}return pts;}
function elbow(){const m=maxPull(),rp=restPt();return{x:rp.x+m*.7,y:rp.y+m*2.7};}
// cartoon glove (original: cream glove, striped carnival cuff). Local units = ball radius.
function drawGlove(x,y,br,ang,hold){
 ctx.save();ctx.translate(x,y);ctx.rotate(ang);ctx.scale(br,br);
 ctx.lineJoin='round';ctx.lineCap='round';ctx.lineWidth=.09;ctx.strokeStyle=OUT;
 const GL='#fbf6ea',SH='rgba(120,100,70,.18)';
 // cuff
 ctx.save();rr(-1.05,1.05,2.1,.62,.3,'#ffffff');ctx.clip();ctx.fillStyle='#c8342b';for(let i=-3;i<4;i+=2){ctx.beginPath();ctx.moveTo(i*.35-.4,1.0);ctx.lineTo(i*.35-.05,1.0);ctx.lineTo(i*.35+.35,1.75);ctx.lineTo(i*.35,1.75);ctx.closePath();ctx.fill();}ctx.restore();
 ctx.beginPath();ctx.roundRect?ctx.roundRect(-1.05,1.05,2.1,.62,.3):ctx.rect(-1.05,1.05,2.1,.62);ctx.stroke();
 if(hold){
  // ball gripped in the fingertips
  ctx.fillStyle=ballFill(0,-.75,1);ctx.beginPath();ctx.arc(0,-.75,1,0,7);ctx.fill();ctx.stroke();
  ctx.strokeStyle='rgba(200,52,43,.8)';ctx.lineWidth=.08;ctx.beginPath();ctx.arc(0,-.75,.75,-2.4,-.6);ctx.stroke();ctx.strokeStyle=OUT;ctx.lineWidth=.09;
  ell(0,.45,1.0,.75,GL);ell(.15,.6,.7,.45,SH,false);
  // thumb along the left of the ball
  ell(-.95,-.25,.3,.55,GL,true,-.35);
  // four fingers wrapped over the front of the ball
  const fx=[-.6,-.2,.2,.6],top=[-.7,-.95,-.9,-.65];
  for(let i=0;i<4;i++){rr(fx[i]-.2,top[i],.4,1.15-(top[i]+.7)*-.3,.2,GL);}
  for(let i=0;i<4;i++){ctx.beginPath();ctx.moveTo(fx[i]-.12,top[i]+.32);ctx.quadraticCurveTo(fx[i],top[i]+.4,fx[i]+.12,top[i]+.32);ctx.stroke();}
 }else{
  ell(0,.35,.95,.8,GL);
  const sp=[-.55,-.18,.18,.55];
  for(let i=0;i<4;i++){ctx.save();ctx.translate(sp[i]*.9,-.2);ctx.rotate(sp[i]*.7);rr(-.2,-1.1,.4,1.2,.2,GL);ctx.restore();}
  ctx.save();ctx.translate(-.85,.25);ctx.rotate(-1.0);rr(-.2,-.75,.4,.85,.2,GL);ctx.restore();
  ell(.1,.5,.6,.4,SH,false);
 }
 ctx.restore();
}
function drawArm(){
 const rp=restPt(),m=maxPull(),E=elbow();let v=[0,0],hold=false,active=false;
 if(anim){const tt=anim.t;let s;if(tt<.08)s=1-(tt/.08)*(tt/.08);else{const u=tt-.08;s=-.6*Math.sin(Math.min(Math.PI,u*Math.PI/.22))*Math.exp(-u*4);}v=[anim.v[0]*s,anim.v[1]*s];hold=!anim.launched;}
 else if(drag||kb){const d=drag||kb;v=aimPull(d.dx,d.dy);hold=true;active=true;}
 else{hold=ready>.5;}
 const low=(1-ready)*m*1.1*(anim?0:1);
 const drop=m*.55;const hx=rp.x+v[0],hyp=rp.y+drop+v[1]+low;
 const sc=Math.max(.5,.78*(1+.45*(v[1]/m)));const br=R*rp.s*sc;
 const a=Math.atan2(hyp-E.y,hx-E.x),ang=a+Math.PI/2;
 // preview dots (breathing sway already inside v)
 if(active&&canThrow()){const pts=previewPts(v[0],v[1]);const st=steadiness();const col=st==='STEADY'?'#ffffff':st==='SHAKY'?'#ff9a8a':'#fff2b0';
  pts.forEach((q,i)=>{const p=P(q.x,q.y,q.z);const r=Math.max(2.5,R*p.s*.35);ctx.fillStyle=col;ctx.strokeStyle=OUT;ctx.lineWidth=1.5;ctx.globalAlpha=1-i/(pts.length+4)*.6;ctx.beginPath();ctx.arc(p.x,p.y,r,0,7);ctx.fill();ctx.stroke();});ctx.globalAlpha=1;}
 // forearm sleeve from the hidden elbow to the wrist
 const wx=hx-Math.sin(ang)*1.5*br,wy=hyp+Math.cos(ang)*1.5*br;
 const wid=br*1.9;
 ctx.lineCap='round';ctx.strokeStyle=OUT;ctx.lineWidth=wid+5;ctx.beginPath();ctx.moveTo(E.x,E.y);ctx.lineTo(wx,wy);ctx.stroke();
 ctx.strokeStyle='#2f6fb0';ctx.lineWidth=wid;ctx.stroke();
 ctx.strokeStyle='rgba(255,255,255,.25)';ctx.lineWidth=wid*.25;ctx.beginPath();ctx.moveTo(E.x-wid*.25,E.y);ctx.lineTo(wx-wid*.25,wy);ctx.stroke();
 drawGlove(hx,hyp,br,ang,hold);
 // breath ring and steadiness label
 if(active&&canThrow()){const st=steadiness(),k=breath.calm;const inflate=.5+.5*Math.sin(breath.ph);
  const ringR=br*(1.5+.3*inflate);const bx=hx+Math.sin(ang)*.75*br,by=hyp-Math.cos(ang)*.75*br;
  const col=st==='SHAKY'?'#ff5a4f':`rgb(${Math.round(255-150*k)},${Math.round(200+35*k)},${Math.round(80+60*k)})`;
  ctx.strokeStyle=OUT;ctx.lineWidth=7;ctx.beginPath();ctx.arc(bx,by,ringR,0,7);ctx.stroke();
  ctx.strokeStyle=col;ctx.lineWidth=4;ctx.beginPath();ctx.arc(bx,by,ringR,-Math.PI/2,-Math.PI/2+Math.PI*2*Math.max(.05,k));ctx.stroke();
  ctx.font='800 18px system-ui,sans-serif';const tw=ctx.measureText(st).width+20;let lx=bx-tw/2,ly=by-ringR-38;lx=Math.max(8,Math.min(W-tw-8,lx));
  ctx.lineWidth=2;ctx.strokeStyle=col;rr(lx,ly,tw,30,8,'#1b1328');ctx.fillStyle='#ffffff';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(st,lx+tw/2,ly+15);
  // power bar
  const pw=Math.min(1,Math.hypot(v[0],v[1])/m),mx=(hx+br*3.2+18>W-8)?hx-br*3.2-18:hx+br*3.2,mh=br*5,my=hyp+br*1.5;ctx.strokeStyle='#ffd23f';ctx.lineWidth=2;rr(mx,my-mh,18,mh,6,'#1b1328');
  ctx.fillStyle=pw>.85?'#ff7a59':'#ffd23f';ctx.fillRect(mx+3,my-3-(mh-6)*pw,12,(mh-6)*pw);}
}
function wrap(txt,maxW){const words=txt.split(' '),lines=[];let l='';for(const w of words){const tt=l?l+' '+w:w;if(ctx.measureText(tt).width>maxW&&l){lines.push(l);l=w;}else l=tt;}if(l)lines.push(l);return lines;}
function drawBubble(){
 if(bubble.t<=0||ch.state==='under'||ch.state==='fall')return;
 const hp=P(SEAT.x,SEAT.y+ch.yo+1.15,SEAT.z);const fs=18;ctx.font=`700 ${fs}px system-ui,sans-serif`;
 const maxW=Math.min(W*.62,320),lines=wrap(bubble.text,maxW-24),lh=fs*1.3,bw=Math.min(maxW,Math.max(...lines.map(l=>ctx.measureText(l).width))+28),bh=lines.length*lh+18;
 const topMin=document.querySelector('.se-chrome').getBoundingClientRect().bottom+8;
 let bx=hp.x-bw*.3,by=hp.y-bh-14;bx=Math.max(8,Math.min(W-bw-8,bx));by=Math.max(topMin,by);
 ctx.globalAlpha=Math.min(1,bubble.t*3);ctx.strokeStyle=OUT;ctx.lineWidth=3;rr(bx,by,bw,bh,14,'#ffffff');
 const tx=Math.max(bx+16,Math.min(bx+bw-16,hp.x));ctx.beginPath();ctx.moveTo(tx-9,by+bh-1);ctx.lineTo(tx,by+bh+12);ctx.lineTo(tx+9,by+bh-1);ctx.fillStyle='#ffffff';ctx.fill();
 ctx.beginPath();ctx.moveTo(tx-9,by+bh);ctx.lineTo(tx,by+bh+12);ctx.lineTo(tx+9,by+bh);ctx.stroke();
 ctx.fillStyle='#1b1328';ctx.textAlign='left';ctx.textBaseline='top';lines.forEach((l,i)=>ctx.fillText(l,bx+14,by+10+i*lh));ctx.globalAlpha=1;
}
function drawPop(){if(!pop)return;const k=1-pop.t/1.4;const sc=k<.15?k/.15*1.25:1.25-Math.min(.25,(k-.15)*.6);const fs=Math.min(W*.14,96)*sc;
 ctx.save();ctx.translate(W/2,H*.36);ctx.rotate(-.06);ctx.font=`900 ${fs}px system-ui,sans-serif`;ctx.textAlign='center';ctx.textBaseline='middle';ctx.globalAlpha=Math.min(1,pop.t*2);
 ctx.lineWidth=fs*.14;ctx.strokeStyle='#1b1328';ctx.lineJoin='round';ctx.strokeText(pop.text,0,0);ctx.fillStyle='#ffd23f';ctx.fillText(pop.text,0,0);ctx.restore();}

function draw(){
 ctx.save();if(shake>.01){ctx.translate((Math.random()-.5)*shake*24,(Math.random()-.5)*shake*24);}
 drawBackdrop();drawTarget();drawTank();
 if(!ball&&lastPath.length){ctx.fillStyle='rgba(255,255,255,.45)';lastPath.forEach((q,i)=>{if(i%4)return;const p=P(q.x,q.y,q.z);ctx.beginPath();ctx.arc(p.x,p.y,Math.max(1.5,R*p.s*.18),0,7);ctx.fill();});}
 for(const p of parts)if(p.k==='drop'){const q=P(p.x,p.y,p.z);ctx.fillStyle='rgba(170,225,255,.9)';ctx.beginPath();ctx.ellipse(q.x,q.y,Math.max(1.5,p.r*q.s),Math.max(2,p.r*q.s*1.4),0,0,7);ctx.fill();}
 if(ball){drawShadow(ball);trail.forEach((q,i)=>{if(i%2||i<trail.length-24)return;const p=P(q.x,q.y,q.z);ctx.fillStyle=`rgba(255,240,190,${.15+.5*i/trail.length})`;ctx.beginPath();ctx.arc(p.x,p.y,R*p.s*.5,0,7);ctx.fill();});drawBallAt(ball.x,ball.y,ball.z);}
 drawArm();
 ctx.restore();
 drawBubble();drawPop();
}

/* ---------- go ---------- */
setCast(0);
requestAnimationFrame(frame);
</script>
