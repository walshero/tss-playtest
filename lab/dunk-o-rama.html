<!-- TSP build: Dunk-O-Rama v0.6 | LAB | 2026-11-06
     v0.6: speech bubbles never block play. Each has a close button; any bubble vanishes the moment
     the player touches to pull back (back again only if the pull is let go without a throw).
     A closed heckle can be brought back from the call panel ("Show the line").
     Header folds away during play (founder: "Space is limited so the header should disappear"):
     a corner menu button opens it; a slim counter pill stays. Touching the scene folds it again.
     v0.5:
     v0.5: tank 12% larger, characters 18% larger; cut-paper depth (drop-shadowed paper layers,
     torn ground strips, drifting paper clouds, paper grain over the scene).
     Also v0.5: breath meter removed (ring, label, colored aim dots); the breathing itself is unchanged:
     holding still steadies the aim, holding past 5 s brings the tremor. Reactions doubled to 10 miss
     and 10 dunk lines per character; net and rim lines fall back to the miss bag, so no reaction
     repeats inside a 10-ball round.
     v0.4:
     v0.4: five levels, 20 cheats (4 per level; the Pundit adds scapegoating, false cause, loaded
     question, incoherence). Each heckle is an exchange: the crowd asks, the politician cheats.
     Shuffle bags: no line, move or reaction repeats until its whole set has played.
     v0.3:
     v0.3: every level teaches three rhetorical moves (12 in all). Each throw opens with a heckle;
     from the second throw on, Call the move: name it right and your breath steadies and the target
     looks bigger. Round card is a field guide (spot it, fair version) with a verified Twain maxim.
     Lines written by the Twain seat; town issues only, no parties (inoculation research: Roozenbeek
     et al., Science Advances 2022).
     Earlier: 2026-11-06 | single-file, offline, no external hosts
     v0.2: cartoon glove on an elbow pivot replaces the slingshot; target hangs on two wires and
     sways/twists in the breeze; breathing sway on the aim (calm builds while you hold still,
     tremor after holding too long). Three modes on one button (Dark, Light, Sharp). Studio nav.
     Cast: original archetypes, no real people. -->

<script>
"use strict";
/* ---------- setup ---------- */
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
let W,H,DPR,f,hy;const camY=1.5;
function resize(){DPR=Math.min(2,window.devicePixelRatio||1);W=innerWidth;H=innerHeight;cv.width=W*DPR;cv.height=H*DPR;ctx.setTransform(DPR,0,0,DPR,0,0);f=Math.min(H*1.25,W*2.1);hy=H*(H>W*1.3?0.49:0.45);}
addEventListener('resize',resize);resize();
function P(x,y,z){const s=f/z;return{x:W/2+x*s,y:hy+(camY-y)*s,s};}
const $=id=>document.getElementById(id);
const store={get(k,d){try{const v=localStorage.getItem('dunk_'+k);return v===null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem('dunk_'+k,JSON.stringify(v))}catch(e){}}};
const RM=(()=>{try{return matchMedia('(prefers-reduced-motion: reduce)').matches}catch(e){return false}})();

/* ---------- world ---------- */
const G=9.8,R=0.11,BALLS=10;
const TANK={x0:-0.78,x1:1.86,zf:11.0,zb:13.4,water:1.62,glass:1.79,cage:3.58};
const SEAT={x:0.54,y:2.3,z:12.2};
const TGT={px:-1.95,top:3.75,len:2.0,z:11.4};
const CHS=1.18; // character scale
const LAUNCH={x:0.18,y:1.25,z:1.5};

const CAST=[
 {id:'fil',name:'Sen. Lyle Droneon',title:'The Filibusterer',level:'Easy. Moves: red herring, appeal to tradition, Gish gallop. Light breeze.',
  suit:'#59647e',pants:'#454e63',tie:'#c8342b',skin:'#f0c4a0',bw:0.52,r:0.34,sway:0.5,tw:1,wind:0,
  idle:['And another thing. Section four, paragraph nine...','I yield my time to... myself.','Point of order! That was a practice throw.','I have forty more pages. Single-spaced.','Let the record show I am perfectly dry.'],
  miss:['Noted. Tabled. Forgotten.','Motion to dismiss that throw. Seconded by me.','The chair recognizes your miss.'],
  bonk:['That net was in the budget for a reason.','Out of order! You hit the procedure.'],
  dunk:["I'll be entering this splash into the record.",'Glub. The senator from the deep end yields.','Moist. Very moist. Moving on to page ten.']},
 {id:'spin',name:'Skip Twirl',title:'The Spin Doctor',level:'Medium. Moves: straw man, false dilemma, loaded language. The target twists.',
  suit:'#6a3fa0',pants:'#4b2c74',tie:'#ffd23f',skin:'#e7b48c',bw:0.46,r:0.31,sway:0.7,tw:2.1,wind:0,
  idle:['Let me reframe that throw for you.','Every miss is a win, if you squint.',"The target isn't twisting. It's evolving.",'Off the record? You throw like a committee.'],
  miss:['That miss was a strategic success.','Sources close to the ball say it was tired.','Historic restraint on your part.'],
  bonk:['The net and I are on message.','Hit the net? Bold choice. Wrong, but bold.'],
  dunk:['This water polls very well with me.','I meant to do that. Write it down.','Wet is the new dry. Trust me.']},
 {id:'mayor',name:'Mayor Bunting',title:'The Pork-Barrel Mayor',level:'Medium. Moves: bandwagon, whataboutism, slippery slope. Gusts push the ball.',
  suit:'#2f6b4f',pants:'#244f3b',tie:'#c8342b',skin:'#f3c2a2',bw:0.7,r:0.33,sway:0.8,tw:1,wind:1,
  idle:['This ball was paid for with your taxes!','Ribbon-cutting at noon, so watch the suit.','I hereby declare this seat a historic landmark.','Feel that breeze? I ordered it.'],
  miss:["Ha! That's going in the newsletter.",'A miss! Free parking for everyone.','The wind is on my committee.'],
  bonk:['That net cost the town nine thousand dollars. Worth it.','Dent that net and I raise the fee.'],
  dunk:['I hereby name this puddle after myself.','Cancel the parade. And the hat.','Glub. Vote... glub... for me.']},
 {id:'lob',name:'Chet Ledger',title:'The Lobbyist',level:'Hard. Moves: ad hominem, false authority, cherry picking. Small target, big wind.',
  suit:'#23345a',pants:'#1b2846',tie:'#2e9e5b',skin:'#eec3a0',bw:0.5,r:0.25,sway:1.15,tw:1.4,wind:0,
  idle:['What if missing paid really well?','My clients would prefer you aim left.',"Let's call this throw a donation.",'Nice breeze today. I paid for that too.'],
  miss:['Pleasure doing business.',"I'll send a fruit basket.",'Your miss has been noted by my clients.'],

/* ---------- the moves (v0.4): 20 cheats, 4 per level ---------- */
const MOVES={
 red:{name:'Red herring',def:'Drags a shiny, unrelated topic across the trail so you lose the scent.',spot:'Did the answer ever touch the question?',fair:'Answer the question, then raise the other topic.'},
 trad:{name:'Appeal to tradition',def:'Offers "we have always done it" as proof that it is right.',spot:'Ask why it was done that way, not how long.',fair:'Give the reason the old way still works.'},
 gish:{name:'Gish gallop',def:'Floods you with more claims than anyone could check, so the pile passes for proof.',spot:'Pick one claim and ask for the evidence.',fair:'Make your best point and stand on it.'},
 circ:{name:'Circular reasoning',def:'Uses the conclusion as its own proof.',spot:'Take out the repeat. Is any reason left?',fair:'Give a reason that does not assume the answer.'},
 straw:{name:'Straw man',def:'Swaps your point for a flimsier one he can knock down.',spot:'Is that what was actually said?',fair:'Restate the other side so well they would agree, then answer it.'},
 dilemma:{name:'False dilemma',def:'Offers two choices when there are more.',spot:'Look for the third option he left out.',fair:'Lay out the real range of options.'},
 loaded:{name:'Loaded language',def:'Dresses a hard fact in soft words, or a soft fact in scary ones, so the words do your thinking.',spot:'Swap in plain words. Does it still sound fine?',fair:'Say the plain thing.'},
 goal:{name:'Moving the goalposts',def:'Raises the bar the moment you clear it.',spot:'Was this the test before the evidence came in?',fair:'Set the test first, then accept the result.'},
 band:{name:'Bandwagon',def:'Offers a crowd as proof.',spot:'Ask what the claim rests on besides a head count.',fair:'Give the reason the people agree.'},
 what:{name:'Whataboutism',def:'Answers a charge by pointing at somebody else\'s.',spot:'Is the first question still sitting there unanswered?',fair:'Answer for yourself, then raise the other matter.'},
 slope:{name:'Slippery slope',def:'Claims one small step leads straight to disaster, with no proof of the steps between.',spot:'Ask for the evidence for each step.',fair:'Argue about the step actually on the table.'},
 equiv:{name:'False equivalence',def:'Treats two very different things as the same.',spot:'Ask how big each one really is.',fair:'Compare things of the same size and kind.'},
 adhom:{name:'Ad hominem',def:'Attacks the person instead of the argument.',spot:'Would the claim be wrong if someone else said it?',fair:'Answer the evidence, whoever brought it.'},
 auth:{name:'False authority',def:'Borrows a famous name or a costume in place of real expertise.',spot:'Is this person an expert in this exact thing, and do other experts agree?',fair:'Cite people who actually know the field.'},
 cherry:{name:'Cherry picking',def:'Shows you the one good apple and hides the orchard.',spot:'Ask what the rest of the evidence says.',fair:'Show the whole picture, bad days included.'},
 anec:{name:'Anecdote as proof',def:'Lets one vivid story stand in for all the evidence.',spot:'Ask how many cases, not how memorable the one.',fair:'Use the story to show it, the numbers to prove it.'},
 scape:{name:'Scapegoating',def:'Pins a big, tangled problem on one handy person or group.',spot:'Would the problem vanish without them? Look for the other causes.',fair:'Name the real causes, plural.'},
 cause:{name:'False cause',def:'Claims that because one thing came after another, the first one caused it.',spot:'Ask what else changed at the same time.',fair:'Show how the cause works, not just when it happened.'},
 lq:{name:'Loaded question',def:'Hides an accusation inside a question, so any answer admits it.',spot:'Check what the question assumes before you answer.',fair:'Ask the first question first: did it happen?'},
 incoh:{name:'Incoherence',def:'Makes claims that cannot all be true at once, hoping nobody lines them up.',spot:'Put two of the claims side by side.',fair:'Pick one story and stick to it.'}
};
const LEVEL_MOVES={fil:['red','trad','gish','circ'],spin:['straw','dilemma','loaded','goal'],mayor:['band','what','slope','equiv'],lob:['adhom','auth','cherry','anec'],pun:['scape','cause','lq','incoh']};
/* Exchanges written on set by the Twain seat: [the crowd asks, the politician cheats].
   Studio drafts for founder edit. Town issues only; no parties, no real people. */
const LINES={
 fil:{
  red:[['Senator, where did the bridge money go?','A fair question. A fairer one: who brought the potato salad to the Fourth of July picnic? I did. Twice.'],
       ['Will you fix the pothole on Main Street?','Have you looked at the moon lately? Magnificent. Nobody paves the moon, and nobody complains.'],
       ['Why is the school roof leaking?','I would rather talk about the flag on top of that roof. Look at it wave. That is the real story.']],
  trad:[['Why plow the north side first every time?','We have always plowed the north side first. My grandfather did. He was snowed in most of his life, but he was consistent.'],
        ['The town clock runs eleven minutes slow.','For ninety years. That is not a broken clock. That is heritage.'],
        ['Why does the library close at four?','It closed at four in 1911, and nobody in 1911 wrote a single letter about it.']],
  gish:[['Can you give one reason for the new tax?','I can give nine: one, two, three, the moon, my aunt, a sub-reason, page four, the weather, and nine. Next.'],
        ['Is the water report accurate?','Consider my forty-one points. I will make them all at once, so nobody can answer any of them.'],
        ['Did the fair lose money this year?','The facts are on my side. All of them. Several hundred at once. Check them before the ball lands.']],
  circ:[['Why should we trust you?','Because I am trustworthy. I know I am trustworthy because I would never lie to you about being trustworthy.'],
        ['Why is your bridge plan the best one?','It is better than every other plan, which makes it the best, which is why it is better.'],
        ['How do you know the budget balances?','I only pass balanced budgets, and I passed this one. Therefore it is balanced. Case closed.']]},
 spin:{
  straw:[['Could we add a crosswalk on Elm Street?','So you want cars outlawed, horses brought back, and your grandmother walking to Ohio. Interesting vision.'],
         ['Can the library open on Sundays?','So you hate weekends. You want everyone shelving books on their day off. Noted.'],
         ['Will you answer our questions tonight?','So you want me under a hot lamp with no water. That is not democracy. That is a dentist.']],
  dilemma:[['Should we repaint the bandstand?','Either we paint it gold, or we let the town slide into the sea. Choose wisely.'],
           ['Are the new parking meters a good idea?','You are with the parking meters, or you are with chaos. There is no third thing. I checked.'],
           ['Is the dunk tank good for the fair?','Dunk me, or love freedom. You cannot do both.']],
  loaded:[['Did the budget go over?','The budget did not go over. It achieved surprise growth.'],
          ['Why did you skip the town meeting?','I did not skip it. I gave it room to breathe.'],
          ['When will you fix the pothole?','That is not a pothole. It is a traffic-calming feature with historical depth.']],
  goal:[['Here is the receipt. The money went missing.','A receipt? Anyone can have a receipt. Come back with a notarized one. In Latin.'],
        ['Ten thousand people signed the petition.','I said a lot of people. A lot has always meant more than ten thousand.'],
        ['You said you would resign if the bridge fell. It fell.','I said the whole bridge. That was most of the bridge.']]},
 mayor:{
  band:[['Do people really want a parking garage?','Everybody who is anybody supports it. Ask them. They are all parked in it.'],

function ballFill(x,y,r){const g=ctx.createRadialGradient(x-r*.35,y-r*.35,r*.1,x,y,r);g.addColorStop(0,'#ffffff');g.addColorStop(.35,'#ffd23f');g.addColorStop(1,'#d9861a');return g;}
function drawBallAt(x,y,z){const p=P(x,y,z),r=R*p.s;
 ctx.fillStyle=ballFill(p.x,p.y,r);ctx.beginPath();ctx.arc(p.x,p.y,r,0,7);ctx.fill();ctx.strokeStyle=OUT;ctx.lineWidth=Math.max(1.5,r*.08);ctx.stroke();
 ctx.strokeStyle='rgba(200,52,43,.8)';ctx.lineWidth=Math.max(1,r*.07);ctx.beginPath();ctx.arc(p.x,p.y,r*.75,-1,1.2);ctx.stroke();}
function drawShadow(b){const s=P(b.x,0,b.z);const k=Math.max(.2,1-b.y/5);ell(s.x,s.y,R*s.s*1.3*k,R*s.s*.35*k,'rgba(0,0,0,.35)',false);}
function previewPts(dx,dy){const b=launchState(dx,dy),pts=[];for(let i=0;i<200&&b.age<.4;i++){step(b,1/60,false);if(i%3===0)pts.push({x:b.x,y:b.y,z:b.z});if(b.z>TGT.z||b.y<0)break;}return pts;}
function elbow(){const m=maxPull(),rp=restPt();return{x:rp.x+m*.7,y:rp.y+m*2.7};}
// cartoon glove (original: cream glove, striped carnival cuff). Local units = ball radius.
function drawGlove(x,y,br,ang,hold){
 ctx.save();ctx.translate(x,y);ctx.rotate(ang);ctx.scale(br,br);
 ctx.lineJoin='round';ctx.lineCap='round';ctx.lineWidth=.09;ctx.strokeStyle=OUT;
 const GL='#fbf6ea',SH='rgba(120,100,70,.18)';
 // cuff
 ctx.save();rr(-1.05,1.05,2.1,.62,.3,'#ffffff');ctx.clip();ctx.fillStyle='#c8342b';for(let i=-3;i<4;i+=2){ctx.beginPath();ctx.moveTo(i*.35-.4,1.0);ctx.lineTo(i*.35-.05,1.0);ctx.lineTo(i*.35+.35,1.75);ctx.lineTo(i*.35,1.75);ctx.closePath();ctx.fill();}ctx.restore();
 ctx.beginPath();ctx.roundRect?ctx.roundRect(-1.05,1.05,2.1,.62,.3):ctx.rect(-1.05,1.05,2.1,.62);ctx.stroke();
 if(hold){
  // ball gripped in the fingertips
  ctx.fillStyle=ballFill(0,-.75,1);ctx.beginPath();ctx.arc(0,-.75,1,0,7);ctx.fill();ctx.stroke();
  ctx.strokeStyle='rgba(200,52,43,.8)';ctx.lineWidth=.08;ctx.beginPath();ctx.arc(0,-.75,.75,-2.4,-.6);ctx.stroke();ctx.strokeStyle=OUT;ctx.lineWidth=.09;
  ell(0,.45,1.0,.75,GL);ell(.15,.6,.7,.45,SH,false);
  // thumb along the left of the ball
  ell(-.95,-.25,.3,.55,GL,true,-.35);
  // four fingers wrapped over the front of the ball
  const fx=[-.6,-.2,.2,.6],top=[-.7,-.95,-.9,-.65];
  for(let i=0;i<4;i++){rr(fx[i]-.2,top[i],.4,1.15-(top[i]+.7)*-.3,.2,GL);}
  for(let i=0;i<4;i++){ctx.beginPath();ctx.moveTo(fx[i]-.12,top[i]+.32);ctx.quadraticCurveTo(fx[i],top[i]+.4,fx[i]+.12,top[i]+.32);ctx.stroke();}
 }else{
  ell(0,.35,.95,.8,GL);
  const sp=[-.55,-.18,.18,.55];
  for(let i=0;i<4;i++){ctx.save();ctx.translate(sp[i]*.9,-.2);ctx.rotate(sp[i]*.7);rr(-.2,-1.1,.4,1.2,.2,GL);ctx.restore();}
  ctx.save();ctx.translate(-.85,.25);ctx.rotate(-1.0);rr(-.2,-.75,.4,.85,.2,GL);ctx.restore();
  ell(.1,.5,.6,.4,SH,false);
 }
 ctx.restore();
}
function drawArm(){
 const rp=restPt(),m=maxPull(),E=elbow();let v=[0,0],hold=false,active=false;
 if(anim){const tt=anim.t;let s;if(tt<.08)s=1-(tt/.08)*(tt/.08);else{const u=tt-.08;s=-.6*Math.sin(Math.min(Math.PI,u*Math.PI/.22))*Math.exp(-u*4);}v=[anim.v[0]*s,anim.v[1]*s];hold=!anim.launched;}
 else if(drag||kb){const d=drag||kb;v=aimPull(d.dx,d.dy);hold=true;active=true;}
 else{hold=ready>.5;}
 const low=(1-ready)*m*1.1*(anim?0:1);
 const drop=m*(H>W*1.3?.12:.55);const hx=rp.x+v[0],hyp=rp.y+drop+v[1]+low;
 const sc=Math.max(.5,.78*(1+.45*(v[1]/m)));const br=R*rp.s*sc;
 const a=Math.atan2(hyp-E.y,hx-E.x),ang=a+Math.PI/2;
 // preview dots (breathing sway already inside v)
 if(active&&canThrow()){const pts=previewPts(v[0],v[1]);const col='#ffffff';
  pts.forEach((q,i)=>{const p=P(q.x,q.y,q.z);const r=Math.max(2.5,R*p.s*.35);ctx.fillStyle=col;ctx.strokeStyle=OUT;ctx.lineWidth=1.5;ctx.globalAlpha=1-i/(pts.length+4)*.6;ctx.beginPath();ctx.arc(p.x,p.y,r,0,7);ctx.fill();ctx.stroke();});ctx.globalAlpha=1;}
 // forearm sleeve from the hidden elbow to the wrist
 const wx=hx-Math.sin(ang)*1.5*br,wy=hyp+Math.cos(ang)*1.5*br;
 const wid=br*1.9;
 ctx.lineCap='round';ctx.strokeStyle=OUT;ctx.lineWidth=wid+5;ctx.beginPath();ctx.moveTo(E.x,E.y);ctx.lineTo(wx,wy);ctx.stroke();
 ctx.strokeStyle='#2f6fb0';ctx.lineWidth=wid;ctx.stroke();
 ctx.strokeStyle='rgba(255,255,255,.25)';ctx.lineWidth=wid*.25;ctx.beginPath();ctx.moveTo(E.x-wid*.25,E.y);ctx.lineTo(wx-wid*.25,wy);ctx.stroke();
 paperOn(1.4);drawGlove(hx,hyp,br,ang,hold);paperOff();
 if(active&&canThrow()){
  // power bar
  const pw=Math.min(1,Math.hypot(v[0],v[1])/m),mx=(hx+br*3.2+18>W-8)?hx-br*3.2-18:hx+br*3.2,mh=br*5,my=hyp+br*1.5;ctx.strokeStyle='#ffd23f';ctx.lineWidth=2;rr(mx,my-mh,18,mh,6,'#1b1328');
  ctx.fillStyle=pw>.85?'#ff7a59':'#ffd23f';ctx.fillRect(mx+3,my-3-(mh-6)*pw,12,(mh-6)*pw);}
}
function wrap(txt,maxW){const words=txt.split(' '),lines=[];let l='';for(const w of words){const tt=l?l+' '+w:w;if(ctx.measureText(tt).width>maxW&&l){lines.push(l);l=w;}else l=tt;}if(l)lines.push(l);return lines;}
function drawBubble(){
 const bc=$('bubClose');if(bubble.t<=0||bubble.hidden||ch.state==='under'||ch.state==='fall'){if(bc.style.display!=='none')bc.style.display='none';return;}
 const hp=P(SEAT.x,SEAT.y+ch.yo+1.15*CHS,SEAT.z);const fs=18,lh=fs*1.32,maxW=Math.min(W*.7-30,330);
 const segs=bubble.parts||[{who:null,text:bubble.text}],rows=[];
 segs.forEach((sg,k)=>{const lab=sg.who?sg.who+': ':'';ctx.font=`${sg.crowd?'italic 600':'700'} ${fs}px system-ui,sans-serif`;
  wrap(lab+sg.text,maxW-28).forEach((l,i)=>rows.push({t:l,crowd:!!sg.crowd,lab:i===0?lab:''}));if(k<segs.length-1)rows.push({gap:1});});
 let bw=0;rows.forEach(r=>{if(r.gap)return;ctx.font=`${r.crowd?'italic 600':'700'} ${fs}px system-ui,sans-serif`;bw=Math.max(bw,ctx.measureText(r.t).width);});
 bw=Math.min(maxW,bw+28);const bh=rows.reduce((a,r)=>a+(r.gap?8:lh),0)+18;
 const topMin=$('corner').getBoundingClientRect().bottom+8;
 let bx=hp.x-bw*.3,by=hp.y-bh-14;bx=Math.max(8,Math.min(W-bw-34,bx));by=Math.max(topMin+14,by);
 bc.style.left=Math.round(bx+bw-22)+'px';bc.style.top=Math.round(by-20)+'px';if(bc.style.display!=='flex')bc.style.display='flex';
 ctx.globalAlpha=Math.min(1,bubble.t*3);ctx.strokeStyle=OUT;ctx.lineWidth=3;paperOn(1.2);rr(bx,by,bw,bh,14,'#ffffff');paperOff();
 const tx=Math.max(bx+16,Math.min(bx+bw-16,hp.x));ctx.beginPath();ctx.moveTo(tx-9,by+bh-1);ctx.lineTo(tx,by+bh+12);ctx.lineTo(tx+9,by+bh-1);ctx.fillStyle='#ffffff';ctx.fill();
 ctx.beginPath();ctx.moveTo(tx-9,by+bh);ctx.lineTo(tx,by+bh+12);ctx.lineTo(tx+9,by+bh);ctx.stroke();
 ctx.textAlign='left';ctx.textBaseline='top';let y=by+10;
 rows.forEach(r=>{if(r.gap){ctx.strokeStyle='rgba(27,19,40,.25)';ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(bx+14,y+3);ctx.lineTo(bx+bw-14,y+3);ctx.stroke();y+=8;return;}
  const f=`${r.crowd?'italic 600':'700'} ${fs}px system-ui,sans-serif`;ctx.font=f;let x=bx+14,t=r.t;
  if(r.lab){ctx.fillStyle=r.crowd?'#7a1a12':'#4a2a7a';ctx.font=`800 ${fs}px system-ui,sans-serif`;const lw=ctx.measureText(r.lab).width;ctx.fillText(r.lab,x,y);x+=lw;t=r.t.slice(r.lab.length);ctx.font=f;}
  ctx.fillStyle='#1b1328';ctx.fillText(t,x,y);y+=lh;});
 ctx.globalAlpha=1;
}
function drawPop(){if(!pop)return;const k=1-pop.t/1.4;const sc=k<.15?k/.15*1.25:1.25-Math.min(.25,(k-.15)*.6);const fs=Math.min(W*.14,96)*sc;
 ctx.save();ctx.translate(W/2,H*.36);ctx.rotate(-.06);ctx.font=`900 ${fs}px system-ui,sans-serif`;ctx.textAlign='center';ctx.textBaseline='middle';ctx.globalAlpha=Math.min(1,pop.t*2);
 ctx.lineWidth=fs*.14;ctx.strokeStyle='#1b1328';ctx.lineJoin='round';ctx.strokeText(pop.text,0,0);ctx.fillStyle='#ffd23f';ctx.fillText(pop.text,0,0);ctx.restore();}

function draw(){
 ctx.save();if(shake>.01){ctx.translate((Math.random()-.5)*shake*24,(Math.random()-.5)*shake*24);}
 drawBackdrop();drawTarget();drawTank();
 if(!ball&&lastPath.length){ctx.fillStyle='rgba(255,255,255,.45)';lastPath.forEach((q,i)=>{if(i%4)return;const p=P(q.x,q.y,q.z);ctx.beginPath();ctx.arc(p.x,p.y,Math.max(1.5,R*p.s*.18),0,7);ctx.fill();});}
 for(const p of parts)if(p.k==='drop'){const q=P(p.x,p.y,p.z);ctx.fillStyle='rgba(170,225,255,.9)';ctx.beginPath();ctx.ellipse(q.x,q.y,Math.max(1.5,p.r*q.s),Math.max(2,p.r*q.s*1.4),0,0,7);ctx.fill();}
 if(ball){drawShadow(ball);trail.forEach((q,i)=>{if(i%2||i<trail.length-24)return;const p=P(q.x,q.y,q.z);ctx.fillStyle=`rgba(255,240,190,${.15+.5*i/trail.length})`;ctx.beginPath();ctx.arc(p.x,p.y,R*p.s*.5,0,7);ctx.fill();});drawBallAt(ball.x,ball.y,ball.z);}
 drawArm();
 ctx.restore();
 ctx.fillStyle=grain();ctx.fillRect(0,0,W,H);
 drawBubble();drawPop();
}

/* ---------- go ---------- */
setCast(0);
requestAnimationFrame(frame);
</script>
