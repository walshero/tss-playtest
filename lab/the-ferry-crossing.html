<meta charset="utf-8">
<title>The Ferry Crossing</title>
<meta name="description" content="Six crossings on a river that is not on the map: what you keep, what you give, and what you can see by the end.">
<style>
:root{
  --bg:#e6dabd;--card:#f1e8d3;--ink:#17140f;--line:#3a342a;--accent:#0f5f5a;--amber:#b8741f;
  --sky1:#e3d6b6;--sky2:#efc9a2;--water:#2f5a66;--water2:#1c3a45;--mtn1:#9aa0b3;--mtn2:#636b84;--mtn3:#2f3447;
  --land:#1b1a17;--fig:#17140f;--stone:#6b6a66;--lamp:#e0a54c;--fog:#f3ead6;--moon:#f7f0dc;--dim:#0b0a08;
  --fs:20px;color-scheme:light;
}
:root[data-stop="2"]{--bg:#f4ede0;--card:#fbf7ee;--ink:#0d0b08;--sky1:#efe6cf;--sky2:#f5d6b8;--fog:#faf5ea}
:root[data-stop="3"]{--bg:#ffffff;--card:#ffffff;--ink:#000000;--line:#000000;--sky1:#ffffff;--sky2:#fbe9d6;--fog:#ffffff;--fig:#000000;--land:#000000}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){--bg:#22242a;--card:#2f3238;--ink:#efe9dc;--line:#c9c4b8;--accent:#7fd1c8;--amber:#e0a54c;
    --sky1:#1a1c24;--sky2:#43303b;--water:#193640;--water2:#0c1c23;--mtn1:#565c6e;--mtn2:#3a3f50;--mtn3:#20232d;
    --land:#0c0d10;--fig:#e6dfcf;--stone:#4a4c52;--lamp:#f0b35a;--fog:#4c5060;--moon:#eee6d2;--dim:#000000;color-scheme:dark}
  :root:not([data-theme="light"])[data-stop="2"]{--bg:#141519;--card:#202227;--ink:#f6f2e8;--sky1:#101117;--sky2:#2e2028;--fog:#3d404c}
  :root:not([data-theme="light"])[data-stop="3"]{--bg:#000000;--card:#141414;--ink:#ffffff;--line:#ffffff;--sky1:#000000;--sky2:#1a1218;--fog:#31343d;--fig:#ffffff}
}
:root[data-theme="dark"]{--bg:#22242a;--card:#2f3238;--ink:#efe9dc;--line:#c9c4b8;--accent:#7fd1c8;--amber:#e0a54c;
  --sky1:#1a1c24;--sky2:#43303b;--water:#193640;--water2:#0c1c23;--mtn1:#565c6e;--mtn2:#3a3f50;--mtn3:#20232d;
  --land:#0c0d10;--fig:#e6dfcf;--stone:#4a4c52;--lamp:#f0b35a;--fog:#4c5060;--moon:#eee6d2;--dim:#000000;color-scheme:dark}
:root[data-theme="dark"][data-stop="2"]{--bg:#141519;--card:#202227;--ink:#f6f2e8;--sky1:#101117;--sky2:#2e2028;--fog:#3d404c}
:root[data-theme="dark"][data-stop="3"]{--bg:#000000;--card:#141414;--ink:#ffffff;--line:#ffffff;--sky1:#000000;--sky2:#1a1218;--fog:#31343d;--fig:#ffffff}
:root[data-size="2"]{--fs:23px}:root[data-size="3"]{--fs:26px}

*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{background:var(--bg);color:var(--ink)}
body{margin:0;font:var(--fs)/1.5 "Iowan Old Style","Palatino Linotype",Palatino,"Book Antiqua",Georgia,serif}
.backdrop{position:fixed;inset:0;background:var(--bg);z-index:0}
.shell{position:relative;z-index:1;min-height:100vh;color:var(--ink)}
button{font:inherit;color:inherit}
:focus-visible{outline:4px solid var(--accent);outline-offset:3px}

/* top bar */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;display:flex;gap:10px;align-items:center;padding:10px 16px;background:var(--bg);border-bottom:2px solid var(--line)}
.bar .spacer{flex:1}
.btn{min-height:48px;min-width:48px;padding:8px 18px;border:2px solid var(--line);border-radius:4px;background:var(--card);color:var(--ink);cursor:pointer;font-size:max(18px,.9em);line-height:1.2}
.btn[aria-disabled="true"]{opacity:.55;cursor:default}
.btn.primary{background:var(--ink);color:var(--bg);border-color:var(--ink);box-shadow:inset 6px 0 0 var(--amber);padding-left:24px}
.brand{font-variant:small-caps;letter-spacing:.08em;font-size:max(18px,.9em)}
@media(max-width:560px){.brand{display:none}}
body[data-screen="title"] .brand{visibility:hidden}

.comfort{position:absolute;right:16px;top:calc(100% + 8px);width:min(340px,calc(100vw - 32px));background:var(--card);border:2px solid var(--line);border-radius:6px;padding:16px;display:grid;gap:14px;box-shadow:0 10px 30px rgba(0,0,0,.25)}
.comfort h3{margin:0;font-size:max(18px,.9em);font-variant:small-caps;letter-spacing:.06em}
.seg{display:flex;gap:8px;flex-wrap:wrap}
.seg .btn[aria-pressed="true"]{background:var(--ink);color:var(--bg)}

/* stage layout */
.stage{display:grid;grid-template-columns:1fr}
.art{position:relative;height:clamp(360px,60vh,680px);overflow:hidden;border-bottom:2px solid var(--line);background:var(--sky1)}
.art svg{position:absolute;inset:0;width:100%;height:100%;display:block}
body[data-screen="end"] .art{height:auto;aspect-ratio:1000/440;position:relative;top:0;border-right:0;border-bottom:2px solid var(--line)}
.panel{padding-block:22px 44px;padding-inline:16px;max-width:42rem;display:grid;gap:18px;align-content:start;animation:rise .5s ease both}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@media(min-width:960px){
  .stage{grid-template-columns:minmax(0,1.7fr) minmax(380px,1fr)}
  .art{height:calc(100vh - 72px);position:sticky;top:72px;border-bottom:0;border-right:2px solid var(--line)}
  body[data-screen="end"] .art{height:calc(100vh - 72px);aspect-ratio:auto;position:sticky;top:72px}
  .panel{padding-inline:36px;padding-block:36px}
}
.eyebrow{margin:0;font-variant:small-caps;letter-spacing:.1em;font-size:max(18px,.85em)}
.river{display:block;width:100%;max-width:420px;height:34px}
.carry{margin:0;font-size:max(18px,.9em);display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.carry svg{width:26px;height:26px;flex:none}
.carry .glyphs{display:inline-flex;gap:6px}
h1,h2{font-weight:700;line-height:1.1;margin:0;text-wrap:balance}
h1{font-size:clamp(44px,7.5vw,72px);font-style:italic;letter-spacing:-.01em}
h1 .rule{display:block;width:120px;height:6px;margin-top:10px;background:var(--amber);border-radius:3px}
h2{font-size:clamp(32px,4.4vw,44px)}
h1:focus,h2:focus,h3:focus{outline:none}
.prompt{margin:0;font-size:1.1em}
.prompt::first-letter{font-size:1.6em;line-height:1;float:left;padding-right:6px;padding-top:4px;font-style:italic}
.choices{display:grid;gap:12px;counter-reset:c}
.choice{display:grid;grid-template-columns:52px 1fr;align-items:center;gap:6px;width:100%;text-align:left;min-height:64px;padding:12px 16px 12px 0;border:2px solid var(--line);border-radius:4px;background:var(--card);color:var(--ink);cursor:pointer;font-size:1em;line-height:1.35;transition:transform .15s ease,box-shadow .15s ease}
.choice::before{counter-increment:c;content:counter(c,upper-roman);font-variant:small-caps;font-weight:700;font-size:max(18px,.9em);text-align:center;color:var(--amber);border-right:2px solid var(--line);padding:6px 0;margin-right:10px}
.choice:hover{transform:translateX(4px);box-shadow:-6px 0 0 var(--amber)}
.chosen{margin:0;font-style:italic}
.result{margin:0;font-size:1.1em;padding-left:14px;border-left:4px solid var(--amber)}
.actions{display:flex;gap:10px;flex-wrap:wrap}
.theory{border-top:2px solid var(--line);padding-top:18px;display:grid;gap:14px}
.theory h3{margin:0;font-size:1.2em}
.theory dl{margin:0;display:grid;gap:12px}
.theory dt{font-variant:small-caps;letter-spacing:.06em;font-weight:700;font-size:max(18px,.9em)}
.theory dd{margin:0}
.theory blockquote{margin:0;padding:10px 0 10px 18px;border-left:4px solid var(--ink);font-style:italic}
.theory cite{display:block;font-style:normal;font-size:max(18px,.85em);margin-top:6px}
.principle{margin:0;padding:16px 18px;border:3px solid var(--ink);border-left:12px solid var(--amber);border-radius:4px;font-size:1.1em}
.foot{font-variant:small-caps;letter-spacing:.08em;font-size:18px;margin:0}
.table-wrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:max(18px,.9em)}
th,td{text-align:left;padding:10px 8px;border-bottom:2px solid var(--line);vertical-align:top}
.legend{display:flex;gap:18px;flex-wrap:wrap;margin:0;padding:0;list-style:none}
.legend li{display:flex;align-items:center;gap:8px}

/* ---------- ART ---------- */
.fig{fill:var(--fig)}.land{fill:var(--land)}.stone{fill:var(--stone)}.lampf{fill:var(--lamp)}.fogf{fill:url(#fogGrad)}.moonf{fill:var(--moon)}.dimf{fill:var(--dim)}
.m1{fill:var(--mtn1)}.m2{fill:var(--mtn2)}.m3{fill:var(--mtn3)}
.sfig{stroke:var(--fig);fill:none}.slamp{stroke:var(--lamp);fill:none}.smoon{stroke:var(--moon);fill:none}.sstone{stroke:var(--stone);fill:none}
.g0{stop-color:var(--lamp);stop-opacity:.9}.g1{stop-color:var(--lamp);stop-opacity:0}
.f0{stop-color:var(--fog);stop-opacity:.8}.fm1{stop-color:var(--fog);stop-opacity:.6}.fm2{stop-color:var(--fog);stop-opacity:.22}.f1{stop-color:var(--fog);stop-opacity:0}
.s0{stop-color:var(--sky1)}.s1{stop-color:var(--sky2)}
.w0{stop-color:var(--water)}.w1{stop-color:var(--water2)}
#scene *{transition:opacity 1.2s ease,transform 1.4s ease,stroke-dashoffset 2s ease}
#scene.instant *{transition:none!important;animation:none!important}
.prop{display:none}
#scene[data-stage="1"] .p1,#scene[data-stage="3"] .p3,#scene[data-stage="4"] .p4,#scene[data-stage="5"] .p5,#scene[data-stage="6"] .p6{display:inline}
#dim{opacity:0}
#dusk{opacity:0}
#scene[data-stage="6"] #dusk{opacity:.55}
#scene[data-stage="6"] #moon,#scene[data-stage="6"] #moonPath{opacity:.35}
/* fog = sight */
#fog{opacity:.85;transition:opacity 2.4s ease}
#scene[data-fog="1"] #fog{opacity:.68}#scene[data-fog="2"] #fog{opacity:.51}#scene[data-fog="3"] #fog{opacity:.34}#scene[data-fog="4"] #fog{opacity:.17}#scene[data-fog="5"] #fog{opacity:0}
/* carried things */
.token,.purse{opacity:1}
#scene[data-name="0"] .token{opacity:0}
#scene[data-coin="0"] .purse{opacity:0}
#lampGlow,#lampFlame,#lampReflect{opacity:1}
#scene[data-lamp="0"] #lampGlow,#scene[data-lamp="0"] #lampFlame,#scene[data-lamp="0"] #lampBody,#scene[data-lamp="0"] #lampReflect{opacity:0}
/* boat per stage */
#boatpos{transform:translate(0,0)}
#scene[data-stage="3"] #boatpos{transform:translate(60px,-30px)}
#scene[data-stage="4"] #boatpos,#scene[data-stage="5"] #boatpos{transform:translate(190px,-60px)}
#scene[data-stage="6"] #boatpos{transform:translate(240px,-95px)}
#shoreTraveler{opacity:1}#shoreShadow{opacity:0}
#boatTraveler{opacity:0}
#scene[data-stage="3"] #shoreTraveler,#scene[data-stage="4"] #shoreTraveler,#scene[data-stage="5"] #shoreTraveler,#scene[data-stage="6"] #shoreTraveler,
#scene[data-stage="3"] #shoreShadow,#scene[data-stage="4"] #shoreShadow,#scene[data-stage="5"] #shoreShadow,#scene[data-stage="6"] #shoreShadow{opacity:0}
#scene[data-stage="3"] #boatTraveler,#scene[data-stage="4"] #boatTraveler,#scene[data-stage="5"] #boatTraveler,#scene[data-stage="6"] #boatTraveler{opacity:1}
#boatMove{transform:translate(0,0)}
#coinFly{opacity:0;transform:translate(0,0)}
#tokenFly{opacity:0;transform:translate(0,0)}
#lampFly{opacity:0;transform:translate(0,0)}
#namePath{stroke-dasharray:420;stroke-dashoffset:420}
/* ambient */
@keyframes drift{0%{transform:translateX(0)}50%{transform:translateX(26px)}100%{transform:translateX(0)}}
@keyframes drift2{0%{transform:translateX(0)}50%{transform:translateX(-22px)}100%{transform:translateX(0)}}
@keyframes flick{0%,100%{opacity:1}45%{opacity:.84}60%{opacity:.95}}
@keyframes ripple{0%{transform:translateX(0)}100%{transform:translateX(-90px)}}
@keyframes bob{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(3px) rotate(.4deg)}}
@keyframes sway{0%,100%{transform:rotate(0)}50%{transform:rotate(2.5deg)}}
#fog .f1,#fog .f3,#fog .f5{animation:drift 14s ease-in-out infinite}
#fog .f2,#fog .f4,#fog .f6{animation:drift2 18s ease-in-out infinite}
#lampFlick{animation:flick 3.4s ease-in-out infinite}
#ripples{animation:ripple 26s linear infinite}
#boatBob{animation:bob 5s ease-in-out infinite;transform-origin:100px 15px}
#reeds{animation:sway 6s ease-in-out infinite;transform-origin:180px 600px;transform-box:view-box}
/* parallax layers move by JS via --px */
#far{transform:translate(calc(var(--px,0)*-6px),calc(var(--py,0)*-3px))}
#mid{transform:translate(calc(var(--px,0)*-3px),calc(var(--py,0)*-2px))}
#near{transform:translate(calc(var(--px,0)*8px),calc(var(--py,0)*4px))}
#far,#mid,#near{transition:transform .6s ease}

/* STAGE 1 */
#stranger{opacity:1}#mapGlow{opacity:0}#sentFigure{opacity:0;transform:translate(0,0)}#mapHeld{opacity:0}
#scene[data-stage="1"][data-out="a"] #mapGlow{opacity:1}
#scene[data-stage="1"][data-out="a"] #stranger{opacity:0;transition-delay:1.2s}
#scene[data-stage="1"][data-out="a"] #mapHeld{opacity:1;transition-delay:1.2s}
#scene[data-stage="1"][data-out="b"] #stranger{opacity:0;transition-delay:1s}
#scene[data-stage="1"][data-out="c"] #stranger{opacity:0;transition-delay:.6s}
#scene[data-stage="1"][data-out="c"] #sentFigure{opacity:1;transform:translate(150px,80px);transition:opacity .6s ease,transform 1.6s ease-in-out .4s}
#scene[data-stage="1"][data-out="c"] #boatpos{opacity:1}
#scene[data-stage="1"] #boatpos{opacity:0}
#scene[data-stage="1"][data-out="c"] #boatMove{transform:translate(340px,-110px) scale(.8);transition:transform 3.4s ease-in-out 2s}
#scene[data-stage="1"][data-out="c"] #dim{opacity:.3;transition-delay:3.5s}
/* STAGE 2 */
#scene[data-stage="2"][data-out="a"] #coinFly{opacity:0;transform:translate(192px,58px);transition:transform .9s ease,opacity .25s ease .9s}
#scene[data-stage="2"][data-out="a"] #coinFly{animation:coinshow .9s linear both}
@keyframes coinshow{0%,99%{opacity:1}100%{opacity:0}}
#scene[data-stage="2"][data-out="a"] #shoreTraveler,#scene[data-stage="2"][data-out="a"] #shoreShadow{opacity:0;transition-delay:1.4s}
#scene[data-stage="2"][data-out="a"] #boatTraveler{opacity:1;transition-delay:1.4s}
#scene[data-stage="2"][data-out="a"] #boatMove{transform:translate(300px,-95px) scale(.86);transition:transform 3.2s ease-in-out 2s}
#scene[data-stage="2"][data-out="b"] #tokenFly{opacity:1;transform:translate(180px,190px);transition:opacity .2s ease,transform 1.6s ease-in .2s}
#scene[data-stage="2"][data-out="b"] #namePath{stroke-dashoffset:0;transition-delay:1.6s}
#scene[data-stage="2"][data-out="b"] #shoreTraveler{opacity:0;transition-delay:2.6s}
#scene[data-stage="2"][data-out="b"] #shoreShadow{opacity:.45;transition-delay:2.6s}
#scene[data-stage="2"][data-out="b"] #boatTraveler{opacity:1;transition-delay:2.6s}
#scene[data-stage="2"][data-out="b"] #boatMove{transform:translate(260px,-80px) scale(.9);transition:transform 3.2s ease-in-out 3s}
#scene[data-stage="2"][data-out="c"] #lampFly{opacity:1;transform:translate(150px,-10px);transition:opacity .2s ease,transform 1.4s ease}
#scene[data-stage="2"][data-out="c"] #lampFly{opacity:0;transition:transform 1.4s ease,opacity .5s ease 1.4s}
#scene[data-stage="2"][data-out="c"] #shoreTraveler,#scene[data-stage="2"][data-out="c"] #shoreShadow{opacity:0;transition-delay:1.6s}
#scene[data-stage="2"][data-out="c"] #boatTraveler{opacity:1;transition-delay:1.6s}
#scene[data-stage="2"][data-out="c"] #dim{opacity:.4;transition-delay:1.6s}
#scene[data-stage="2"][data-out="c"] #boatMove{transform:translate(280px,-90px) scale(.88);transition:transform 3.2s ease-in-out 2.2s}
/* STAGE 3 */
#heron{opacity:.95;transform:translate(0,0)}#washer{opacity:0}
#scene[data-stage="3"][data-out="a"] #heron{opacity:0;transform:translate(120px,-40px);transition-delay:.4s}
#scene[data-stage="3"][data-out="b"] #heron{opacity:0;transition-delay:1s}
#scene[data-stage="3"][data-out="b"] #washer{opacity:.95;transition-delay:1s}
#scene[data-stage="3"][data-out="c"] #near{transform:translate(-160px,60px);transition:transform 3s ease-in-out}
#scene[data-stage="3"][data-out="c"] #heron{opacity:.3;transition-delay:1.5s}
#scene[data-stage="3"][data-out="c"] #boatMove{transform:translate(120px,-40px) scale(.94);transition:transform 3s ease-in-out}
/* STAGE 4 */
#rings circle{opacity:0;transform:scale(.3);transform-box:fill-box;transform-origin:center}
#listener{opacity:1;transform:translate(0,0)}#leftThing{opacity:0;transform:translate(0,0)}
#scene[data-stage="4"] #rings circle{opacity:.35;transform:scale(1)}
#scene[data-stage="4"][data-out="a"] #listener{transform:translate(-210px,110px) scale(.5);transition:transform 2.6s ease-in-out .4s}
#scene[data-stage="4"][data-out="a"] #rings circle{opacity:.6}
#scene[data-stage="4"][data-out="b"] #lampGlow,#scene[data-stage="4"][data-out="b"] #lampFlame,#scene[data-stage="4"][data-out="b"] #lampReflect{opacity:0;transition-delay:1.6s}
#scene[data-stage="4"][data-out="b"] #rings circle{opacity:.7;transform:scale(1.35)}
#scene[data-stage="4"][data-out="b"] #dim{opacity:.25;transition-delay:1.6s}
#scene[data-stage="4"][data-out="c"] #leftThing{opacity:1;transform:translate(200px,-150px);transition:opacity .3s ease,transform 2.2s ease-in-out .3s}
#scene[data-stage="4"][data-out="c"] #rings circle{opacity:.15;transition-delay:2s}
/* STAGE 5 */
#cupBasin{opacity:1}#cupBoat{opacity:0}#cupGlowBoat{opacity:0}#basinGlow{opacity:.85}
#scene[data-water="carry"] #cupBoat,#scene[data-water="carry"] #cupGlowBoat{opacity:1}
#scene[data-stage="5"][data-out="a"] #cupBasin{opacity:0;transition-delay:.6s}
#scene[data-stage="5"][data-out="a"] #cupBoat,#scene[data-stage="5"][data-out="a"] #cupGlowBoat{opacity:1;transition-delay:1.2s}
#scene[data-stage="5"][data-out="a"] #basinGlow{opacity:.15;transition-delay:.6s}
#scene[data-stage="5"][data-out="b"] #cupBasin{opacity:0;transition-delay:.4s}
#scene[data-stage="5"][data-out="b"] #basinGlow{opacity:0;transition-delay:.4s}
#scene[data-stage="5"][data-out="c"] #cupBasin{opacity:.4;transition-delay:.6s}
#scene[data-stage="5"][data-out="c"] #basinGlow{opacity:1;transform:scale(1.5);transform-box:fill-box;transform-origin:center}
/* STAGE 6 */
#winGlow{opacity:.5}#winReflect{opacity:.5}
#scene[data-stage="6"][data-out="own"] #winGlow{opacity:1;transform:scale(2.6);transform-box:fill-box;transform-origin:center}
#scene[data-stage="6"][data-out="own"] #winReflect{opacity:1;transform:scaleX(2.2);transform-box:fill-box;transform-origin:center}
#scene[data-stage="6"][data-out="own"] #cupBoat{opacity:0;transition-delay:1s}
#scene[data-stage="6"][data-out="frame"] #winGlow{opacity:.85;transform:scale(1.4);transform-box:fill-box;transform-origin:center}
#scene[data-stage="6"][data-out="frame"] #waiter{transform:translate(-14px,10px)}
#scene[data-stage="6"][data-out="proof"] #lampGlow{opacity:1;transform:scale(1.8);transform-box:fill-box;transform-origin:center}
#scene[data-stage="6"][data-out="proof"] #fog{opacity:.85;transition-delay:1.2s}
#scene[data-stage="6"][data-out="lie"] #winGlow{opacity:.95}
#scene[data-stage="6"][data-out="lie"] #lampGlow,#scene[data-stage="6"][data-out="lie"] #lampFlame,#scene[data-stage="6"][data-out="lie"] #lampReflect{opacity:0;transition-delay:1s}
#scene[data-stage="6"][data-out="lie"] #dim{opacity:.3;transition-delay:1.4s}
#scene[data-stage="6"][data-out="silence"] #waiter{opacity:0;transition-delay:1.4s}
#scene[data-stage="6"][data-out="silence"] #winGlow,#scene[data-stage="6"][data-out="silence"] #window,#scene[data-stage="6"][data-out="silence"] #winReflect{opacity:.12;transition-delay:2s}
#scene[data-stage="6"][data-out="silence"] #boatMove{transform:translate(-40px,10px) scaleX(-1);transition:transform 1.6s ease}

@media (prefers-reduced-motion:reduce){#scene *{transition:none!important;animation:none!important}.panel{animation:none}}
</style>

<div class="backdrop" aria-hidden="true"></div>
<div class="shell">
  <header class="bar">
    <button class="btn" id="backBtn" type="button">Back</button>
    <button class="btn" id="homeBtn" type="button">Home</button>
    <span class="spacer"></span>
    <span class="brand">The Ferry Crossing</span>
    <button class="btn" id="comfortBtn" type="button" aria-expanded="false" aria-controls="comfort">Comfort</button>
    <div class="comfort" id="comfort" hidden>
      <h3 id="brightLabel">Brightness</h3>

<script>
(function(){
/* ---------- state ---------- */
function fresh(){return{lamp:1,name:1,coin:1,fog:0,oath:0,sent:0,water:"",picks:[],ending:""}}
var S=fresh(),snaps=[],i=-1,phase="choose",theoryOpen=false,endPhase="ask",guess=-1;

/* ---------- content ---------- */
var STAGES=[
{name:"The Call",campbell:"the Call to Adventure",
 scene:function(){return "A stranger on the near shore holds out a map with a blank space."},
 prompt:function(){return "A stranger comes down to the water. She has been walking for some time; you can tell by her shoes, which are the wrong shoes. She unrolls a map on the wet stones. Most of it is rivers and small careful writing. One space is blank, as if the pen had been afraid of it. “This,” she says, tapping the blank. “Somebody has to.”"},
 options:function(){return[
  {id:"a",label:"Swear an oath to find the source.",go:function(){S.oath=1},result:"You swear. She makes you say it twice, the second time slower. Then she rolls the map and puts it in your hands, and the blank space is a thing you own now, like a debt."},
  {id:"b",label:"Go because the space is blank.",go:function(){S.fog=Math.min(5,S.fog+1)},result:"You do not swear anything. You look at the blank space for so long that she gets uncomfortable and leaves. When you look up, the fog on the river has thinned, a little, as if it had been waiting for someone to look."},
  {id:"c",label:"Send someone else in your place.",go:function(){S.sent=1},result:"There is a young man who is always around. You give him the map. He takes the boat that night, whistling. By spring he has not come back, and the whole town has started saying his name in the past tense, and you cannot stand the sound of it. You go."}]},
 theory:{hero:"The pattern opens with a summons, and a refusal usually only delays it.",
  conrad:"Conrad’s travelers don’t answer a noble summons. They go because a place is unknown. Curiosity, not destiny.",
  myth:"Old stories start the journey many ways: a message, a dream, a stranger at the door, a debt. What they share is that the world changes shape before the traveler moves.",
  quote:"At that time there were many blank spaces on the earth, and when I saw one that looked particularly inviting on a map (but they all look that way) I would put my finger on it and say, When I grow up I will go there.",
  cite:"Joseph Conrad, Heart of Darkness (1899). Public domain."}},
{name:"Crossing Over",campbell:"the Crossing of the First Threshold",
 scene:function(){return "The ferryman waits at the river mouth, hand out. Fog lies on the water."},
 prompt:function(){return "The ferryman is smaller than you expected and older than anyone you have met. He does not say hello. He holds out his hand, palm up, the way you would to check for rain. “Everyone pays,” he says. “Choose what with.” He looks at your lamp, then your coin, then, for a long moment, at your face."},
 options:function(){return[
  {id:"a",label:"Give him the coin.",go:function(){S.coin=0},result:"The coin leaves your hand and goes somewhere inside his coat, where it makes no sound at all. He pushes off. The fog does not move. You get the feeling it has seen this transaction before."},
  {id:"b",label:"Give him your name.",go:function(){S.name=0;S.fog=Math.min(5,S.fog+1)},result:"He asks you to say it. You say it. He sets the carved token on the water, and instead of floating it goes straight down, like it knows the way. On the shore behind you, your shadow has stayed where you were standing. It does not seem to have noticed you are gone. The fog thins."},
  {id:"c",label:"Give him the lamp.",go:function(){S.lamp=0;S.fog=Math.min(5,S.fog+1)},result:"He hangs your lamp on his own post, turned toward the far bank, so the light goes ahead of you and never comes back. You cross in the dark. Things will arrive as shapes now, and names later, if at all."}]},
 theory:{hero:"The threshold has a guardian and a price. In the pattern the hero pays it and passes into the unknown world.",
  conrad:"For Conrad, crossing costs you an earlier self. His 1917 novel The Shadow-Line is named for this: the line you notice only as you step over it.",
  myth:"Ferrymen ask a fee in many traditions: a coin, a story, a promise, a name. What the traveler hands over is the first clue to what kind of story this will be.",
  quote:"One goes on. And the time, too, goes on—till one perceives ahead a shadow-line warning one that the region of early youth, too, must be left behind.",
  cite:"Joseph Conrad, The Shadow-Line (1917). Public domain."}},
{name:"The River",campbell:"the Road of Trials",
 scene:function(){return S.lamp?"Something moves on the far bank, half seen in the lamplight.":"The boat in darkness. Something moves on the far bank, unseen."},
 prompt:function(){return S.lamp?"Something on the bank is moving in a way that is either a bird or a person or a bush that has decided to become one of those. The lamp makes it a shape. That is all the lamp is willing to do.":"You have no lamp. Something on the bank is making a sound, a careful, repeated sound, like someone trying to be quiet with a jar. It is only a sound. It has all the time in the world."},
 options:function(){return S.lamp?[
  {id:"a",label:"Raise the lamp and drive it off.",go:function(){},result:"You raise the lamp and shout the sort of thing one shouts. The shape backs into the reeds, offended. You will never know what it was, and it will never know what you were. The fog stays."},
  {id:"b",label:"Cover the lamp and watch.",go:function(){S.fog=Math.min(5,S.fog+1)},result:"You cover the lamp. In the dark the shape becomes a heron, then a woman washing something she does not want washed, then a heron again, and you understand it was never going to hold still for you. The fog thins."},
  {id:"c",label:"Steer for the middle and keep going.",go:function(){},result:"You steer for the middle, where there is nothing to look at and nothing to lose. The bank falls away. The river gets wide the way a silence gets wide. Nothing learned. Nothing lost. Not nothing, though."}]:[
  {id:"a",label:"Call out.",go:function(){},result:"You call out. Your own voice comes back off the water, slightly wrong, like a voice that has been somewhere. The sound on the bank stops. The fog stays."},
  {id:"b",label:"Wait until the sounds explain themselves.",go:function(){S.fog=Math.min(5,S.fog+1)},result:"You wait. Wings. Then water poured from a jar. Then wings again. Then someone humming a tune you know from somewhere you cannot place. You know the bank now, without ever seeing it, better than you know some rooms."},
  {id:"c",label:"Steer blind for the middle.",go:function(){},result:"You steer for the middle, where there is nothing to look at and nothing to lose. The bank falls away. The river gets wide the way a silence gets wide. Nothing learned. Nothing lost. Not nothing, though."}]},
 theory:{hero:"Trials test the hero and prove them. Each one won makes them stronger.",
  conrad:"Conrad’s trials don’t make you stronger. They take away what you thought you knew. He gives you the sensation first and the cause later; the critic Ian Watt called this delayed decoding.",
  myth:"Journeys down through gates are old: Inanna loses something at each of seven; the Egyptian night-boat passes twelve. The traveler arrives with less and knows more.",
  quote:"Sticks, little sticks, were flying about—",
  cite:"Joseph Conrad, Heart of Darkness (1899). You feel the sticks before you learn they are arrows. Public domain."}},
{name:"The Listener",campbell:"the Ordeal",
 scene:function(){return "At the river’s source sits a huge figure, and the air around it moves in rings, like a voice."},
 prompt:function(){return S.sent?"At the source, on a stone the size of a house, sits the young man you sent. He is older than you now. He has given away everything he carried, one thing at a time, and is now, having nothing, talking. He talks the way rain talks. It does not stop for you.":"At the source, on a stone the size of a house, sits someone who has given away everything they ever carried, one thing at a time, and is now, having nothing, talking. They talk the way rain talks. It does not stop for you. It does not stop for anything."},
 options:function(){var has=S.lamp||S.coin;return[
  {id:"a",label:"Bring them back by force.",go:function(){},result:has?"You get an arm around them and drag. They come, talking. They talk in the boat. They talk while you tie up. You have kept everything you carried and learned nothing at all, and the fog, for its part, stays exactly where it was.":"You have nothing to hold them with, and nothing to offer, and your arms have gotten very tired. They slide back onto the stone like water finding its level. The fog stays."},
  {id:"b",label:S.lamp?"Sit and listen until your lamp burns out.":"Sit and listen in the dark.",go:function(){S.lamp=0;S.fog=Math.min(5,S.fog+2)},result:S.lamp?"You sit. The lamp burns lower. You do not refill it. At some point it goes out, and you notice that you did not notice, because you were listening. When you stand, your knees have opinions, and the fog is almost gone.":"You sit in the dark and listen. It takes a night and a day. When you stand, the fog is almost gone, and you cannot remember a single sentence, only that they were all true."},
  {id:"c",label:"Leave them the last thing you carry.",go:function(){if(S.coin)S.coin=0;else if(S.name)S.name=0;else if(S.lamp)S.lamp=0;S.fog=Math.min(5,S.fog+1)},result:S.coin?"You set the coin on the stone beside them. They do not look at it. Nobody up here has looked at a coin in years. The fog thins anyway.":S.name?"You set the carved token on the stone. They say your name once, quietly, and it is theirs now, and it sounds better on them. The fog thins.":S.lamp?"You leave the lamp burning on the stone and walk back to the boat in the dark, by memory, which turns out to be enough. The fog thins.":"You have nothing left to leave. You leave your place in the boat, which was the last thing, and sit with them a while. The fog thins."}]},
 theory:{hero:"At the center of the journey, the hero faces the greatest power and comes through, often by defeating it.",
