<!-- Choose Your Leader: One Family — v1 (LAB) — 2026-10-17
  Chapter 1 of 2: 1960-1969. Built from claude/CYL-ONE-FAMILY-DESIGN-BRIEF-2026-10-17.md.
  Founder (voice, 2026-10-17): one family across sixty years; read the candidates' words without names,
  vote on that read alone, see the real result, then who said what. The vote never changes history.
  Founder calls taken by the studio while unanswered (recommendations from the brief, section 7):
    household = player picks one of the three homes (three-homes canon); text only, no audio;
    forks F1 (the house) and F2 (the brother and the lottery) in this chapter.
  COPY: every family line and stage direction is STUDIO PLACEHOLDER awaiting founder words (drift ruling,
    order 2). Quoted ballot lines, election results and address records are sourced (see SOURCES below).
  Address scenes (quote, record, source, who carried it) are reused verbatim from choose-your-leader-v7.html.
  Art: the three v7 plates (no faces, photographic room), recompressed. Single file, offline, no external hosts.
  SOURCES: ballot lines, American Presidency Project (UCSB): Kennedy and Nixon acceptance addresses (July 15 and
    July 28, 1960); Johnson and Goldwater acceptance addresses (Aug 27 and July 16, 1964); 1968 Republican,
    Democratic and American Independent party platforms. Results: UCSB election statistics 1960, 1964, 1968.
    Lottery: Selective Service System, Vietnam lotteries (Dec 1, 1969; men born 1944-1950; numbers through 195
    called to report in 1970). Research cards: Aaronson, Hartley & Mazumder (HOLC maps); Angrist, AER 1990.

/* ── the three addresses, verbatim from choose-your-leader-v7.html ── */

const TRUST=["Not much","Some","Mostly","Fully"];

/* ── state ── */
const S={home:null,reads:{},trust:{},house:null,brother:null,lottery:null,table:[],hist:[]};
const $=id=>document.getElementById(id);
function esc(t){return String(t).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function put(strand,text,key){key=key||text; const i=S.table.findIndex(t=>t.key===key); const e={strand,text,key}; if(i>=0) S.table[i]=e; else S.table.push(e); drawStrip()}
const STRAND={choice:"CHOICE",policy:"POLICY",chance:"CHANCE"};
function drawStrip(){
  $('strip').hidden=!S.table.length;
  $('stripList').innerHTML=S.table.map(t=>'<li><span class="strand s-'+t.strand+'">'+STRAND[t.strand]+'</span>'+esc(t.text)+'</li>').join('');
}
function scene(plate,era,label,overlay){
  const st=$('stage'); st.className='stage '+(era||'');
  const p=$('plate'); if(p.dataset.k!==plate){p.src=PLATE[plate];p.dataset.k=plate} p.alt=ALT[plate];
  $('era').textContent=label||''; $('over').innerHTML=overlay||'';
}
function show(id,html){ document.querySelectorAll('#panel .screen').forEach(x=>{x.hidden=x.id!=='sc-'+id; if(x.hidden) x.innerHTML=''}); const el=$('sc-'+id); el.innerHTML=html; window.scrollTo(0,0) }
function on(id,fn){const e=$(id); if(e) e.addEventListener('click',fn)}
function go(fn){S.hist.push(fn); fn()}
on('backBtn',()=>{ if(S.hist.length>1){S.hist.pop(); S.hist[S.hist.length-1]()} else location.href='../index.html' });

const CURTAIN='<svg class="curtain" viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true"><path d="M0 0H34C30 30 36 60 30 100H0Z" fill="#5b1d1d" opacity=".93"/><path d="M100 0H66C70 30 64 60 70 100H100Z" fill="#5b1d1d" opacity=".93"/><rect x="0" y="0" width="100" height="5" fill="#2a1b10"/></svg>';
const CAPSULE='<svg class="capsule" viewBox="0 0 150 84" aria-hidden="true"><rect x="6" y="18" width="138" height="48" rx="24" fill="#2f5fa8" stroke="#fff" stroke-width="3"/><rect x="75" y="18" width="69" height="48" rx="24" fill="#5a86c9"/></svg>';

/* ── 1. which house ── */
function sHome(){
  scene('room','e60','1960');
  show('home','<p class="eyebrow">Chapter 1 of 2 · 1960 to 1969</p><h2>Which house is yours?</h2>'
   +'<p class="lede">One family, six elections, sixty years. You start as a child in 1960. The same front room, every year.</p>'
   +Object.keys(HOMES).map(k=>'<button class="btn" id="h-'+k+'"><b>'+esc(HOMES[k].name)+'</b><br><span class="quiet">'+esc(HOMES[k].line)+'</span></button>').join(''));
  Object.keys(HOMES).forEach(k=>on('h-'+k,()=>{S.home=k; go(()=>sBooth(1960))}));
}

/* ── 2. the booth ── */
function sBooth(y){
  const B=BALLOTS[y]; if(!B.order) B.order=shuffle(B.lines.map((_,i)=>i));
  scene('room',B.era,'November '+y,CURTAIN);
  show('booth','<p class="eyebrow">The booth · '+y+'</p><h2>Which one sounds right?</h2>'
   +'<p class="lede">'+esc(B.voter)+' is voting. '+esc(B.age)+' No names. Only the words.</p>'
   +B.order.map((i,n)=>'<button class="btn quote" id="v-'+i+'"><span class="quiet">Candidate '+String.fromCharCode(65+n)+'</span><br>“'+esc(B.lines[i].q.replace(/^“|”$/g,''))+'”</button>').join('')
   +'<button class="btn" id="v-none">Leave it blank</button><p class="quiet">'+esc(B.kind)+'</p>');
  B.order.forEach(i=>on('v-'+i,()=>{S.reads[y]=i; go(()=>sResult(y))}));
  on('v-none',()=>{S.reads[y]=null; go(()=>sResult(y))});
}
function sResult(y){
  const B=BALLOTS[y]; scene('room',B.era,'Election night, '+y);
  show('result','<p class="eyebrow">The result · '+y+'</p><h2>The country chose</h2>'
   +'<table class="res"><thead><tr><th>Candidate</th><th>Party</th><th>Electoral</th><th>Popular</th></tr></thead><tbody>'
   +B.rows.map(r=>'<tr>'+r.map(c=>'<td>'+esc(c)+'</td>').join('')+'</tr>').join('')+'</tbody></table>'
   +'<p class="quiet">'+esc(B.note)+'</p><p class="quiet">Source: American Presidency Project, UCSB, election statistics.</p>'
   +'<div class=\"act\"><button class=\"btn primary\" id=\"next\">Who said what</button></div>');
  on('next',()=>go(()=>sReveal(y)));
}
function sReveal(y){
  const B=BALLOTS[y], r=S.reads[y];
  scene('room',B.era,y);
  const mine=r===null?'You left it blank.':'Your read: Candidate '+String.fromCharCode(65+B.order.indexOf(r))+'. That was '+B.lines[r].who+', who '+(r===B.winner?'won.':'lost.');
  show('reveal','<p class="eyebrow">The reveal · '+y+'</p><h2>Who said what</h2>'
   +B.order.map((i,n)=>'<div class="card"><p class="quiet">Candidate '+String.fromCharCode(65+n)+(i===r?' · your read':'')+'</p><p class="quote">“'+esc(B.lines[i].q)+'”</p><p><b>'+esc(B.lines[i].who)+'</b>, '+esc(B.lines[i].party)+'</p><p class="src">'+esc(B.lines[i].src)+'</p></div>').join('')
   +'<p class="lede"><b>'+esc(mine)+'</b> The vote did not change history. It was your read.</p>'
   +'<div class=\"act\"><button class=\"btn primary\" id=\"next\">Back to the house</button></div>');
  on('next',()=>go(AFTER[y]));
}

/* ── 3. an address, in the same room (v7's delta: rate blind, the record turns, rate again) ── */
function sAddress(k){
  const A=ADDR[k], era={jfk62:'e60',lbj64:'e64',nixon69:'e69'}[A.id];
  scene('tv',era,A.when);
  show('address','<p class="eyebrow">'+esc(A.when)+' · '+esc(A.leader)+'</p><h2>The set is on</h2>'
   +'<p class="lede">'+esc(A.roomLine)+' Your family hears it '+esc(HOMES[S.home].medium)+', too, in time.</p>'
   +'<p class="quote">“'+esc(A.quote)+'”</p><p class="quiet">'+esc(A.reach)+'</p>'
   +'<p><b>With only this, how much do you trust it?</b></p><div class="act row">'+TRUST.map((t,i)=>'<button class="btn" id="t-'+i+'">'+t+'</button>').join('')+'</div>');
  TRUST.forEach((_,i)=>on('t-'+i,()=>{S.trust[A.id]={before:i}; go(()=>sRecord(k))}));
}
function sRecord(k){
  const A=ADDR[k], era={jfk62:'e60',lbj64:'e64',nixon69:'e69'}[A.id];
  scene('tv',era,A.when);
  show('record','<p class="eyebrow">The record turns</p><h2>What was happening</h2>'
   +'<div class="card"><p>'+esc(A.life)+'</p><p class="src">'+esc(A.src)+'</p></div>'
   +'<p>'+esc(A.whoPaid)+'</p><p><b>Same words. How much do you trust them now?</b></p><div class="act row">'+TRUST.map((t,i)=>'<button class="btn" id="t-'+i+'">'+t+'</button>').join('')+'</div>');
  TRUST.forEach((_,i)=>on('t-'+i,()=>{S.trust[A.id].after=i; put('policy',A.when+': '+A.leader+'’s address. Your trust: '+TRUST[S.trust[A.id].before]+' → '+TRUST[i]+'.','addr-'+A.id); go(AFTER[A.id])}));
}

/* ── 4. fork F1: the house ── */
function sHouse(){
  scene('room','e64','1963');
  const open=HOMES[S.home].buyOpen;
  show('house','<p class="eyebrow">1963 · the kitchen table</p><h2>The new houses at the edge of town</h2>'
   +'<p class="lede">A sales office in a trailer. A model home with the lights on. Your parents talk late, at the table.</p>'
   +(open?'<button class="btn" id="buy">Buy, with a thirty-year mortgage</button>':'<button class="btn" id="buy" aria-disabled="true">Buy, with a thirty-year mortgage<br><span class="quiet">Not offered to this family</span></button>')
   +'<button class="btn" id="rent">Keep renting where you are</button>'
   +(open?'':'<div class="card"><p>Many new subdivisions would not sell to Black families, and the federal mortgage rules of the era backed that. The button is here so you can see what was not offered.</p><p class="src">Aaronson, Hartley &amp; Mazumder, “The Effects of the 1930s HOLC ‘Redlining’ Maps,” Federal Reserve Bank of Chicago.</p></div>'));
  on('buy',()=>{ if(!open) return; S.house='buy'; put('choice','1963: Your parents bought the house on the new street.','house'); go(()=>sHouseNote())});
  on('rent',()=>{ S.house='rent'; if(open) put('choice','1963: Your parents kept renting.','house'); else put('policy','1963: The new street was closed to your family. They kept renting.','house'); go(()=>sHouseNote())});
}
function sHouseNote(){
  scene('room','e64','1963');
  const t=S.house==='buy'
   ?'A mortgage is a bill every month for thirty years. It is also the way most middle-class families of this era built what they would leave behind: the house itself.'
   :(HOMES[S.home].buyOpen?'Renting keeps cash in the drawer for now. Nothing is being paid off; nothing is being built up.'
     :'In neighborhoods marked as risky on the 1930s federal maps, homeownership, home values and rents stayed lower for decades.');
  show('housenote','<p class="eyebrow">What research finds for families like this one</p><h2>The house keeps the score</h2><div class="card"><p>'+esc(t)+'</p><p class="src">Aaronson, Hartley &amp; Mazumder, Federal Reserve Bank of Chicago (HOLC maps and later homeownership and house values).</p></div>'
   +'<p class="quiet">This is a direction, not a dollar figure. The game does not compute what your family is worth.</p><button class="btn primary" id="next">August 1964</button>');
  on('next',()=>go(()=>sAddress(1)));
}

/* ── 5. policy that arrives on its own ── */
function sPolicy(stepTo,date,title,body,src){
  scene('room','e68',date);
  put('policy',date+': '+title+'.');
  show('policy','<p class="eyebrow">'+esc(date)+' · enacted, not chosen</p><h2>'+esc(title)+'</h2><div class="card"><p>'+esc(body)+'</p><p class="src">'+esc(src)+'</p></div><div class="act"><button class="btn primary" id="next">Go on</button></div>');
  on('next',()=>go(stepTo));
}

/* ── 6. fork F2: the brother, then the lottery (chance) ── */
function sBrother(){
  scene('room','e68','Fall 1968');
  show('brother','<p class="eyebrow">Fall 1968 · your brother is eighteen</p><h2>College, or the plant?</h2>'
   +'<p class="lede">The plant is hiring on Monday. The state college letter came in April. You are fourteen and you are listening from the stairs.</p>'
   +'<button class="btn" id="col">College, with a student deferment</button><button class="btn" id="plant">The plant, starting Monday</button>'
   +'<p class="quiet">In 1968 a full-time student could hold a draft deferment until graduation.</p>');
  on('col',()=>{S.brother='college'; put('choice','1968: Your brother went to college.','brother'); go(()=>sBooth(1968))});
  on('plant',()=>{S.brother='plant'; put('choice','1968: Your brother took the job at the plant.','brother'); go(()=>sBooth(1968))});
}
function sLottery(){
  if(S.lottery===null) S.lottery=1+Math.floor(Math.random()*366);
  const n=S.lottery, called=n<=195;
  scene('room','e69','December 1, 1969',CAPSULE);
  put('chance','December 1, 1969: Your brother’s birthday came out at number '+n+'.');
  const what=called?(S.brother==='college'?'His number is called, but his deferment holds until he finishes school.':'His number is called. He reports for his physical in the spring.'):'His number is not reached. He is not called in 1970.';
  show('lottery','<p class="eyebrow">December 1, 1969 · on television</p><h2>Number '+n+'</h2>'
   +'<p class="lede">366 capsules, one for every birthday, drawn by hand on live television. Men born from 1944 to 1950. Numbers 1 through 195 were called to report in 1970.</p>'
   +'<p><b>'+esc(what)+'</b></p><p class="quiet">Nobody in this house chose the number.</p>'
   +'<div class="card"><p>Years later, white men who served in the Vietnam era were earning about 15 percent less than comparable men who did not. That estimate is for white veterans only.</p><p class="src">Angrist, “Lifetime Earnings and the Vietnam Era Draft Lottery,” American Economic Review, 1990. Lottery: Selective Service System.</p></div>'
   +'<div class=\"act\"><button class=\"btn primary\" id=\"next\">What the table holds</button></div>');
  on('next',()=>go(sEnd));
}

/* ── 7. the braid: chapter end ── */
function sEnd(){
  scene('chair','e69','End of chapter 1');
  const col=s=>S.table.filter(t=>t.strand===s).map(t=>'<li>'+esc(t.text)+'</li>').join('')||'<li>Nothing.</li>';
  const reads=[1960,1964,1968].map(y=>{const B=BALLOTS[y],r=S.reads[y];return '<tr><td>'+y+'</td><td>'+(r===null||r===undefined?'Blank':esc(B.lines[r].who))+'</td><td>'+esc(B.rows[B.winner][0])+'</td></tr>'}).join('');
  show('end','<p class="eyebrow">1969 · end of chapter 1</p><h2>What the table holds</h2>'
   +'<p class="lede">Everything that changed in this house came from one of three places. Which were yours?</p>'
   +'<div class="card"><p><span class="strand s-choice">CHOICE</span>What your family did</p><ul>'+col('choice')+'</ul></div>'
   +'<div class="card"><p><span class="strand s-policy">POLICY</span>What was enacted and said</p><ul>'+col('policy')+'</ul></div>'
   +'<div class="card"><p><span class="strand s-chance">CHANCE</span>What nobody chose</p><ul>'+col('chance')+'</ul></div>'
   +'<table class="res"><thead><tr><th>Year</th><th>Your read</th><th>The country</th></tr></thead><tbody>'+reads+'</tbody></table>'
   +'<p class="quiet">Chapter 2, the same room in 2012, is not built yet.</p>'
   +'<div class=\"act\"><button class=\"btn primary\" id=\"again\">Play again from another house</button></div>');
  on('again',()=>{Object.assign(S,{home:null,reads:{},trust:{},house:null,brother:null,lottery:null,table:[],hist:[]});Object.values(BALLOTS).forEach(B=>delete B.order);drawStrip();go(sHome)});
}

/* ── the order of the chapter ── */
const AFTER={
  1960:()=>sAddress(0),
  jfk62:()=>sHouse(),
  lbj64:()=>sPolicy(()=>sBooth(1964),'July 2, 1964','The Civil Rights Act is signed','It bans discrimination in public places and in hiring. It is signed a month before the August address.','Civil Rights Act of 1964, Pub. L. 88-352.'),
  1964:()=>sPolicy(sBrother,'April 11, 1968','The Fair Housing Act is signed','It makes it illegal to refuse to sell or rent a home because of race. A law on paper; the next chapter shows what it did on the street.','Civil Rights Act of 1968, Title VIII, Pub. L. 90-284.'),
  1968:()=>sAddress(2),
  nixon69:()=>sLottery()
};
go(sHome);
</script>
<script>
/* TSP DARK TOGGLE v1 (founder 2026-10-17, option A) */
(function(){
  var root=document.documentElement, btn=document.getElementById('tspDark');
  if(!btn) return;
  var A=btn.getAttribute('data-attr')||'data-light', D=btn.getAttribute('data-dark')||'night',
      L=btn.getAttribute('data-lightval')||'day', canSave=!btn.hasAttribute('data-nosave');
  function isDark(){ return root.getAttribute(A)===D; }
  function set(dark, save){
    root.setAttribute(A, dark ? D : L);
    btn.setAttribute('aria-pressed', dark ? 'true' : 'false');
    if(save && canSave){ try { localStorage.setItem('tsp-dark', dark ? '1' : '0'); } catch(e){} }
  }
  var saved=null; try { saved=localStorage.getItem('tsp-dark'); } catch(e){}
  var osDark=false; try { osDark=window.matchMedia('(prefers-color-scheme: dark)').matches; } catch(e){}
  set(saved!==null ? saved==='1' : (isDark() || osDark), false);
  btn.addEventListener('click', function(){ set(!isDark(), true); });
})();
</script>
