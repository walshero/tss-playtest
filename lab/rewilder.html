<!-- TSP build: Rewilder v0.2 | LAB | 2026-11-09
     v0.2 (founder: "1 rec works to try. Let's get more amusement and joy out of the art ... Breaking has to
     be more challenging. Higher. More resistance. More complicated."):
     BREAKING. Structures are grids of blocks, up to ten floors. Panels break with a tap. Steel holds the
     floor up and only gives to a tail slam (hold Smash, let go). Steel is braced by the panel beside it and
     locks under the weight of more than two floors, so the work starts near the top. Drop a floor and the
     floors above pancake down and take a shock. Each site pushes back: cars drop from the garage, traffic
     runs the highway deck, steam vents fire on the coal plant, spillway jets sweep the dam, and repair
     lifts ride up to weld the damage shut.
     FLOWS (recommendation 1). The five sites share water, air, heat, habitat, and human needs. Each cleared
     site offers two things to grow. Rain floods young growth when hard ground outweighs soaking ground.
     The dam holds back sediment that buries young water sites when it falls. Pave crews come because a need
     is unmet. A Lens button slows time and names the flows. The flow model is a simplified studio
     invention; each field note is a sourced real project.
     ART. Toy-theater staging: clouds and sun on threads, paper grain, cut-paper critters that come back as
     flows heal, paper sound words, a beaver that blinks, winds up, spins, and cheers.
     v0.1 founder words (2026-11-09): "Make a game like the classic arcade game rampage where the objective
     is to mash down ecologically damaging infrastructure while making space for nature and more symbiotic
     infrastructure to grow in its place."
     Single file, offline, no external hosts. No emoji. Three modes on one button. -->

<script>
"use strict";
const $=id=>document.getElementById(id);
const cv=$('game'),ctx=cv.getContext('2d');
const RM=matchMedia('(prefers-reduced-motion: reduce)').matches;
const GY=500,WORLD=3300,INK='#1b1328',DISPLAY='900 %px Rockwell,"Roboto Slab","Bookman Old Style",Georgia,serif';
const store={get(k,d){try{const v=localStorage.getItem('rw_'+k);return v===null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem('rw_'+k,JSON.stringify(v))}catch(e){}}};

/* ---------- field notes: sourced real projects ---------- */
const NOTES={
 garage:{title:'What Yonkers did with a parking lot',lab:'Field note: Yonkers, New York',
  text:'Yonkers buried the Saw Mill River under its downtown in the 1920s. The city tore up a parking lot at Larkin Plaza and opened the river to the sky again; the first phase opened in 2012, and fish turned up in the new channel within months.',
  src:[['Groundwork Hudson Valley: Story of the Daylighting','https://www.groundworkhv.org/?p=5907'],['ENR: Daylighting of Saw Mill River at Larkin Plaza','https://enr.com/articles/11750-day-lighted-river-brings-water-up-to-the-people']]},
 highway:{title:'What Boston did with a highway',lab:'Field note: Boston, Massachusetts',
  text:'The elevated Central Artery cut downtown Boston off from its waterfront for decades. The Big Dig moved the highway underground, and the Rose Kennedy Greenway opened on top of it in 2008. Critics point out that traffic still shapes how people cross it.',
  src:[['The Cultural Landscape Foundation: Rose Fitzgerald Kennedy Greenway','https://www.tclf.org/rose-fitzgerald-kennedy-greenway'],['JSTOR Daily: How the Big Dig changed Boston','https://daily.jstor.org/how-the-big-dig-changed-bostons-landscape/']]},
 coal:{title:'What Somerset is doing with a coal plant',lab:'Field note: Somerset, Massachusetts',
  text:'Brayton Point was the largest coal plant in New England. It closed in 2017, and the state picked the site for a factory that makes undersea cables for offshore wind. The wind plans have hit real delays since, which is how most transitions actually go.',
  src:[['WBUR: Last coal-burning power plant in Mass. shuts down','https://www.wbur.org/news/2017/05/31/brayton-power-plant-somerset'],['Yale Environment 360: Former coal site to become offshore wind plant','https://e360.yale.edu/digest/for-coal-power-site-to-become-offshore-wind-plant']]},
 lot:{title:'What Portland does with parking lots',lab:'Field note: Portland, Oregon',
  text:'Since 2008, volunteers with the nonprofit Depave have pried up parking lots by hand with crowbars and wheelbarrows. Where the asphalt was, they plant gardens, rain gardens, nature playgrounds, and shade trees.',
  src:[['Depave','https://depave.org/'],['Streetsblog USA: Depaving paradise','https://usa.streetsblog.org/2019/06/12/depaving-paradise-grassroots-portland-group-dismantles-parking-lots-by-hand']]},
 dam:{title:'What the Elwha did without its dams',lab:'Field note: Elwha River, Washington',
  text:'Two dams blocked salmon on the Elwha River for about a century. Crews took both down, the last in 2014. That September, Chinook salmon swam above the old Glines Canyon dam site for the first time in 102 years. The sediment the dams had held back washed down and built new shoreline at the river mouth.',
  src:[['National Park Service: First salmon return to the Upper Elwha in 102 years','https://www.nps.gov/olym/learn/news/three-chinook-spotted-above-glines-canyon.htm'],['Rewilding Institute: Ten years after dam removal on the Elwha','https://rewilding.org/what-the-river-teaches-ten-years-after-dam-removal-on-the-elwha-river/']]}
};
/* ---------- what can grow: the flow model is a simplified studio invention ---------- */
const CH={
 river:{name:'Daylight the river',does:'Soaks up storm water and makes habitat. It grows slowly while the dam holds the river back.',soak:2,hab:2,water:1,short:'open river'},
 hub:{name:'Build a transit hub',does:'Meets the need to get around, so fewer pave crews come. It soaks up little rain.',soak:.5,hab:0,travel:2,short:'transit hub'},
 park:{name:'Plant a park',does:'Cools its neighbors, makes habitat, and soaks up some rain.',soak:1,hab:2,short:'park'},
 tram:{name:'Lay a tram boulevard',does:'Meets the need to get around. Its street trees add a little habitat.',soak:.5,hab:1,travel:2,short:'tram boulevard'},
 wind:{name:'Raise a wind port',does:'Meets the need for power. It adds little habitat.',soak:.5,hab:0,power:2,short:'wind port'},
 woods:{name:'Grow a woodland',does:'Makes the most habitat and shade, and soaks up rain. It makes no power.',soak:1.5,hab:2,short:'woodland'},
 rain:{name:'Dig a rain garden',does:'Soaks up the most storm water for its size.',soak:2,hab:1,water:1,short:'rain garden'},
 canopy:{name:'Put up a solar canopy',does:'Makes some power and shade. Rain still runs off it.',soak:0,hab:0,power:1,short:'solar canopy'},
 free:{name:'Let the river run',does:'Salmon come back. It makes the most habitat.',soak:1,hab:2,short:'free river'},
 wet:{name:'Let beavers build a wetland',does:'A leaky stick dam holds storm water better than anything else here.',soak:3,hab:1,short:'beaver wetland'}
};
const PICK={garage:['river','hub'],highway:['park','tram'],coal:['wind','woods'],lot:['rain','canopy'],dam:['free','wet']};
const CAUSE={
 flood:{title:'The rain had nowhere to go',chain:'Hard ground, then fast runoff, then a flood, then young growth washed out.',text:'Pavement and rooftops shed rain fast. Free more hard ground, or grow something that soaks: a river, a rain garden, a wetland, a park. Open the Lens to see what the next rain will do.'},
 sediment:{title:'The dam let go of a century of mud',chain:'Dam falls, then a sediment surge, then young water sites buried.',text:'The dam held back mud as well as water. Growth that was well rooted held on. Downstream, the same mud is building a beach at the river mouth. The order you free things in matters.'},
 need:{title:'The crews are a symptom',chain:'Structure gone, then a need unmet, then pave crews, then pavement returns.',text:'People still need to get around and keep the lights on. Until something meets that need, crews keep coming. A transit hub, a tram, wind, or solar would meet it. Open the Lens to see which need is short.'}
};
const HP={g:1,c:3,s:4,v:3,a:3};
const SITE_DEF=[
 {id:'garage',x:260,cols:5,cw:50,floors:8,fh:50,name:'parking garage',col:'#9a958e',cell:(c,f)=>c===0||c===4?'s':(c+f)%2?'c':'g'},
 {id:'highway',x:640,cols:8,cw:60,floors:4,fh:46,name:'elevated highway',col:'#b3ada2',cell:(c,f)=>f===3?'c':(c===1||c===4||c===6)?'s':null},
 {id:'coal',x:1260,cols:6,cw:55,floors:10,fh:50,name:'coal plant',col:'#7b4234',cell:(c,f)=>f>=7?(c===1||c===4?'c':null):(c===0||c===5)?'s':((c===2&&f%2===1)||(c===4&&f%2===0))?'v':(c+f)%3?'c':'g'},
 {id:'lot',x:1740,cols:6,cw:40,floors:1,fh:26,name:'parking lot',col:'#3a3a40',cell:()=>'a'},
 {id:'dam',x:2200,cols:5,cw:50,floors:10,fh:48,name:'concrete dam',col:'#b8b2a4',cell:(c,f)=>{const m=f<2?0:f<4?1:f<7?2:3;return c<m?null:c===4?'s':'c'}}
];

/* ---------- utilities ---------- */
function hr(n){n=Math.sin(n*127.1+311.7)*43758.5453;return n-Math.floor(n)}
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const ease=t=>1-Math.pow(1-clamp(t,0,1),3);
function hex(c){c=c.replace('#','');return[parseInt(c.slice(0,2),16),parseInt(c.slice(2,4),16),parseInt(c.slice(4,6),16)]}
function mix(a,b,t){const A=hex(a),B=hex(b);return'#'+A.map((v,i)=>Math.round(v+(B[i]-v)*t).toString(16).padStart(2,'0')).join('')}

/* ---------- canvas sizing ---------- */
let W=0,H=0,DPR=1,S=1,OY=0,viewW=0,reserve=0,grain=null;
function resize(){
 W=innerWidth;H=innerHeight;DPR=Math.min(2,devicePixelRatio||1);
 cv.width=Math.round(W*DPR);cv.height=Math.round(H*DPR);
 reserve=document.body.classList.contains('touch')&&document.body.classList.contains('playing')?96:0;
 S=Math.min((H-reserve)/600,W/520);
 OY=H-reserve-600*S;viewW=W/S;
}
addEventListener('resize',resize);
function makeGrain(){const c=document.createElement('canvas');c.width=c.height=192;const g=c.getContext('2d'),d=g.createImageData(192,192);
 for(let i=0;i<d.data.length;i+=4){const v=Math.random();d.data[i]=d.data[i+1]=d.data[i+2]=v<.5?0:255;d.data[i+3]=Math.random()*26}
 g.putImageData(d,0,0);g.strokeStyle='rgba(255,255,255,.10)';g.lineWidth=1;for(let i=0;i<70;i++){const x=Math.random()*192,y=Math.random()*192,a=Math.random()*6.3;g.beginPath();g.moveTo(x,y);g.lineTo(x+Math.cos(a)*9,y+Math.sin(a)*9);g.stroke()}
 grain=ctx.createPattern(c,'repeat')}

/* ---------- drawing helpers: cut paper ---------- */
function pathPts(p){ctx.beginPath();ctx.moveTo(p[0][0],p[0][1]);for(let i=1;i<p.length;i++)ctx.lineTo(p[i][0],p[i][1]);ctx.closePath()}
function rectPts(x,y,w,h,seed,j){j=j===undefined?1.3:j;const p=[],step=24;

 edge(x,y,x+w,y,1);edge(x+w,y,x+w,y+h,2);edge(x+w,y+h,x,y+h,3);edge(x,y+h,x,y,4);return p}
function blobPts(cx,cy,rx,ry,seed,n){n=n||12;const p=[];for(let i=0;i<n;i++){const a=i/n*Math.PI*2,r=.84+hr(seed+i*7)*.3;p.push([cx+Math.cos(a)*rx*r,cy+Math.sin(a)*ry*r])}return p}
function ellPts(cx,cy,rx,ry,seed){const p=[];for(let i=0;i<18;i++){const a=i/18*Math.PI*2,r=1+(hr(seed+i)-.5)*.05;p.push([cx+Math.cos(a)*rx*r,cy+Math.sin(a)*ry*r])}return p}
function shape(p,fill,o){o=o||{};pathPts(p);ctx.fillStyle=fill;
 if(o.sh){ctx.shadowColor='rgba(25,12,30,.42)';ctx.shadowBlur=4*S*DPR;ctx.shadowOffsetY=3*S*DPR}
 ctx.fill();ctx.shadowColor='transparent';ctx.shadowBlur=0;ctx.shadowOffsetY=0;
 if(o.ln!==false){ctx.lineWidth=o.lw||2.2;ctx.strokeStyle=o.st||INK;ctx.lineJoin='round';ctx.stroke()}}
function line(x0,y0,x1,y1,c,w){ctx.beginPath();ctx.moveTo(x0,y0);ctx.lineTo(x1,y1);ctx.strokeStyle=c;ctx.lineWidth=w;ctx.lineCap='round';ctx.stroke()}
function dot(x,y,r,c){ctx.fillStyle=c;ctx.beginPath();ctx.arc(x,y,r,0,7);ctx.fill()}
let shX=0,shY=0;
function setWorld(par){ctx.setTransform(DPR*S,0,0,DPR*S,(-cam.x*par*S+shX)*DPR,(OY-cam.y*par*S+shY)*DPR)}

/* a tree is a trunk with branches and several cut canopy masses */
function tree(x,by,sz,seed,g){if(g<=0.02)return;const s=sz*ease(g);
 shape([[x-5*s,by],[x-3*s,by-40*s],[x-15*s,by-56*s],[x-13*s,by-60*s],[x-1.5*s,by-47*s],[x-1*s,by-72*s],[x+3*s,by-72*s],[x+3*s,by-50*s],[x+14*s,by-60*s],[x+16*s,by-56*s],[x+4*s,by-40*s],[x+6*s,by]],'#5b3a24',{lw:2});
 if(g<.25)return;const c=ease((g-.25)/.75);
 const L=[[-15,-64,17,'#2f6b3a'],[15,-62,16,'#2f6b3a'],[1,-84,19,'#3f8443'],[-7,-70,15,'#4f9a48'],[10,-74,15,'#5fae50'],[-1,-92,12,'#7cc35a']];
 L.forEach((b,i)=>shape(blobPts(x+b[0]*s,by+b[1]*s,b[2]*s*1.2*c,b[2]*s*.95*c,seed+i*11,9+(i%3)),b[3],{lw:1.8,sh:i===2}));}
function pine(x,by,sz,seed,g){if(g<=.02)return;const s=sz*ease(g);line(x,by,x,by-30*s,'#5b3a24',5*s);
 for(let k=0;k<4;k++){const w=(26-k*5)*s,y=by-(18+k*22)*s;shape([[x-w,y],[x+(hr(seed+k)-.5)*4,y-30*s],[x+w,y]],k%2?'#2f6b3a':'#3f8443',{lw:1.8})}}
function reeds(x,by,w,seed,g){for(let i=0;i<w/9;i++){const xx=x+i*9+hr(seed+i)*5,h=(14+hr(seed+i*3)*18)*ease(g),tx=xx+(hr(seed+i*5)-.5)*6;line(xx,by,tx,by-h,'#4c7a3a',2.4);if(i%3===0&&g>.6)shape(ellPts(tx,by-h-4,2.4,6,i),'#6b4a30',{lw:1})}}
function frog(x,by,seed){const ph=(T*.6+hr(seed))%1,hop=ph<.25?Math.sin(ph/.25*Math.PI):0,fx=x+(ph<.25?ph*60:15),fy=by-hop*22;
 shape(ellPts(fx,fy-5,8,6,seed),'#5fae50',{lw:1.6});dot(fx+4,fy-10,2.6,'#fbf6ea');dot(fx+4.6,fy-10,1.2,INK);line(fx-6,fy-1,fx-11,fy+1,'#3f8443',2.4)}
function bee(x,y,seed){const a=T*3+seed,bx=x+Math.cos(a)*16,byy=y+Math.sin(a*2)*7;shape(ellPts(bx,byy,4,3,seed),'#f0c030',{lw:1.2});line(bx,byy-3,bx,byy+3,INK,1.4);ctx.globalAlpha=.7;shape(ellPts(bx-1,byy-4,3,2,seed+1),'#fbf6ea',{lw:.8});ctx.globalAlpha=1}
function duck(x,y,seed,dir){ctx.save();ctx.translate(x,y+Math.sin(T*2+seed)*1.2);ctx.scale(dir,1);shape(ellPts(0,0,9,5,seed),'#ece6dc',{lw:1.6});shape(ellPts(8,-6,4.4,4,seed+1),'#2f6b3a',{lw:1.4});shape([[11,-6],[16,-5],[11,-4]],'#f0a830',{lw:1});ctx.restore()}
function person(x,by,c,seed,wave){const bob=Math.abs(Math.sin(T*5+seed))*2;shape(rectPts(x-3.5,by-22-bob,7,14,seed,.3),c,{lw:1.4});shape(ellPts(x,by-27-bob,4.4,4.2,seed),'#c08a5a',{lw:1.4});if(wave)line(x+3,by-20-bob,x+8,by-28-bob+Math.sin(T*9+seed)*3,c,2.4);line(x-2,by-8-bob,x-2,by,INK,2);line(x+2,by-8-bob,x+2,by,INK,2)}

  const c=CH[s.choice];if(!c)return;const k=s.state==='grown'?1:s.g,m=s.state==='grown'?1:.5;f.soak+=c.soak*k;f.tm+=(c.travel||0)*m;f.pm+=(c.power||0)*m});

 // runoff arrows along the stream, pointing downstream
 const n=Math.max(1,Math.round(F.hard-F.soak+1));ctx.strokeStyle='#9fd0e8';ctx.lineWidth=3+n;ctx.lineCap='round';
 for(let x=cam.x-((T*120)%120);x<cam.x+viewW+120;x+=120){ctx.beginPath();ctx.moveTo(x+16,GY+48);ctx.lineTo(x,GY+58);ctx.lineTo(x+16,GY+68);ctx.stroke()}
 for(let i=0;i<4;i++){const a=sites[i],b=sites[i+1],mx=(a.x+a.w+b.x)/2,hot=(q)=>q.state==='standing'&&(q.id!=='dam'||q.paved);
  if(a.state==='grown'&&b.state==='grown'&&CH[a.choice].hab&&CH[b.choice].hab){ctx.setLineDash([10,8]);ctx.strokeStyle='#7cc35a';ctx.lineWidth=5;ctx.beginPath();ctx.moveTo(a.cx,GY-60);ctx.quadraticCurveTo(mx,GY-170,b.cx,GY-60);ctx.stroke();ctx.setLineDash([])}
  else if((hot(a)&&b.state==='growing')||(hot(b)&&a.state==='growing')){ctx.strokeStyle='#f0a830';ctx.lineWidth=4;for(let k=0;k<3;k++){ctx.beginPath();ctx.arc(mx,GY-30,20+k*16+((T*20)%16),Math.PI*1.15,Math.PI*1.85);ctx.stroke()}}}}

/* Big Gnaw: an original beaver, cut from paper */
function drawBeaver(){const climbing=!!P.climb,nap=P.nap>0,moving=Math.abs(P.vx)>20&&P.support,cheer=P.cheer>0&&!climbing&&!nap;
 const bob=cheer?Math.abs(Math.sin(T*14))*14:moving?Math.abs(Math.sin(P.walk*12))*4:Math.sin(P.walk*2)*1.5;
 ctx.save();ctx.translate(P.x,P.y-(nap?0:bob));const sq=P.squash>0?P.squash/.25:0;ctx.scale(P.face*(1+sq*.18),1-sq*.2);
 if(P.spin>0)ctx.rotate(-(1-P.spin/.35)*Math.PI*2*.999);
 if(nap)ctx.rotate(.12);if(climbing)ctx.rotate(-.12);if(P.tumble>0)ctx.rotate(T*14);
 const br='#8a5530',belly='#c08a5a',dk='#3b2a22',ch=P.charge;
 if(ch>0){ctx.globalAlpha=.35+.5*ch;ctx.strokeStyle='#ffd23f';ctx.lineWidth=4;ctx.beginPath();ctx.arc(0,-60,58+ch*14+Math.sin(T*30)*2*ch,0,7);ctx.stroke();ctx.globalAlpha=1}
 ctx.save();ctx.translate(-34,-16);ctx.rotate(ch>0?-.4-ch*1.1:P.punch>0?-.9:climbing?.6:.25+Math.sin(P.walk*3)*.06);shape(ellPts(-18,0,24,10,8),dk,{lw:2,sh:1});for(let k=-2;k<=2;k++)line(-36,k*4,-2,k*4,'#5a4033',1.2);line(-28,-7,-10,7,'#5a4033',1.2);line(-10,-7,-28,7,'#5a4033',1.2);ctx.restore();
 shape(ellPts(-10,-3,14,6,1),dk);shape(ellPts(18,-3,14,6,2),dk);
 shape(blobPts(0,-50,34,46,21,16),br,{sh:1});shape(ellPts(8,-44,19,31,3),belly,{lw:1.8});
 if(climbing||cheer)line(4,-74,cheer?-14:22,cheer?-118:-112,dk,10);
 shape(ellPts(-2,-120,8,8,4),br,{lw:2});
 shape(ellPts(14,-100,27,25,5),br);shape(ellPts(35,-93,14+ch*3,11+ch*3,6),belly,{lw:2});
 dot(46,-97,4.5,INK);
 const blink=(T%3.7)<.13,grin=P.punch>0||cheer||ch>0;
 if(nap){line(18,-106,28,-106,INK,2.4);ctx.strokeStyle=INK;ctx.lineWidth=2.4;for(let k=0;k<3;k++){const zx=30+k*12,zy=-140-k*14-((T*20)%14);ctx.beginPath();ctx.moveTo(zx,zy);ctx.lineTo(zx+8,zy);ctx.lineTo(zx,zy+8);ctx.lineTo(zx+8,zy+8);ctx.stroke()}}
 else if(P.dizzy>0){line(18,-111,26,-103,INK,2.4);line(26,-111,18,-103,INK,2.4)}
 else if(blink||grin){ctx.beginPath();ctx.arc(22,-105,5,Math.PI*1.1,Math.PI*1.9);ctx.strokeStyle=INK;ctx.lineWidth=2.6;ctx.stroke()}
 else{dot(22,-107,4.4,INK);dot(23.4,-108.4,1.5,'#fbf6ea')}
 line(13,-116,29,-118+(ch>0?4:0),dk,3);
 shape(rectPts(30,-86,11,grin?16:13,9,.2),'#f0a830',{lw:1.8});line(35.5,-86,35.5,grin?-70:-73,INK,1.4);
 const pk=P.punch>0?Math.sin((1-P.punch/.26)*Math.PI):0;
 if(cheer)line(14,-70,34,-116,dk,11);else if(climbing)line(12,-70,30+pk*24,-100+pk*30,dk,11);else line(14,-66,26+pk*40,-50-pk*12,dk,11);
 if(P.idle>4&&state==='play'&&sites.some(s=>s.state==='grown')&&!climbing){const hy=-128;line(-4,hy,-4,hy-16,INK,1.6);line(2,hy,2,hy-16,INK,1.6);shape(ellPts(0,hy-24,11,8,2),'#dfe6ea',{lw:1.6});line(8,hy-28,12,hy-44,'#dfe6ea',4);dot(13,hy-46,4,'#dfe6ea');line(16,hy-46,27,hy-43,'#f0a830',2.4);dot(14,hy-47,1.2,INK)}
 ctx.restore();
 if(P.dizzy>0)for(let k=0;k<3;k++){const a=T*7+k*2.09;ctx.save();ctx.translate(P.x+Math.cos(a)*26,P.y-150+Math.sin(a)*7);const pts=[];for(let i=0;i<8;i++){const r=i%2?3:7,an=i/8*6.283;pts.push([Math.cos(an)*r,Math.sin(an)*r])}shape(pts,'#ffd23f',{lw:1.2});ctx.restore()}}

/* ---------- loop ---------- */
let last=performance.now();
function frame(now){const dt=Math.min(.033,(now-last)/1000);last=now;update(dt);render();requestAnimationFrame(frame)}
applyMode();applySound();resize();makeGrain();hud();requestAnimationFrame(frame);
