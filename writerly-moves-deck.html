<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="color-scheme" content="dark light" />
<title>Writerly Moves v1.0</title>
<meta name="spec-source" content="writerly-moves/README.md">
<meta name="audience" content="EN195 creative writing students and Matt, on a phone, all semester; Matt edits the cards with the pencils">
<!--
  WRITERLY MOVES — Starter Deck v1.0 (In build), 2026-11-05.
  30 cards drawn from Move Bible v1 (writerly_moves_deck.html, 65 cards). Card text is the founder's;
  Workshop Diagnostic test lines are from his Storyscape handout. Literary lenses: public domain, attributed.
  Art: original cut-paper scenes, one per move, Tight Spiral Paper Craft, CC0. Print artwork (4x6 in, 0.125 in
  bleed) lives on the design canvas "Writerly Moves — Card Layout and Art"; the scene source is
  claude/writerly-moves-card-art.py (project shelf) and writerly-moves/art/scenes.py (repo).
  Pencils edit any field; edits stay in this browser and leave by Deck tools > Copy edited deck file.
  The origin deck and its two taxonomies (writerly-moves/README.md) are untouched; that review is still owed.
-->
<style>
  :root { color-scheme: light; --is-dark:0;
    --bg:#e9e2d2; --panel:#f6f1e4; --ink:#1b1712; --muted:#2f281b; --line:#b4a684;
    --accent:#7f4307; --onaccent:#fffdf6; --focus:#7a4300; --field:#fbf7ec;
    --paper:#f4ecdc; --pink:#1b1712; --tryb:var(--gtint); --cardline:#cfc2a4; }
  @media (prefers-color-scheme: dark) {
    :root { color-scheme: dark; --is-dark:1;
    --bg:#0f0d09; --panel:#1a1610; --ink:#f6f1e6; --muted:#ddd3bf; --line:#5a4f3e;
    --accent:#e0a94b; --onaccent:#1a1300; --focus:#ffd479; --field:#15120c;
    --paper:#221d16; --pink:#f4ecdc; --tryb:#2c261d; --cardline:#4a4033; }
  }
  html[data-light="day"]   { color-scheme: light; --is-dark:0;
    --bg:#e9e2d2; --panel:#f6f1e4; --ink:#1b1712; --muted:#2f281b; --line:#b4a684;
    --accent:#7f4307; --onaccent:#fffdf6; --focus:#7a4300; --field:#fbf7ec;
    --paper:#f4ecdc; --pink:#1b1712; --tryb:var(--gtint); --cardline:#cfc2a4; }
  html[data-light="night"] { color-scheme: dark; --is-dark:1;
    --bg:#0f0d09; --panel:#1a1610; --ink:#f6f1e6; --muted:#ddd3bf; --line:#5a4f3e;
    --accent:#e0a94b; --onaccent:#1a1300; --focus:#ffd479; --field:#15120c;
    --paper:#221d16; --pink:#f4ecdc; --tryb:#2c261d; --cardline:#4a4033; }
  html[data-light="dusk"]  { color-scheme: dark; --is-dark:1;
    --bg:#2b251c; --panel:#352e24; --ink:#fbf8f1; --muted:#ece4d4; --line:#7b6f5c;
    --accent:#e8b65c; --onaccent:#1a1300; --focus:#ffd479; --field:#241f18;
    --paper:#3a342b; --pink:#fbf8f1; --tryb:#443d33; --cardline:#5e5444; }
  html[data-light="sharp"] { color-scheme: dark; --is-dark:1;
    --bg:#000000; --panel:#000000; --ink:#ffffff; --muted:#ffffff; --line:#ffffff;
    --accent:#ffd34d; --onaccent:#000000; --focus:#ffd34d; --field:#000000;
    --paper:#000000; --pink:#ffffff; --tryb:#000000; --cardline:#ffffff; }
  /* group colors: --gd = header ground (always dark), --gl = label ink on the card */
  .g-core  { --gd:#23305a; --gtint:#e4e8f4; --gdark:#23305a; --glight:#8fa2d6; }
  .g-work  { --gd:#1f4a3e; --gtint:#e2efe7; --gdark:#1f4a3e; --glight:#8cc0a8; }
  .g-draft { --gd:#7a2e14; --gtint:#f7e5d9; --gdark:#7a2e14; --glight:#e8a27c; }
  .g-cli   { --gd:#4a2346; --gtint:#f1e3ee; --gdark:#4a2346; --glight:#c792bd; }
  .g-core, .g-work, .g-draft, .g-cli { --glab:var(--gdark); }
  @media (prefers-color-scheme: dark) { .g-core, .g-work, .g-draft, .g-cli { --glab:var(--glight); } }
  html[data-light="day"] .g-core, html[data-light="day"] .g-work, html[data-light="day"] .g-draft, html[data-light="day"] .g-cli { --glab:var(--gdark); }
  html[data-light="night"] .g-core, html[data-light="night"] .g-work, html[data-light="night"] .g-draft, html[data-light="night"] .g-cli,
  html[data-light="dusk"] .g-core, html[data-light="dusk"] .g-work, html[data-light="dusk"] .g-draft, html[data-light="dusk"] .g-cli,
  html[data-light="sharp"] .g-core, html[data-light="sharp"] .g-work, html[data-light="sharp"] .g-draft, html[data-light="sharp"] .g-cli { --glab:var(--glight); }
  html[data-light="sharp"] .bhead { border-bottom:2px solid #fff; }
  * { box-sizing:border-box; }
  html, body { margin:0; min-height:100%; }
  body { background:var(--bg); color:var(--ink); font-family: Georgia, "Iowan Old Style", "Times New Roman", serif; font-size:20px; -webkit-font-smoothing:antialiased; }
  #backdrop { position:fixed; inset:0; background:var(--bg); z-index:0; }
  #app { position:relative; z-index:1; display:flex; flex-direction:column; min-height:100dvh; }
  @media (prefers-reduced-motion: reduce) { * { transition:none !important; animation:none !important; } }
  .sans { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }

  .se-chrome { position:relative; z-index:2; display:flex; flex-wrap:wrap; justify-content:center; align-items:center; gap:10px; padding:9px 14px; background:var(--panel); border-bottom:2px solid var(--line); }
  .se-home { display:inline-flex; align-items:center; min-height:52px; padding:8px 14px; border:2px solid var(--line); border-radius:10px; background:var(--panel); color:var(--ink); font-family:system-ui,sans-serif; font-weight:700; font-size:18px; text-decoration:none; }
  .se-brand { display:inline-flex; align-items:center; gap:8px; color:var(--ink); }
  .se-brand svg.mk { width:34px; height:34px; flex:none; }
  .se-brand .wm { font-family:system-ui,sans-serif; font-weight:700; font-size:18px; letter-spacing:2px; white-space:nowrap; }
  @media (max-width:560px){ .se-brand .wm { display:none; } }
  .tsp-labchip { display:inline-flex; align-items:center; min-height:30px; padding:2px 8px; border:2px dashed #f3c675; border-radius:4px; background:#241a11; color:#f3c675; font:700 18px/1 ui-monospace,SFMono-Regular,Menlo,monospace; letter-spacing:.09em; white-space:nowrap; }
  .iconbtn { width:52px; height:52px; padding:0; border-radius:50%; display:inline-grid; place-items:center; background:var(--panel); color:var(--ink); border:2px solid var(--line); cursor:pointer; }
  .iconbtn svg { width:26px; height:26px; display:block; }
  .iconbtn .ico { display:none; }
  .iconbtn[data-mode="light"] .ico-light, .iconbtn[data-mode="dark"] .ico-dark, .iconbtn[data-mode="sharp"] .ico-sharp { display:block; }
  .top { padding:10px clamp(12px,4vw,28px) 8px; border-bottom:2px solid var(--line); background:var(--panel); }
  .titlebar { display:flex; align-items:center; justify-content:space-between; gap:10px; flex-wrap:wrap; }
  h1 { margin:0; font-size:clamp(26px,5vw,34px); letter-spacing:-.3px; display:flex; align-items:center; gap:10px; flex-wrap:wrap; }
  .ver { font-family:system-ui,sans-serif; font-size:20px; font-weight:700; white-space:nowrap; color:var(--muted); }
  .chip { font-family:system-ui,sans-serif; font-size:18px; font-weight:700; letter-spacing:.06em; white-space:nowrap; color:var(--ink); border:2px solid var(--accent); border-radius:999px; padding:1px 10px; }
  .util { display:flex; gap:8px; flex-wrap:wrap; }
  .btn { font-family:system-ui,sans-serif; font-size:18px; background:var(--panel); color:var(--ink); border:2px solid var(--line); border-radius:12px; padding:8px 14px; cursor:pointer; min-height:52px; min-width:52px; }
  .btn:hover { border-color:var(--accent); }
  .btn[aria-pressed="true"] { background:var(--accent); color:var(--onaccent); border-color:var(--accent); font-weight:700; }
  .row2 { display:flex; gap:10px; align-items:center; margin-top:8px; flex-wrap:wrap; }
  .grp { display:flex; align-items:center; gap:8px; font-family:system-ui,sans-serif; font-size:18px; font-weight:700; }
  .grp select { font-family:system-ui,sans-serif; font-size:18px; min-height:52px; border-radius:12px; border:2px solid var(--line); background:var(--field); color:var(--ink); padding:6px 10px; max-width:58vw; }

  main { flex:1; width:100%; max-width:480px; margin:0 auto; padding:clamp(10px,3vw,20px); display:flex; flex-direction:column; }
  .stage { display:flex; flex-direction:column; }

  /* ---- the card ---- */
  .card { position:relative; width:100%; background:var(--paper); color:var(--pink); border-radius:16px; overflow:hidden; box-shadow:0 14px 40px rgba(0,0,0,.35); cursor:pointer; border:1px solid var(--cardline); }
  .art { position:relative; width:100%; aspect-ratio:408/460; }
  @media (max-width:520px){ main { padding-left:0; padding-right:0; } .card { border-radius:0; border-left:0; border-right:0; } .controls, .toolrow { padding:0 12px; } }
  .art > svg.scene { position:absolute; inset:0; width:100%; height:100%; display:block; }
  .art .edge { position:absolute; left:0; bottom:-2px; width:100%; height:9%; display:block; filter:drop-shadow(0 -3px 3px rgba(0,0,0,.25)); }
  .art .edge path { fill:var(--paper); }
  .gtag { position:absolute; left:16px; top:16px; display:flex; align-items:center; gap:8px; background:#f4ecdc; color:#1b1712; border-radius:8px; padding:6px 12px 6px 10px; box-shadow:0 2px 4px rgba(0,0,0,.28); font-family:system-ui,sans-serif; font-weight:700; font-size:18px; letter-spacing:.08em; text-transform:uppercase; }
  .gtag svg { width:16px; height:16px; flex:0 0 auto; }
  .panel { padding:6px 20px 16px; display:flex; flex-direction:column; gap:8px; }
  .mname { margin:0; font-size:clamp(28px,7vw,36px); line-height:1.06; font-weight:700; letter-spacing:-.3px; text-wrap:balance; }
  .hook { margin:0; font-size:20px; line-height:1.35; text-wrap:pretty; }
  .alias { margin:0; font-family:system-ui,sans-serif; font-size:18px; color:var(--pink); opacity:1; font-style:italic; }
  .cfoot { display:flex; flex-wrap:wrap; align-items:center; justify-content:space-between; gap:4px 12px; border-top:2px solid var(--glab); padding-top:8px; margin-top:6px; font-family:system-ui,sans-serif; font-weight:700; font-size:18px; letter-spacing:.08em; text-transform:uppercase; }
  .cfoot span { display:flex; align-items:center; gap:8px; white-space:nowrap; }
  .cfoot svg { width:14px; height:14px; }
  .bhead { background:var(--gd); color:#f4ecdc; display:flex; align-items:center; gap:14px; padding:18px 18px; }
  .med { flex:0 0 auto; width:96px; height:96px; border-radius:50%; border:4px solid #f4ecdc; overflow:hidden; box-shadow:0 3px 6px rgba(0,0,0,.35); }
  .med svg { width:100%; height:100%; display:block; }
  .bhead .gl { margin:0 0 4px; display:flex; align-items:center; gap:8px; font-family:system-ui,sans-serif; font-weight:700; font-size:18px; letter-spacing:.08em; text-transform:uppercase; }
  .bhead .gl svg { width:14px; height:14px; }
  .bhead h2 { margin:0; font-size:clamp(26px,6vw,30px); line-height:1.06; text-wrap:balance; }
  .bbody { padding:16px 20px 16px; display:flex; flex-direction:column; gap:14px; }
  .lab { font-family:system-ui,sans-serif; font-weight:700; font-size:18px; letter-spacing:.1em; text-transform:uppercase; color:var(--glab); margin:0 0 4px; }
  .bbody p.txt { margin:0; font-size:20px; line-height:1.45; text-wrap:pretty; }
  .try { background:var(--tryb); border:2px solid var(--glab); border-radius:12px; padding:12px 14px; }
  .lens p.q { margin:0; font-style:italic; font-size:20px; line-height:1.45; }
  .lens p.by { margin:6px 0 0; font-family:system-ui,sans-serif; font-weight:600; font-size:18px; }
  .empty { font-style:italic; opacity:.85; }

  /* ---- pencils (vanish when switched off) ---- */
  .f { position:relative; }
  body.pens .f { padding-right:62px; min-height:56px; }
  .pencil { position:absolute; right:0; top:0; width:52px; height:52px; border-radius:12px; border:2px solid var(--accent); background:var(--panel); color:var(--ink); display:none; align-items:center; justify-content:center; cursor:pointer; padding:0; z-index:2; }
  body.pens .pencil { display:inline-flex; }
  .pencil svg { width:26px; height:26px; }
  .pencil.onart { right:12px; top:auto; bottom:14%; }
  .editor label { display:block; font-family:system-ui,sans-serif; font-size:18px; font-weight:700; color:var(--glab); margin-bottom:6px; }
  .editor textarea, .editor input { width:100%; font-family:Georgia,serif; font-size:20px; line-height:1.4; color:var(--ink); background:var(--field); border:2px solid var(--accent); border-radius:12px; padding:12px; resize:vertical; }
  .editor textarea { min-height:120px; }
  .edbtns { display:flex; gap:8px; margin-top:8px; flex-wrap:wrap; }
  .edbtns .primary { background:var(--accent); color:var(--onaccent); border-color:var(--accent); font-weight:700; }

  .controls { display:flex; gap:10px; margin-top:10px; }
  .controls button { font-family:system-ui,sans-serif; font-size:19px; border:2px solid var(--line); background:var(--panel); color:var(--ink); border-radius:16px; padding:14px; cursor:pointer; min-height:56px; }
  .controls .nav-btn { flex:1; font-weight:500; }
  .toolrow { display:flex; flex-wrap:wrap; gap:8px; justify-content:center; margin-top:14px; }
  .turn { font-family:system-ui,sans-serif; font-size:18px; font-weight:700; letter-spacing:0; text-transform:none; min-height:52px; min-width:120px; padding:8px 16px; border-radius:12px; border:2px solid var(--accent); background:var(--accent); color:var(--onaccent); cursor:pointer; }
  .controls .side { min-width:72px; }

  .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:12px; }
  .tile { background:var(--paper); color:var(--pink); border:2px solid var(--cardline); border-radius:14px; padding:0 0 10px; cursor:pointer; overflow:hidden; display:flex; flex-direction:column; gap:8px; font:inherit; text-align:left; }
  .tile:hover, .tile[aria-pressed="true"] { border-color:var(--accent); }
  .tile svg { width:100%; height:auto; aspect-ratio:408/440; display:block; }
  .tile .tn { font-size:19px; line-height:1.15; padding:0 10px; }
  .tile .tg { font-family:system-ui,sans-serif; font-size:18px; padding:0 10px; color:var(--glab); display:flex; align-items:center; gap:6px; }
  .tile .tg svg { width:12px; height:12px; aspect-ratio:auto; }

  .panelview { display:flex; flex-direction:column; gap:12px; }
  .box { background:var(--panel); border:2px solid var(--line); border-radius:16px; padding:16px; }
  .box h2 { margin:0 0 8px; font-size:clamp(24px,5vw,30px); }
  .box p { font-family:system-ui,sans-serif; font-size:19px; line-height:1.5; margin:0 0 10px; }
  .box .row { display:flex; gap:8px; flex-wrap:wrap; margin-top:6px; }
  .box select { font-family:system-ui,sans-serif; font-size:19px; min-height:52px; border-radius:12px; border:2px solid var(--line); background:var(--field); color:var(--ink); padding:6px 10px; }
  .hidden { display:none !important; }
  :focus-visible { outline:4px solid var(--focus); outline-offset:3px; border-radius:8px; }

  .rail { display:flex; justify-content:center; gap:12px; padding:14px 14px 4px; }
  .rail a { font-family:system-ui,sans-serif; font-size:19px; color:var(--ink); border:2px solid var(--line); border-radius:12px; padding:10px 18px; min-height:52px; text-decoration:none; display:inline-flex; align-items:center; }
  footer { font-family:system-ui,sans-serif; font-size:18px; color:var(--muted); text-align:center; padding:6px 14px 18px; }
  .toast { position:fixed; bottom:calc(22px + env(safe-area-inset-bottom)); left:50%; transform:translateX(-50%); background:var(--ink); color:var(--bg); font-family:system-ui,sans-serif; padding:12px 18px; border-radius:12px; font-size:19px; opacity:0; transition:opacity .2s; pointer-events:none; z-index:10; }
  .toast.show { opacity:1; }
</style>
</head>

<script id="deckdata" type="application/json">{"rev": "v1.0-2026-11-05", "cards": [{"g": "Core Craft", "n": "First Domino", "l": "The small first action that makes everything after it inevitable", "i": "domino", "def": "The first concrete choice a character makes that quietly removes their other options. After it, the story is consequence, not coincidence.", "ex": "Write the smallest thing your character does on page one, then list three doors it just closed.", "s": "domino"}, {"g": "Core Craft", "n": "Character North Star", "l": "The value the character steers by", "i": "northstar", "a": "was Volitional Torque", "def": "The principle or self-image a character navigates by, even when it costs them what they want.", "ex": "Name the one thing your character would lose everything to keep, then aim their hunger straight at it.", "q": "I am no bird; and no net ensnares me.", "by": "Charlotte Brontë, Jane Eyre", "s": "northstar"}, {"g": "Core Craft", "n": "Misbelief Engine", "l": "The false survival rule that distorts every choice", "i": "engine", "def": "A false rule the character adopted to survive once, now silently steering every decision.", "ex": "Write it as a bumper sticker (\"Never need anyone\"), find the scene that taught it, then design a scene that disproves it.", "s": "misbelief"}, {"g": "Core Craft", "n": "Frictive Want", "l": "Two wantings grinding against each other inside one person", "i": "friction", "def": "Two genuine wants that cannot both win, so every choice has a cost built in.", "ex": "Give your character two things they want that cannot share a room; make them choose out loud.", "q": "You pierce my soul. I am half agony, half hope.", "by": "Jane Austen, Persuasion", "s": "frictive"}, {"g": "Core Craft", "n": "Kishōtenketsu Turn", "l": "Surprise through juxtaposition, not conflict", "i": "turn", "def": "Development by juxtaposition: introduce an unrelated third thing, then let its relation click. No villain required.", "ex": "Write four beats: a scene, the scene deepened, an unrelated image, the hidden link.", "q": "The old pond / a frog jumps in, / the sound of water.", "by": "Matsuo Bashō", "s": "kisho"}, {"g": "Core Craft", "n": "The Mind's Eye", "l": "The concrete sensory image that transports the reader", "i": "eye", "def": "The specific image that lets a reader see it: birches, not trees; ripe peaches, not fruit.", "ex": "Rewrite an abstract sentence using only what a camera and a nose could catch.", "s": "mindseye"}, {"g": "Core Craft", "n": "The Disclosure Map", "l": "Who knows what, and when they learn it", "i": "map", "def": "Deliberate control of who knows what, and when. It drives suspense and dramatic irony.", "ex": "Chart what each character and the reader knows in a scene; give one of them a secret the others lack.", "s": "disclosure"}, {"g": "Core Craft", "n": "Start After the Storm", "l": "Cut the throat-clearing; enter the scene late", "i": "cutstorm", "def": "Begin as late as possible, already in motion, trusting the reader to infer the runway.", "ex": "Delete your first three paragraphs; start on the first sentence where something changes.", "q": "Mrs. Dalloway said she would buy the flowers herself.", "by": "Virginia Woolf, Mrs Dalloway", "s": "afterstorm"}, {"g": "Core Craft", "n": "Residue Beat", "l": "Stay one beat longer after the event lands", "i": "ripple", "def": "Linger one beat past the event, where the real feeling actually lives.", "ex": "After the scene \"ends,\" write the ten seconds most writers cut.", "s": "residue"}, {"g": "Core Craft", "n": "Retroactive Setup", "l": "Plant an early detail that clicks into meaning at the end", "i": "seed", "def": "Plant a quiet detail early that only detonates at the end, making the finish feel inevitable.", "ex": "Write your ending first, then go back and plant the one image that makes it land.", "s": "retro"}, {"g": "Core Craft", "n": "Status Drift", "l": "Power shifting hands inside a single dialogue", "i": "seesaw", "def": "Power changing hands inside one conversation, line by line, without anyone announcing it.", "ex": "Write a two-page dialogue where who's \"up\" changes three times, silently.", "s": "status"}, {"g": "Core Craft", "n": "Honne & Tatemae", "l": "Inner truth vs. public mask; the engine of subtext", "i": "masks", "a": "from your EN210 exercise", "def": "The gap between inner truth (honne) and public mask (tatemae). Subtext lives in that gap.", "ex": "Write a dialogue where the spoken words are the mask and the body language is the truth.", "s": "honne"}, {"g": "Workshop Diagnostic", "n": "Anchor in Reality", "l": "Grounds us in who, where, and when", "i": "anchor", "def": "Grounds us in who, where, and when, and keeps the world solid with concrete setting, action, and sensory detail.", "ex": "Test: Could the reader draw the room, street, or bus stop from this? If not, add three physical facts.", "s": "anchor"}, {"g": "Workshop Diagnostic", "n": "Character Hunger", "l": "What the character is trying to get", "i": "hunger", "a": "was Character Want", "def": "Shows what the character is trying to get, right now or in the long run: plans, wishes, cravings, avoidance.", "ex": "Test: After this line, do we know what they want right now? Make the want visible in an action.", "s": "hunger"}, {"g": "Workshop Diagnostic", "n": "Friction / Obstacle", "l": "Something in the way of the want", "i": "friction", "def": "Puts something in the way of the want: other people, rules, logistics, bad luck, inner conflict.", "ex": "Test: Does this make the path less simple? Add one obstacle that can't be waved away.", "s": "friction"}, {"g": "Workshop Diagnostic", "n": "Micro-Tension", "l": "A small itch of unease that makes the reader lean in", "i": "taut", "def": "A small itch of unease, curiosity, or conflict inside the scene: subtext, an awkwardness, a question raised.", "ex": "Test: Does the reader lean forward even if nothing explodes? Add one unanswered question.", "s": "microtension"}, {"g": "Workshop Diagnostic", "n": "World Detail That Matters", "l": "A specific detail that quietly carries meaning", "i": "magnify", "def": "A specific detail that quietly carries class, mood, or history, like an object, gesture, or garment with weight.", "ex": "Test: If you changed the detail, would the scene read differently? If not, choose a sharper one.", "s": "worlddetail"}, {"g": "Workshop Diagnostic", "n": "Interior Weather", "l": "What is going on inside the character", "i": "headcloud", "def": "Shows what is going on inside: thought, feeling, judgment, rationalizing, surprise.", "ex": "Test: Could we guess the emotional state from this alone? Show it through what they notice.", "s": "interior"}, {"g": "Workshop Diagnostic", "n": "Stakes Signal", "l": "Why this matters, what could be gained or lost", "i": "warnflag", "def": "Shows why this situation matters: the consequences, threats, promises, or deadlines in play.", "ex": "Test: So what if this goes wrong? Make the cost of failure concrete in one line.", "s": "stakes"}, {"g": "Workshop Diagnostic", "n": "Turn / Shift", "l": "The situation or understanding changes direction", "i": "turn", "def": "The situation or understanding changes direction through a reveal, reversal, decision, or emotional flip.", "ex": "Test: If you cut this, would the story stay the same? If yes, it's not a real turn.", "s": "turnshift"}, {"g": "Drafty Air", "n": "Overpacked Suitcase", "l": "A detail not earning its keep", "i": "suitcase", "def": "A detail that may be weighing the scene down without adding enough value.", "ex": "Reader test: If you leave it out, does anything important break? If not, cut it or give it a second job.", "s": "suitcase"}, {"g": "Drafty Air", "n": "Floating Camera", "l": "Lost POV or ungrounded space", "i": "camerafloat", "def": "Confusing POV or an ungrounded sense of space and time. We teleport, or lose whose eyes we are in.", "ex": "Reader test: Can I say where we are and whose head I'm in? Re-anchor us in one sentence.", "s": "camera"}, {"g": "Drafty Air", "n": "Dropped Thread", "l": "A setup that never pays off", "i": "thread", "def": "A setup that seemed important but never gets pulled through, like a hinted secret or an object that vanishes.", "ex": "Reader test: Did the story teach me to care, then let it disappear? Pay it off or pull the setup.", "s": "thread"}, {"g": "Drafty Air", "n": "Stock Footage Moment", "l": "Generic where specific is needed", "i": "filmslash", "def": "A beat that feels generic, like borrowed movie stock instead of this specific story.", "ex": "Reader test: Could this drop into a dozen other stories? Make it specific to this character.", "s": "stock"}, {"g": "Drafty Air", "n": "Driving Too Fast", "l": "An important beat rushed", "i": "speed", "a": "a.k.a. Fast-Forward Scene", "def": "A moment where the story skips the good stuff, handling a decision or turn in one line.", "ex": "Reader test: Did I want to watch it happen, not just be told? Slow down and stage the moment.", "s": "toofast"}, {"g": "Drafty Air", "n": "Noticeable Info Dump", "l": "Exposition stalling momentum", "i": "dump", "def": "A block of explanation that calls attention to itself and slows the story's pulse.", "ex": "Reader test: Did the story hit pause to brief me? Spread the information into action and dialogue.", "s": "dump"}, {"g": "Cliché Clinic", "n": "First Thought, Fourth Try", "l": "Force past the obvious image", "i": "fourtry", "def": "Your first image is usually everyone's. Push past it to the one only you would find.", "ex": "List four images for one idea; use the fourth.", "s": "fourth"}, {"g": "Cliché Clinic", "n": "Make the Familiar Strange", "l": "Defamiliarize the ordinary", "i": "strange", "def": "Describe the ordinary as if seen for the first time, so the reader sees it new.", "ex": "Describe a common object as if you'd never encountered one before.", "s": "strange"}, {"g": "Cliché Clinic", "n": "Concrete Over Cloudy", "l": "Swap abstraction for sensory detail", "i": "concrete", "def": "Trade abstractions for things the senses can actually reach.", "ex": "Replace \"she was sad\" with something we can see, hear, or smell.", "s": "concrete"}, {"g": "Cliché Clinic", "n": "Body Knows Best", "l": "Embodied emotion, not named emotion", "i": "bodyknow", "def": "Show emotion in the body rather than labeling it.", "ex": "Cut the emotion word; write the physical tell instead.", "s": "bodyknows"}]}</script>

<script>
(function(){
const $ = id => document.getElementById(id);
const BASE = JSON.parse($('deckdata').textContent);
const SCENES = JSON.parse($('scenedata').textContent);
const EDGE = 'M-6.0 8.0 L27.4 5.4 L62.5 3.6 L96.1 3.1 L130.0 2.0 L161.1 4.0 L193.5 5.8 L226.1 6.7 L260.0 10.0 L298.3 9.5 L335.8 6.1 L375.9 6.9 L414.0 4.0 L414.2 17.7 L415.5 30.5 L415.1 45.3 L414.0 60.0 L307.9 58.8 L203.4 61.0 L98.0 60.3 L-6.0 60.0 L-5.6 46.6 L-5.8 32.6 L-7.4 20.1Z';
const KEY = 'wm_deck_' + (BASE.rev || 'v1');
const GROUPS = ['All','Core Craft','Workshop Diagnostic','Drafty Air','Cliché Clinic'];
const GMETA = {
  'Core Craft':{cls:'g-core', glyph:'circle'}, 'Workshop Diagnostic':{cls:'g-work', glyph:'square'},
  'Drafty Air':{cls:'g-draft', glyph:'triangle'}, 'Cliché Clinic':{cls:'g-cli', glyph:'diamond'}
};
const FIELDS = { n:'Move name', l:'One-line hook', a:'Small note under the hook', def:'What it is', ex:'Try this', q:'Literary lens (quote; use " / " between lines)', by:'Lens source' };
const PENCIL = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20l4.2-1 10.6-10.6a2.1 2.1 0 0 0-3-3L5.2 16 4 20z"/><path d="M14.5 6.5l3 3"/></svg>';
const clone = o => JSON.parse(JSON.stringify(o));
const esc = s => String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
let uid = 0;

function glyph(kind, color){
  const c = color || 'currentColor';
  const g = kind==='circle' ? `<circle cx="7" cy="7" r="6" fill="${c}"/>` : kind==='square' ? `<rect x="1" y="1" width="12" height="12" fill="${c}"/>`
          : kind==='triangle' ? `<path d="M7 1 L13 13 L1 13Z" fill="${c}"/>` : `<path d="M7 0 L14 7 L7 14 L0 7Z" fill="${c}"/>`;
  return `<svg viewBox="0 0 14 14" aria-hidden="true">${g}</svg>`;
}
function sceneSvg(id, view, label, light){
  let inner = SCENES[id] || '';
  if(light) inner = inner.replace(/<rect[^>]*filter="url\(#PFXgr\)"[^>]*\/>/g, '');
  const p = 'u' + (++uid) + '_';
  inner = inner.split('PFX').join(p);
  const vb = view || '0 -48 408 440';
  const role = label ? `role="img" aria-label="${esc(label)}"` : 'aria-hidden="true"';
  return `<svg class="scene" viewBox="${vb}" preserveAspectRatio="xMidYMid slice" ${role}>${inner}</svg>`;
}

let cards = load();
let groupIdx = 0, pos = 0, order = null, flipped = false, view = 'card', pencils = true, editing = null;
function fresh(){ return BASE.cards.map((c,i)=>Object.assign({id:'c'+i, orig:i}, c)); }
function load(){ try { const s = JSON.parse(localStorage.getItem(KEY)||'null'); if(s && Array.isArray(s.cards)) return s.cards; } catch(e){} return fresh(); }
function save(){ try { localStorage.setItem(KEY, JSON.stringify({cards})); } catch(e){ toast('This browser will not keep edits. Use Deck tools to copy them out.'); } }
function isEdited(c){ if(c.orig==null) return true; const o = BASE.cards[c.orig]; if(!o) return true; return ['g','n','l','a','s','def','ex','q','by'].some(k => (c[k]||'') !== (o[k]||'')); }
function list(){ const g = GROUPS[groupIdx]; const idx = cards.map((c,i)=>i).filter(i => g==='All' || cards[i].g===g); return order ? order.filter(i => idx.includes(i)) : idx; }
function cur(){ const l=list(); if(!l.length) return null; if(pos>=l.length) pos=l.length-1; return cards[l[pos]]; }
function numOf(c){ return String(cards.indexOf(c)+1).padStart(2,'0') + ' / ' + cards.length; }
function toast(m){ const t=$('toast'); t.textContent=m; t.classList.add('show'); setTimeout(()=>t.classList.remove('show'),2000); }

/* three modes on one button: Light -> Dark -> Sharp. CSS picks the first look from the
   device setting; the button only writes an explicit choice (house pattern, The Asking Room). */
const MODES=['light','dark','sharp'], NAMES={light:'Light',dark:'Dark',sharp:'Sharp'}, ATTR={light:'day',dark:'night',sharp:'sharp'};
const root=document.documentElement, modeBtn=$('modeBtn2');
function curMode(){ const t=root.getAttribute('data-light'); const back={day:'light',night:'dark',sharp:'sharp',dusk:'dark'}; if(back[t]) return back[t];
  return getComputedStyle(root).getPropertyValue('--is-dark').trim()==='1' ? 'dark' : 'light'; }
function syncMode(){ const m=curMode(), n=MODES[(MODES.indexOf(m)+1)%MODES.length]; modeBtn.setAttribute('data-mode',m); modeBtn.setAttribute('aria-label','Mode: '+NAMES[m]+'. Tap for '+NAMES[n]+'.'); }
try { const saved=localStorage.getItem('wm_mode'); if(MODES.includes(saved)) root.setAttribute('data-light', ATTR[saved]); } catch(e){}
syncMode();
modeBtn.addEventListener('click', () => { const next=MODES[(MODES.indexOf(curMode())+1)%MODES.length]; root.setAttribute('data-light', ATTR[next]); try{ localStorage.setItem('wm_mode',next); }catch(e){} syncMode(); });

/* fields */
function pen(field){ return `<button class="pencil" data-edit="${field}" aria-label="Edit ${esc(FIELDS[field])}">${PENCIL}</button>`; }
function editor(field, c){
  const big = ['def','ex','q','l'].includes(field), v = esc(c[field]||'');
  return `<div class="editor" data-editor="${field}"><label for="ed_${field}">${esc(FIELDS[field])}</label>
    ${big ? `<textarea id="ed_${field}">${v}</textarea>` : `<input id="ed_${field}" type="text" value="${v}">`}
    <div class="edbtns"><button class="btn primary" data-save="${field}">Done</button><button class="btn" data-cancel="1">Cancel</button>
    ${field!=='n' ? `<button class="btn" data-clear="${field}">Clear this field</button>` : ''}</div></div>`;
}
function F(field, c, inner){ return editing===field ? editor(field, c) : `<div class="f">${inner}${pen(field)}</div>`; }

function renderCard(){
  const host = $('card'), c = cur();
  if(!c){ host.innerHTML = `<div class="box"><p>No cards in this group yet. Open Deck tools and tap Add a new card.</p></div>`; return; }
  const m = GMETA[c.g] || GMETA['Core Craft'];
  if(!flipped){
    host.innerHTML = `<article class="card ${m.cls}" aria-label="${esc(c.n)}, front of card">
      <div class="art">${sceneSvg(c.s, null, 'Cut-paper picture for ' + c.n)}
        <div class="gtag">${glyph(m.glyph, 'var(--gd)')}<span>${esc(c.g)}</span></div>
        <svg class="edge" viewBox="0 0 408 40" preserveAspectRatio="none" aria-hidden="true"><path d="${EDGE}"/></svg>
        <button class="pencil onart" data-scene="1" aria-label="Change the picture">${PENCIL}</button>
      </div>
      <div class="panel">
        ${F('n', c, `<h2 class="mname">${esc(c.n)}</h2>`)}
        ${F('l', c, `<p class="hook">${c.l?esc(c.l):'<span class="empty">Add a one-line hook</span>'}</p>`)}
        ${(c.a || editing==='a') ? F('a', c, `<p class="alias">${esc(c.a||'')}</p>`) : ''}
        <div class="cfoot"><span>${glyph(m.glyph, 'var(--glab)')}No. ${numOf(c)}</span><button class="turn" data-turn="1">Turn over</button></div>
      </div></article>`;
  } else {
    const lens = (c.q || pencils || editing==='q') ? `<div class="lens">${F('q', c, `<p class="lab">Literary lens</p>${c.q?`<p class="q">${esc(c.q).split(' / ').join('<br>')}</p>`:'<p class="q empty">No lens yet</p>'}`)}
        ${(c.q || editing==='by') ? F('by', c, `<p class="by">${c.by?esc(c.by):'<span class="empty">Add the source</span>'}</p>`) : ''}</div>` : '';
    host.innerHTML = `<article class="card ${m.cls}" aria-label="${esc(c.n)}, back of card">
      <header class="bhead"><div class="med">${sceneSvg(c.s, '52 0 304 304', 'Small picture for ' + c.n)}</div>
        <div><p class="gl">${glyph(m.glyph, '#f4ecdc')}<span>${esc(c.g)}</span></p><h2>${esc(c.n)}</h2></div></header>
      <div class="bbody">
        ${F('def', c, `<p class="lab">What it is</p><p class="txt">${c.def?esc(c.def):'<span class="empty">Add a definition</span>'}</p>`)}
        <div class="try">${F('ex', c, `<p class="lab">Try this</p><p class="txt">${c.ex?esc(c.ex):'<span class="empty">Add an exercise</span>'}</p>`)}</div>
        ${lens}
        <div class="cfoot"><span>No. ${numOf(c)}</span><button class="turn" data-turn="1">Turn back</button></div>
      </div></article>`;
  }
  const ed = host.querySelector('.editor textarea, .editor input');
  if(ed){ ed.focus(); try{ ed.setSelectionRange(ed.value.length, ed.value.length); }catch(e){} }
}
$('card').addEventListener('click', e => {
  const c = cur(); if(!c) return;
  const b = e.target.closest('button');
  if(b){
    e.stopPropagation();
    if(b.dataset.edit){ editing = b.dataset.edit; renderCard(); return; }
    if(b.dataset.scene){ openScenes(); return; }
    if(b.dataset.turn){ flip(); setTimeout(()=>{ const t=$('card').querySelector('[data-turn]'); if(t) t.focus(); },0); return; }
    if(b.dataset.save){ const f=b.dataset.save, v=$('ed_'+f).value.trim(); if(f==='n' && !v){ toast('A card needs a name'); return; }
      if(v) c[f]=v; else delete c[f]; editing=null; save(); renderCard(); toast('Saved'); return; }
    if(b.dataset.clear){ delete c[b.dataset.clear]; if(b.dataset.clear==='q') delete c.by; editing=null; save(); renderCard(); toast('Cleared'); return; }
    if(b.dataset.cancel){ editing=null; renderCard(); return; }
    return;
  }
  if(e.target.closest('.editor') || editing) return;
  flip();
});
$('card').addEventListener('keydown', e => {
  if(['TEXTAREA','INPUT','BUTTON'].includes(e.target.tagName)){
    if(e.key==='Escape' && editing){ editing=null; renderCard(); }
    if(e.key==='Enter' && e.target.tagName==='INPUT'){ e.preventDefault(); const s=$('card').querySelector('[data-save]'); if(s) s.click(); }
    return;
  }
  if(e.key==='Enter'||e.key===' '){ e.preventDefault(); flip(); }
});

/* picture picker */
function openScenes(){
  const c = cur(); view='scenes'; editing=null;
  const owner = {}; BASE.cards.forEach(b => owner[b.s] = b.n);
  $('sceneView').innerHTML = `<div class="box"><h2>Pick a picture for ${esc(c.n)}</h2><p>Tap a picture. It saves right away and takes you back to the card.</p></div>
    <div class="grid">${Object.keys(SCENES).map(k => `<button class="tile ${GMETA[c.g].cls}" data-k="${k}" aria-pressed="${k===c.s}">${sceneSvg(k,null,null,true)}<span class="tn">${esc(owner[k]||k)}</span></button>`).join('')}</div>
    <div class="row"><button class="btn" id="sceneBack">Back to the card</button></div>`;
  $('sceneView').querySelectorAll('[data-k]').forEach(b => b.onclick = () => { c.s = b.dataset.k; save(); view='card'; render(); toast('Picture changed'); });
  $('sceneBack').onclick = () => { view='card'; render(); };
  render();
}

/* browse */
function renderGrid(){
  const g = $('grid'); g.innerHTML='';
  list().forEach((ci,i) => { const c = cards[ci], m = GMETA[c.g] || GMETA['Core Craft'], t = document.createElement('button');
    t.className = 'tile ' + m.cls;
    t.innerHTML = `${sceneSvg(c.s,null,null,true)}<span class="tn">${esc(c.n)}</span><span class="tg">${glyph(m.glyph,'var(--glab)')}<span>${esc(c.g)}${isEdited(c)?' · edited':''}</span></span>`;
    t.onclick = () => { pos=i; view='card'; flipped=false; render(); }; g.appendChild(t); });
}

/* deck tools */
function bakedHtml(){
  const data = { rev:'edited-' + new Date().toISOString().slice(0,16).replace(/[:T]/g,'-'), cards: cards.map(c => { const o=clone(c); delete o.id; delete o.orig; return o; }) };
  const doc = document.documentElement.cloneNode(true);
  doc.querySelector('#deckdata').textContent = JSON.stringify(data).replace(/<\/script/gi,'<\\/script');
  ['card','tabs','grid','toolsView','helpView','sceneView'].forEach(id => { const n = doc.querySelector('#'+id); if(n) n.innerHTML=''; });
  doc.removeAttribute('data-light'); doc.querySelector('body').className = 'pens';
  return '<!doctype html>\n' + doc.outerHTML;
}
function download(name, text, type){ try { const u=URL.createObjectURL(new Blob([text],{type})); const a=document.createElement('a'); a.href=u; a.download=name; document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(u),1000); toast('Downloaded ' + name); } catch(e){ toast('Download is blocked here. Use Copy.'); } }
function copy(text){ if(navigator.clipboard && navigator.clipboard.writeText){ navigator.clipboard.writeText(text).then(()=>toast('Copied'), ()=>toast('Copy is blocked here. Use Download.')); } else toast('Copy is blocked here. Use Download.'); }
function confirmTap(btn, label, fn){ if(btn.dataset.armed){ fn(); return; } btn.dataset.armed='1'; const old=btn.textContent; btn.textContent=label; setTimeout(()=>{ if(btn.isConnected){ delete btn.dataset.armed; btn.textContent=old; } }, 4000); }
function renderTools(){
  const c = cur(), edits = cards.filter(isEdited).length, ci = c ? cards.indexOf(c) : -1;
  $('toolsView').innerHTML = `
    <div class="box"><h2>This card</h2><p>${c?esc(c.n):'No card selected'}</p>
      ${c?`<p><label for="grpSel">Group</label><br><select id="grpSel">${GROUPS.slice(1).map(g=>`<option ${g===c.g?'selected':''}>${esc(g)}</option>`).join('')}</select></p>`:''}
      <div class="row"><button class="btn" id="tNote">Edit the small note under the hook</button><button class="btn" id="tDup">Duplicate this card</button><button class="btn" id="tReset">Undo my edits on this card</button><button class="btn" id="tDel">Delete this card</button></div></div>
    <div class="box"><h2>The deck</h2><p>${cards.length} cards · ${edits} edited or new. Edits stay in this browser as you go.</p>
      <div class="row"><button class="btn" id="tAdd">Add a new card</button><button class="btn" id="tResetAll">Start over from the original 30</button></div></div>
    <div class="box"><h2>Send it to the studio</h2>
      <p>Copy edited deck file, then paste it into the Tight Spiral Studios project chat. Claude lands it in the repo from there.</p>
      <p>Downloads work when this page is opened from the arcade in Safari or Chrome. Inside the Claude app they are blocked, so use Copy.</p>
      <div class="row"><button class="btn" id="tCopyFile">Copy edited deck file</button><button class="btn" id="tHtml">Download edited deck</button><button class="btn" id="tCopy">Copy cards as text</button></div></div>
    <div id="helpBox"></div>
    <div class="row"><button class="btn" id="tBack">Back to the cards</button></div>`;
  renderHelp();
  if(c){
    $('grpSel').onchange = e => { c.g = e.target.value; save(); toast('Moved to ' + c.g); };
    $('tNote').onclick = () => { view='card'; flipped=false; editing='a'; render(); };
    $('tDup').onclick = () => { const n=clone(c); n.id='n'+Date.now(); delete n.orig; n.n=c.n+' (copy)'; cards.splice(ci+1,0,n); order=null; save(); groupIdx=0; pos=ci+1; view='card'; flipped=false; render(); toast('Duplicated'); };
    $('tReset').onclick = () => { if(c.orig==null){ toast('This is a new card, so there is nothing to undo'); return; } cards[ci] = Object.assign({id:c.id, orig:c.orig}, clone(BASE.cards[c.orig])); save(); renderTools(); toast('Card restored'); };
    $('tDel').onclick = e => confirmTap(e.currentTarget, 'Tap again to delete', () => { cards.splice(ci,1); order=null; save(); pos=Math.max(0,pos-1); renderTools(); toast('Deleted'); });
  }
  $('tAdd').onclick = () => { const g = GROUPS[groupIdx]==='All' ? 'Core Craft' : GROUPS[groupIdx]; cards.push({id:'n'+Date.now(), g, n:'New Move', l:'', s:'kisho', def:'', ex:''}); order=null; save(); groupIdx=0; pos=cards.length-1; view='card'; flipped=false; editing='n'; render(); };
  $('tResetAll').onclick = e => confirmTap(e.currentTarget, 'Tap again to erase every edit', () => { cards=fresh(); order=null; pos=0; save(); renderTools(); toast('Back to the original 30'); });
  $('tCopyFile').onclick = () => copy(bakedHtml());
  $('tHtml').onclick = () => download('writerly-moves-deck-edited.html', bakedHtml(), 'text/html');
  $('tCopy').onclick = () => copy(cards.map((c,i)=>`${i+1}. ${c.n} [${c.g}]\n${c.l||''}${c.a?' ('+c.a+')':''}\nWhat it is: ${c.def||''}\nTry this: ${c.ex||''}${c.q?`\nLens: "${c.q}" (${c.by||''})`:''}\nPicture: ${c.s}`).join('\n\n'));
  $('tBack').onclick = () => { view='card'; render(); };
}
function renderHelp(){
  $('helpBox').innerHTML = `<div class="box"><h2>How this deck works</h2>
    <p><b>Read a card.</b> Tap it to turn it over. The front holds the picture, the name and the hook. The back holds what the move is, something to try, and a literary lens where one fits.</p>
    <p><b>Edit anything.</b> Every field has a pencil button on its right. Tap the pencil, type, then tap Done. Cancel leaves it as it was. The pencil in the lower right corner of the picture swaps the picture.</p>
    <p><b>Hide the pencils.</b> Pencils on, under the card, switches them off so the card reads clean.</p>
    <p><b>Move around.</b> Next card and Back sit under the card. The Group picker under the title filters the deck. Turn over sits on the card itself. Browse shows every card as a tile. Shuffle deals a new order.</p>
    <p><b>Add, copy, delete, regroup.</b> The buttons above, on this page.</p>
    <p><b>The round button at the top right</b> switches between Light, Dark and Sharp (high contrast).</p>
    <p>Keys: left and right arrows move, F turns the card, G browse, S shuffle, E pencils, Escape cancels an edit.</p>
    </div>`;
}

/* shell */
function buildTabs(){
  const sel=$('grpPick'); sel.innerHTML='';
  GROUPS.forEach((g,i) => { const n = g==='All' ? cards.length : cards.filter(c=>c.g===g).length, o=document.createElement('option');
    o.value=i; o.textContent = (g==='All' ? 'All cards' : g) + ' (' + n + ')'; if(i===groupIdx) o.selected=true; sel.appendChild(o); });
}
$('grpPick').onchange = e => { groupIdx=+e.target.value; pos=0; flipped=false; editing=null; if(view!=='grid') view='card'; render(); };
function render(){
  buildTabs();
  document.body.classList.toggle('pens', pencils);
  $('penBtn').textContent = pencils ? 'Pencils on' : 'Pencils off'; $('penBtn').setAttribute('aria-pressed', pencils?'true':'false');
  $('modeBtn').textContent = view==='grid' ? 'One card' : 'Browse';
  ['stage','gridView','toolsView','helpView','sceneView'].forEach(id => $(id).classList.add('hidden'));
  ({card:'stage',grid:'gridView',tools:'toolsView',help:'helpView',scenes:'sceneView'})[view] && $(({card:'stage',grid:'gridView',tools:'toolsView',help:'helpView',scenes:'sceneView'})[view]).classList.remove('hidden');
  if(view==='card') renderCard(); else if(view==='grid') renderGrid(); else if(view==='tools') renderTools(); else if(view==='help') renderHelp();
}
function flip(){ flipped=!flipped; editing=null; renderCard(); }
function next(){ const n=list().length; if(!n) return; pos=(pos+1)%n; flipped=false; editing=null; renderCard(); }
function prev(){ const n=list().length; if(!n) return; pos=(pos-1+n)%n; flipped=false; editing=null; renderCard(); }
function shuffle(){ const a=cards.map((_,i)=>i); for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } order=a; pos=0; view='card'; flipped=false; editing=null; render(); toast('Shuffled'); }
function toggleView(v){ view = view===v ? 'card' : v; editing=null; flipped=false; render(); }
$('nextBtn').onclick=next; $('prevBtn').onclick=prev; $('shuffleBtn').onclick=shuffle; 
$('modeBtn').onclick=()=>toggleView('grid'); $('toolsBtn').onclick=()=>toggleView('tools'); 
$('penBtn').onclick=()=>{ pencils=!pencils; editing=null; render(); };
document.addEventListener('keydown', e => {
  if(['INPUT','TEXTAREA','SELECT'].includes(e.target.tagName)) return;
  const k=e.key.toLowerCase();
  if(k==='arrowright' && view==='card'){ e.preventDefault(); next(); }
  else if(k==='arrowleft' && view==='card'){ e.preventDefault(); prev(); }
  else if(k==='f' && view==='card') flip();
  else if(k==='g') toggleView('grid'); else if(k==='s') shuffle(); else if(k==='e'){ pencils=!pencils; editing=null; render(); }
});
try { matchMedia('(prefers-color-scheme: dark)').addEventListener('change', syncMode); } catch(e){}
render();
})();
</script>
</body>
</html>
