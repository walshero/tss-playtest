  SANDBAGS, a flash-fiction compression game. Tight Spiral Studios · walshero@gmail.com
  EN195 Creative Writing. v2 GAME REBUILD 2026-07-06 (founder GATE-1 verdict: "no game").

  v29 2026-09-23, ROW K AS THE STANDARD (founder: "Improve the art in sandbags
  using row k as standard, update artifact and canon"). Row K v40 is the
  studio's approved paper hand; this pass ports it, piece by piece.
    - THE CUT. The three sheet filters now run Row K's recipe (v36): a
      displaced hand-cut contour, the Dad Energy fibre (fractalNoise 0.05 x 0.1
      at Row K's on-screen scale), and a DOUBLE shadow - a tight contact shadow
      plus a long soft one - that deepens toward the viewer, far to near. All
      of it in sRGB, which the old filters were not (linearRGB blending had
      been shifting every paper stock a few points off its own colour).
    - PEOPLE, IN FELT. Three of the four scenes had no one in them, which is
      odd for four pieces that are each about two people. Row K's rule (v37):
      every face and hand is one bright felt colour per character, no
      features, none a human skin tone. Ramen: the narrator standing
      bare-headed in the rain among the umbrellas. Crosswalk: father and child
      at the edge of the curb, his hand held out and not yet taken. Peach
      Cobbler: him, walking the cobbler over. Dead Ants: you mid-slide, one
      sneaker out toward the ant; me by the payphones, watching. Mamet seat:
      drama is what the body does, at stage scale.
    - THE BALLOON IS CUT, NOT DRAWN. No ink outlines anywhere in the set, so
      the hero prop lost its too: striped gores from three stocks, a shade
      panel turned from the light, a crown, a kraft skirt, paper-strip ropes,
      a woven basket, hessian sandbags.
    - THE CARD HAND (Row K v34). The plate, the buttons, the heap scraps and
      the result are sheets set down by hand: uneven corners, a paper shadow
      for depth only, tips under one degree. Every tappable carries a 2px ink
      edge; the shadow is never the affordance. The why-card is the backstage
      note from the Arcade Pass study (board S2): the only taped thing.
    - THE STAMP. Liftoff gets Row K's rubber stamp in studio teal: AIRBORNE.
      Said in words, never by style alone. No stamp for a crash (dignity floor).
    - DARK MODE, NOT COMFORT (Row K v39). One round iOS half-circle button in
      the chrome: one tap dark, one tap light, opens on the device's setting,
      remembers the choice. The backdrop is a real fixed element
      (BACKDROP-AS-ELEMENT); on a mismatch host the button reads the page's
      actual paint, not matchMedia.
    - THE MARK. Row K's footer: the Direction B spiral (cream over burnt
      orange, teal registration stroke), TIGHT SPIRAL STUDIOS, Play. Notice.
      Design. The chrome carries the same mark, small.
  Copy, pieces, roles, liftAt and the engine are untouched.

  v25 2026-09-20, volume, and local colour (founder: "let's have volume, and
  stop washing the whole scene in one color. Sky holds the color. Houses have
  color. Don't push it universally. Make real scenes").

  THE WASH WAS STRUCTURAL. Each layer group set its own fill, so every object
  inside it inherited one tone: a village, a torii and four roofs all came out
  the same grey-green. The layers now own DEPTH ONLY - blur, shadow, cut-edge
  weight - and every object carries the paper it was cut from, out of a fixed
  drawer of eleven stocks (cream, bone, kraft, terracotta, vermillion, sage,
  moss, slate, steel, charcoal, plum), each with a face and a shade.

  VOLUME. Everything is a box now, not a silhouette: a front face, a side face
  turning away from the light, and a top. Depth recedes up and to the right at
  a fixed 0.55 rake, so every object in every scene agrees where the camera is.
  Gabled houses get the same treatment plus two roof planes at different
  values. A flat cut-out cannot fake this and no amount of shadow will.

  AERIAL PERSPECTIVE IS HAZE ADDED, NEVER COLOUR REPLACED. Depth now comes from
  a veil of the sky's own tone laid between the layers - .42 behind the middle
  ground, .16 behind the foreground - so distance reads while every object
  keeps its own paper. That is the difference between a scene and a tint.

  AND THE SCENES GOT REAL. Scene 2 tells its whole story in stock: his house is
  cool slate under steel and dark; the neighbour's is warm cream under
  terracotta with three lit windows and a porch light. The fence between them
  is bone. Nobody says anything. Scene 1 is four shopfronts each cut from a
  different paper with its own awning colour. Scene 0 has a vermillion torii on
  the slope. Scene 3 is brick, plum and charcoal blocks with a kraft water
  tower and a vermillion bus sign.

  v24 2026-09-20, the real treatment (founder: "this isn't close to lumino").
  Correct: v23 was flat vector shapes with drop shadows on them. Paper does not
  photograph like that. What actually separates a built set from a drawn one is
  surface, edge, density and light, and v23 had none of the first three.

    - SURFACE. Every sheet now carries a fibre field: turbulence stretched hard
      on one axis for directional grain, raised by feDiffuseLighting into an
      actual lit surface, multiplied back into the fill. A stain is not a
      texture; this is the difference between tinted and made of something.
    - EDGE. Every sheet is stroked in a lighter tone of itself, so its top
      contour shows the raw fibre inside the card the way a cut edge catches
      light. On ground planes the bottom runs off frame, so only the cut side
      ever shows - which is exactly what a built set looks like.
    - DEPTH OF FIELD. The far sheet is softened. A camera focused on a set
      twelve inches across cannot hold the back of it sharp, and that softness
      is the single strongest cue that a thing is small and real.
    - DENSITY. The scenes were four or five shapes each; they now carry
      shopfronts with awnings and signs, streetlamps, a bus shelter, a water
      tower, fire escapes, overhead wires, a torii on the slope, terraced
      fields, chimneys, a mailbox, a tree, picket fencing and window grids
      running to dozens of panes. The repeated pieces are generated rather than
      hand-written, so the density costs bytes in the hundreds, not thousands.
    - PALETTE. Pulled well down in saturation into real cardstock tones - kraft,
      sage, dusty blue, ochre, slate. The previous gradients were digital.
    - AND THE BALLOON JOINED THE WORLD. It was the only flat vector object left
      in a frame full of textured card: the hero prop, and the least physical
      thing in the shot. Same fibre, same lamp, and its shadow thrown to one
      side because it hangs in FRONT of the set rather than lying on it.

  One failure worth keeping: the first attempt stripped the fill attributes
  expecting the layer groups to supply them, and SVG's default fill is black.
  Every scene rendered as a silhouette. Layer groups now carry their own paper
  colour explicitly.

  v23 2026-09-20, built, not drawn (founder: "studio best paper cut nearing
  lumino city polish"). The scenes were flat vector silhouettes stacked in a
  gradient; they are now a paper diorama, after the State of Play school. Four
  moves, none of them an asset and none of them a network request:

    - CAST SHADOWS. Each scene is three sheets of card, ly1 furthest to ly3
      nearest, and every sheet drops a shadow on the one behind it - a short
      tight one at the back, a long soft one at the front. This is the single
      thing that makes paper read as built rather than drawn, because it is the
      only cue that says there is AIR between the layers.
    - HAND-CUT CONTOURS. One feTurbulence + feDisplacementMap on the whole
      scene group, scale 2.2, so no edge is vector-perfect. Scissors are not a
      plotter.
    - PRACTICAL BULBS. The windows are lit, per scene, by a bulb filter that
      blooms them the way a real light behind real paper does. The intensity is
      the scene's own: nearly off on the bright morning, burning through the
      storm, a whole city of them at night. Peach Cobbler carries the story in
      its lighting - his side of the fence dark, the neighbour's lit, which is
      the door he has to walk to.
    - PAPER GRAIN, tiled from an inline turbulence tile, soft-light so it adds
      tooth without darkening, over the whole diorama but under the chips so it
      never touches their text. Plus a light inner shadow: a diorama sits in a
      box, and a box has walls.

  Text contrast unaffected - grain is soft-light and both chips inside the sky
  carry their own backgrounds. The storm's three planes were pulled further
  apart in the same pass; moody is not the same as muddy.
