<!--
  SANDBAGS, a flash-fiction compression game. Tight Spiral Studios · walshero@gmail.com
  EN195 Creative Writing. v2 GAME REBUILD 2026-07-06 (founder GATE-1 verdict: "no game").

  v30 2026-09-23, THE SKY IS A SET TOO (founder: "Peach cobbler add trees and
  clouds. Use clouds above ramen village. Space! Use it"). The top half of every
  skybox was an empty gradient; the diorama stopped at the rooftops. A second
  cut-paper plate now hangs in that space, behind the balloon, cut on the same
  Row K recipe: two tiers of clouds, far ones softer.
    - Ramen: a low, heavy storm deck in wet sage and slate, stacked three deep
      over the village, with rain falling out of it.
    - Crosswalk: three fair-weather cumulus with blue-grey undersides, kept off
      the sun, and three paper birds.
    - Peach Cobbler: clouds lit gold from below by the low sun; and trees - a
      full treeline on the rise behind the houses (one maple already turning),
      a maple between his house and the fence, an elm over theirs.
    - Dead Ants: night - a thin cloud band across the moon and a scatter of
      paper stars.

  v29 2026-09-23, ROW K AS THE STANDARD (founder: "Improve the art in sandbags
  using row k as standard, update artifact and canon"). Row K v40 is the
  studio's approved paper hand; this pass ports it, piece by piece.
    - THE CUT. The three sheet filters now run Row K's recipe (v36): a
      displaced hand-cut contour, the Dad Energy fibre (fractalNoise 0.05 x 0.1
      at Row K's on-screen scale), and a DOUBLE shadow - a tight contact shadow
      plus a long soft one - that deepens toward the viewer, far to near. All
      of it in sRGB, which the old filters were not (linearRGB blending had
      been shifting every paper stock a few points off its own colour).
    - PEOPLE, IN FELT. Three of the four scenes had no one in them, which is
      odd for four pieces that are each about two people. Row K's rule (v37):
      every face and hand is one bright felt colour per character, no
      features, none a human skin tone. Ramen: the narrator standing
      bare-headed in the rain among the umbrellas. Crosswalk: father and child
      at the edge of the curb, his hand held out and not yet taken. Peach
      Cobbler: him, walking the cobbler over. Dead Ants: you mid-slide, one
      sneaker out toward the ant; me by the payphones, watching. Mamet seat:
      drama is what the body does, at stage scale.
    - THE BALLOON IS CUT, NOT DRAWN. No ink outlines anywhere in the set, so
      the hero prop lost its too: striped gores from three stocks, a shade
      panel turned from the light, a crown, a kraft skirt, paper-strip ropes,
      a woven basket, hessian sandbags.
    - THE CARD HAND (Row K v34). The plate, the buttons, the heap scraps and
      the result are sheets set down by hand: uneven corners, a paper shadow
      for depth only, tips under one degree. Every tappable carries a 2px ink
      edge; the shadow is never the affordance. The why-card is the backstage
      note from the Arcade Pass study (board S2): the only taped thing.
    - THE STAMP. Liftoff gets Row K's rubber stamp in studio teal: AIRBORNE.
      Said in words, never by style alone. No stamp for a crash (dignity floor).
    - DARK MODE, NOT COMFORT (Row K v39). One round iOS half-circle button in
      the chrome: one tap dark, one tap light, opens on the device's setting,
      remembers the choice. The backdrop is a real fixed element
      (BACKDROP-AS-ELEMENT); on a mismatch host the button reads the page's
      actual paint, not matchMedia.
    - THE MARK. Row K's footer: the Direction B spiral (cream over burnt
      orange, teal registration stroke), TIGHT SPIRAL STUDIOS, Play. Notice.
      Design. The chrome carries the same mark, small.
  Copy, pieces, roles, liftAt and the engine are untouched.

  v25 2026-09-20, volume, and local colour (founder: "let's have volume, and
  stop washing the whole scene in one color. Sky holds the color. Houses have
  color. Don't push it universally. Make real scenes").

  THE WASH WAS STRUCTURAL. Each layer group set its own fill, so every object
  inside it inherited one tone: a village, a torii and four roofs all came out
  the same grey-green. The layers now own DEPTH ONLY - blur, shadow, cut-edge
  weight - and every object carries the paper it was cut from, out of a fixed
  drawer of eleven stocks (cream, bone, kraft, terracotta, vermillion, sage,
  moss, slate, steel, charcoal, plum), each with a face and a shade.

  VOLUME. Everything is a box now, not a silhouette: a front face, a side face
  turning away from the light, and a top. Depth recedes up and to the right at
  a fixed 0.55 rake, so every object in every scene agrees where the camera is.
  Gabled houses get the same treatment plus two roof planes at different
  values. A flat cut-out cannot fake this and no amount of shadow will.

  AERIAL PERSPECTIVE IS HAZE ADDED, NEVER COLOUR REPLACED. Depth now comes from
  a veil of the sky's own tone laid between the layers - .42 behind the middle
  ground, .16 behind the foreground - so distance reads while every object
  keeps its own paper. That is the difference between a scene and a tint.

  AND THE SCENES GOT REAL. Scene 2 tells its whole story in stock: his house is
  cool slate under steel and dark; the neighbour's is warm cream under
  terracotta with three lit windows and a porch light. The fence between them
  is bone. Nobody says anything. Scene 1 is four shopfronts each cut from a
  different paper with its own awning colour. Scene 0 has a vermillion torii on
  the slope. Scene 3 is brick, plum and charcoal blocks with a kraft water
  tower and a vermillion bus sign.

  v24 2026-09-20, the real treatment (founder: "this isn't close to lumino").
  Correct: v23 was flat vector shapes with drop shadows on them. Paper does not
  photograph like that. What actually separates a built set from a drawn one is
  surface, edge, density and light, and v23 had none of the first three.

    - SURFACE. Every sheet now carries a fibre field: turbulence stretched hard
      on one axis for directional grain, raised by feDiffuseLighting into an
      actual lit surface, multiplied back into the fill. A stain is not a
      texture; this is the difference between tinted and made of something.
    - EDGE. Every sheet is stroked in a lighter tone of itself, so its top
      contour shows the raw fibre inside the card the way a cut edge catches
      light. On ground planes the bottom runs off frame, so only the cut side
      ever shows - which is exactly what a built set looks like.
    - DEPTH OF FIELD. The far sheet is softened. A camera focused on a set
      twelve inches across cannot hold the back of it sharp, and that softness
      is the single strongest cue that a thing is small and real.
    - DENSITY. The scenes were four or five shapes each; they now carry
      shopfronts with awnings and signs, streetlamps, a bus shelter, a water
      tower, fire escapes, overhead wires, a torii on the slope, terraced
      fields, chimneys, a mailbox, a tree, picket fencing and window grids
      running to dozens of panes. The repeated pieces are generated rather than
      hand-written, so the density costs bytes in the hundreds, not thousands.
    - PALETTE. Pulled well down in saturation into real cardstock tones - kraft,
      sage, dusty blue, ochre, slate. The previous gradients were digital.
    - AND THE BALLOON JOINED THE WORLD. It was the only flat vector object left
      in a frame full of textured card: the hero prop, and the least physical
      thing in the shot. Same fibre, same lamp, and its shadow thrown to one
      side because it hangs in FRONT of the set rather than lying on it.

  One failure worth keeping: the first attempt stripped the fill attributes
  expecting the layer groups to supply them, and SVG's default fill is black.
  Every scene rendered as a silhouette. Layer groups now carry their own paper
  colour explicitly.

  v23 2026-09-20, built, not drawn (founder: "studio best paper cut nearing
  lumino city polish"). The scenes were flat vector silhouettes stacked in a
  gradient; they are now a paper diorama, after the State of Play school. Four
  moves, none of them an asset and none of them a network request:

    - CAST SHADOWS. Each scene is three sheets of card, ly1 furthest to ly3
      nearest, and every sheet drops a shadow on the one behind it - a short
      tight one at the back, a long soft one at the front. This is the single
      thing that makes paper read as built rather than drawn, because it is the
      only cue that says there is AIR between the layers.
    - HAND-CUT CONTOURS. One feTurbulence + feDisplacementMap on the whole
      scene group, scale 2.2, so no edge is vector-perfect. Scissors are not a
      plotter.
    - PRACTICAL BULBS. The windows are lit, per scene, by a bulb filter that
      blooms them the way a real light behind real paper does. The intensity is
      the scene's own: nearly off on the bright morning, burning through the
      storm, a whole city of them at night. Peach Cobbler carries the story in
      its lighting - his side of the fence dark, the neighbour's lit, which is
      the door he has to walk to.
    - PAPER GRAIN, tiled from an inline turbulence tile, soft-light so it adds
      tooth without darkening, over the whole diorama but under the chips so it
      never touches their text. Plus a light inner shadow: a diorama sits in a
      box, and a box has walls.

  Text contrast unaffected - grain is soft-light and both chips inside the sky
  carry their own backgrounds. The storm's three planes were pulled further
  apart in the same pass; moody is not the same as muddy.

  v22 2026-09-20, the sky is a picture, not page chrome (founder: "the
  backgrounds are barely visible because everything is the same color. This
  should be art. It's dark.").

  Two mistakes, both mine, both the same mistake. First: v21's night variants
  re-specified all four skies in near-black, so on a dark device every scene
  collapsed into one charcoal - sky #2c3334 over land #171d1e, four points
  apart. Second, underneath it: the balloon was drawn out of PAGE tokens, so
  --rust flipping to a pale peach in the dark palette turned the same balloon
  into a different balloon. Both come from treating the picture as chrome that
  should answer the page.
  A painting on a dark wall is still a painting. So:
    - The four scenes keep their own light in both palettes. Night turns the
      gallery lamp down with a single filter - brightness .78, saturate 1.06 -
      which preserves every tonal relationship inside the frame exactly instead
      of flattening them.
    - Each sky is now a real gradient of four or five stops with its own light
      source painted in: a pale break in the storm cloud, a high morning sun, a
      big low golden-hour sun behind the houses, a moon over sodium glow at
      street level.
    - The land planes were pulled much further apart so the horizon reads.
    - The balloon takes fixed art tokens (--art-ink, --art-rust, --art-basket,
      --art-bag). It is the same balloon in every palette; only the gore
      changes, and only by piece.
  Text contrast is unaffected: the filter scales foreground and background
  together, and the two chips inside the sky carry their own backgrounds.

  v21 2026-09-20, four skies, and the flight no longer ends at the line.

  FOUR SKIES, NOT ONE (founder: "the backgrounds are all the same color with
  hard to see differences"). Correct, and the first pass earned it: it changed
  the land and the balloon's gore but left every piece under the same pale
  blue, so four places read as one place with different furniture. Each piece
  now carries its own light, the whole sky gradient, all three land planes and
  the gore, with the time of day taken from the piece rather than chosen for
  variety: Ramen is the grey-green storm that consumes him, Crosswalk an
  ordinary bright morning, Peach Cobbler a late golden afternoon, Dead Ants
  night at the bus stop. Each has a night variant, because a noon-blue sky on
  a dark page is a glowing rectangle at 2am.

  YOU CAN KEEP CUTTING AFTER IT FLIES (founder: "currently it stops even if
  there is a fattened sentence left"). Liftoff used to freeze every word, so a
  piece that flew at eight bags with six more still hanging on it could not be
  trimmed further, the game stopped the player mid-lesson to tell them they
  had won. Flying is now a state you can enter, keep trimming inside, and fall
  back out of. The reveal is live, so the piece tightens under you as you cut
  and the credit line counts how many bags past the line you are. A strut still
  tears: strike once while up and you drop below the line with the words still
  live so you can climb back; strike twice and it crashes, which is the honest
  price of getting greedy after a good flight. Confetti fires once per piece -
  re-earning the line is worth the colour, not a second faceful of paper.

  v20 2026-09-20, Ramen flies at 8 (founder: "'our' noodles shouldn't be the
  9th. It works with it. Let it be cuttable but 8 is the win state."). liftAt
  9 -> 8 on that piece only. "our" was already m:1 and stays m:1 - it drops to
  the heap, costs nothing and lifts nothing, so it was never the ninth bag; the
  threshold was. At 9 the game kept asking for one more after the piece had
  already gone lean, which is the game arguing with its own lesson. Strike math
  still clears: 14 ballast against a liftAt of 8 leaves 3 spare after a strike.

  v19 2026-09-20, the settings, the night palette, and a win you can see.

  THE SETTING IS IN THE ART. Each piece now flies over its own place, drawn in
  the same cut-paper hand as the balloon and pitched low enough against the sky
  that it registers before it is noticed. Three planes of distance (--land-far,
  --land, --land-near) in both palettes, which is what makes it read as depth
  rather than three grey shapes.
    0 Ramen at Echigo Kawaguchi, snow-country ridgelines, steep village roofs,
      and the rain the piece opens and closes on. Gore: rain blue.
    1 Black Spots on the Crosswalk, low rooflines, the signal on its pole, the
      curb they stand at the very edge of, asphalt, the painted bars, and the
      spots. Gore: signal amber. (The stripes first sat on open sky with no
      road under them and read as nothing; paint needs a surface.)
    2 Peach Cobbler, two houses and the fence between them, which is the whole
      conflict, plus the cellar door he was made to sleep beside. The fence is
      where the balloon parks, so lifting reveals it. Gore: peach.
    3 Dead Ants, the corner across from Sparr's: blocks, two old payphones,
      the sign pole for the 39, one ant on the pavement. Gore: payphone green.
  preserveAspectRatio is 'meet', not 'slice': slice cropped the outer houses
  off every scene at phone width.

  DARK HOST LAW, RETROFITTED. This file carried a fully authored night palette
 , three tuned token sets, and nothing ever set data-light, so it was dead
  code and the page always rendered light. The switcher that set it went out
  with the comfort panel under the no-walls ruling and the palette lost its
  only trigger. A dark-preferring phone was being handed a light page for its
  host to force-darken unmeasured. Now wired to prefers-color-scheme: the
  device asks, the page answers, no wall and no button.

  LIFTOFF IS WHERE THE THUMB IS (founder note: "you can't see on phone what's
  above"). The balloon rises in the skybox and the reveal opens below it, but a
  player dropping their last sandbag is down in the manifest, the sky is a
  screen and a half above them. The win was happening entirely off-camera. It
  now announces itself on the only surface visible at any scroll position: the
  page warms, the plate takes a gold edge, cut-paper confetti falls over the
  viewport, and the hint line directly under the player's thumb points down to
  the lean piece. Nothing scrolls on its own. Confetti is skipped under reduced
  motion, where the colour change alone carries it, the win is never told by
  movement only. There is deliberately NO equivalent for a crash: the dignity
  floor says a crash is never shame, and flashing a screen red is how you make
  it one.

  The citation also moved out of the skybox. It had been absolutely positioned
  inside a div marked aria-hidden="true", so the one thing the sourcing floor
  requires - who wrote this - was the one thing a screen reader could not reach,
  and at 18px it collided with the balloon's basket. It is a citation, not sky
  furniture, so it is now a readable line under the sky.

  v18 also fixes a CSS bug this file has carried since it was written: seven
  rules used `font: 800 <size>/<lh> inherit`, which is an invalid shorthand -
  `inherit` cannot be the family - so each whole declaration was dropped and the
  element fell back to the UA default. That is why the buttons rendered at
  13.33px. Rewritten as longhand.

  v18 2026-09-20, accessibility pass, carrying the teeth the Row K aleph run
  (2026-09-19) grew. Four findings, all measured in a browser, none of them
  about the game itself, which plays well and whose liftoff math is sound on
  all four pieces (ballast minus a strike still clears liftAt with 3-5 to spare):
    - FOCUS-LOST (blocker). render() rebuilds #draft by innerHTML on every tap,
      destroying the focused word; activeElement measured BODY after a keyboard
      drop. In a game whose whole interaction is tapping words in sequence, a
      keyboard or voice reader was thrown to the top of the document on EVERY
      word. Words now carry data-i and refocus() puts the reader back on the
      same word, or the next live one along if theirs was dropped. After a
      liftoff or a crash focus goes to the result heading instead.
    - COLOPHON ABOVE THE GAME (blocker for play). The .foot div sat between the
      chrome and .wrap, so 200px of legal boilerplate rendered before the
      prompt - measured at y=176 with the game at y=379. Moved to the bottom
      where a colophon belongs. Its markup also carried two unclosed spans.
    - OUTLINE-BROKEN. The page had no h1, h2 or h3 at all, so assistive tech
      got an empty outline. Now: an h1 for the game, h2 on the manifest, the
      heap and the result panel.
    - TYPE-FLOOR. Ten rendered sizes under the studio's 18px floor, including
      the prompt (16.3px), the hint line (14.1px), the scraps (15.2px) and all
      nav. Raised to 18-19px; the chrome wraps at phone width because two 18px
      nav buttons and the wordmark will not share a 390px row, and the floor
      outranks a tidy grid.
  Contrast and tap targets were already clean at every comfort stop, and there
  was no sideways scroll. Those are not changed.

  THE GAME (founder-directed): every word is clickable and every word looks the same.
  THREE HIDDEN ROLES:
    BALLAST (b:1) , droppable fluff; the balloon rises.
    MAYBE   (m:1) , defensible either way; drops to the heap, no lift, no harm.
    LOAD-BEARING  , the meaning hangs on it. STRIKE 1: the balloon PLUMMETS but
    holds, the word stays, and a WHY card explains what it was carrying.
    STRIKE 2 on any load word: CRASH. Fly again in one tap.
  Liftoff = enough ballast shed (minus altitude lost to strikes) without a second tear.

  SOURCE (sourcing floor, attributed in-game): four pieces by Matt Walsh, verbatim
  excerpts pulled from Google Drive 2026-07-06:
    "Ramen at Echigo Kawaguchi"     doc 17IPevuwPsp0Y6MICt88PC_pK0v81Mpi0eNcueY5JbQA
    "Black Spots on the Crosswalk"  doc 1-5T4gwLGDROu3sXt59eXEPLnSxqUnj21ALjuVvI3o2w
    "Peach Cobbler"                 doc 1G4YQabQySWSNUZMxOLPRn6k43kAYNjowPMgT-KFcg8g
    "Dead Ants"                     doc 15XlmThncqd8XnEqVGjahIIk_aO02iYLQDhAL3IEsbrE
  HITL LAYER: inserted padding is marked ins:1; every b / m / why tag is a studio
  call awaiting the founder's per-word retune. Why-cards are studio craft notes at
  the 70% voice tier, founder finishes.
  CHANGELOG:
    2026-07-06 retune 1, fair-crash rule; fluff thickened; auto-capitalization.
    2026-07-06 retune 2 (founder), MAYBE role added; two-strike engine (plummet
    then crash); why-cards on load words; fluff thickened again; strike math keeps
    liftoff reachable after one strike on every piece.

  DIGNITY FLOOR: neither a strike nor a crash is shame, the word was holding the
  piece up, and now you know it by feel. A dropped word may fly another day.

  FLOORS: single-file, offline, in-memory. NO GREEN. Landing >50% image. 3-stop
  comfort knob (never a wall). Explicit dark palette. Fixed-dark chips for
  white-on-color text. 44px+ targets, keyboard on every word (identical aria-labels
 , roles never leak), visible focus, reduced-motion instant states, scroll-reset,
  no emoji. Art: original cut-paper SVG, CC0, Tight Spiral Paper Craft.
-->
