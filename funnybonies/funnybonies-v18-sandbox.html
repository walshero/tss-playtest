<!doctype html>
<html lang="en" data-comfort="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Funnybonies v18 · The Sandbox</title>
<meta name="description" content="Funnybonies v18. A playground sandbox behind the factory. Four robots, each a different kind of funny. Poke them, fling them, and hand them props. Nobody tells you the joke.">
<meta name="spec-source" content="funnybonies/SPEC-LINK-v18.md">
<meta name="audience" content="kids, grades 3 to 6">
<style>
/* ===========================================================
   Funnybonies v18 · The Sandbox · LAB
   Spec: funnybonies/SPEC-LINK-v18.md
   Founder, 2026-11-09: "None of the funnybones builds make me
   laugh. Make all the humor in the playground discoverable and
   intuitive and genuine. This game should work like a sandbox."
   And: "don't build around Bloat."
   Ensemble of four. Every robot x every prop has its own reaction.
   No captions explain a joke. The Bonies on the wall laugh only at
   what is new to them. The Found book names the move AFTER the laugh.
   Floors: no emoji, no green, single file, offline, stores nothing,
   44px targets, three modes on one icon button, nav in the menu.
   =========================================================== */
:root,html[data-comfort="light"]{--chrome:#f6ecd6;--ink:#1d1714;--line:#1d1714;--accent:#7a1a12;--tap:48px;
  --sky1:#f1dcae;--sky2:#e3a872;--sky3:#b5664c;--haze:#9a5b5e;--ground1:#7a4a33;--ground2:#3e2419;}
html[data-comfort="dark"]{--chrome:#1d1714;--ink:#f6ecd6;--line:#f6ecd6;--accent:#f6cf6a;
  --sky1:#121827;--sky2:#26314b;--sky3:#3f5e78;--haze:#2c3550;--ground1:#3c2a24;--ground2:#1a110d;}
html[data-comfort="sharp"]{--chrome:#000000;--ink:#ffffff;--line:#ffff00;--accent:#ffff00;
  --sky1:#f1dcae;--sky2:#e3a872;--sky3:#b5664c;--haze:#9a5b5e;--ground1:#7a4a33;--ground2:#3e2419;}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
html,body{margin:0;height:100%;overflow:hidden;background:var(--ground2);color:var(--ink);
  font-family:ui-rounded,"SF Pro Rounded","Nunito","Trebuchet MS",system-ui,sans-serif;
  -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
#stage{position:fixed;inset:0;width:100vw;height:100vh;height:100dvh;display:block;touch-action:none;z-index:0}
button,a.nav{font-size:18px;font-weight:800;line-height:1.1;font-family:inherit;min-height:var(--tap);min-width:var(--tap);padding:8px 14px;border-radius:12px;
  border:2px solid var(--line);background:var(--chrome);color:var(--ink);cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:6px}
button:focus-visible,a.nav:focus-visible,[role=button]:focus-visible{outline:4px solid var(--accent);outline-offset:3px}
button.icon{padding:6px}
button.icon svg{width:28px;height:28px;stroke:var(--ink);stroke-width:2.4;fill:none;stroke-linecap:round;stroke-linejoin:round}
.se-chrome{position:fixed;top:0;left:0;right:0;z-index:6;display:flex;align-items:center;gap:6px;flex-wrap:wrap;
  padding:calc(6px + env(safe-area-inset-top)) calc(8px + env(safe-area-inset-right)) 8px calc(8px + env(safe-area-inset-left));
  background:var(--chrome);color:var(--ink);border-bottom:2px solid var(--line);transform:translateY(-110%);transition:transform .2s ease;visibility:hidden}
.se-chrome.open{transform:none;visibility:visible}
.se-chrome h1{margin:0 4px;font-size:22px;font-weight:800;line-height:1.1;font-family:inherit;color:var(--ink);display:flex;align-items:center;gap:8px;flex:1 1 100%;flex-wrap:wrap}
.ver{font-size:20px;font-weight:800;color:var(--accent)}
.tsp-labchip{font-size:18px;font-weight:800;line-height:1;padding:4px 8px;border:2px solid var(--line);border-radius:6px;color:var(--ink)}
.se-chrome .sp,.se-rail{display:flex;gap:6px;flex-wrap:wrap}
#corner{position:fixed;z-index:5;top:calc(8px + env(safe-area-inset-top));left:calc(8px + env(safe-area-inset-left));display:flex;gap:8px;align-items:center}
#corner button{box-shadow:0 3px 0 rgba(0,0,0,.35)}
#bookBtn b{font-size:18px}
#book{position:fixed;z-index:7;inset:calc(8px + env(safe-area-inset-top)) 8px calc(8px + env(safe-area-inset-bottom)) 8px;
  background:var(--chrome);color:var(--ink);border:3px solid var(--line);border-radius:20px;padding:12px 12px 16px;overflow:auto;
  box-shadow:0 8px 0 rgba(0,0,0,.4);max-width:620px;margin:0 auto}
#book[hidden],#toast[hidden]{display:none}
#book h2{font-size:24px;margin:2px 0 4px;display:flex;justify-content:space-between;align-items:center;gap:8px}
#book .lede{font-size:18px;margin:0 0 10px;line-height:1.35}
#book h3{font-size:20px;margin:14px 0 6px;display:flex;align-items:center;gap:8px}
#book h3 small{font-size:18px;font-weight:700;color:var(--accent)}
#book ul{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
#book li{border:2px solid var(--line);border-radius:12px;padding:8px 10px;font-size:18px;line-height:1.3;min-height:64px}
#book li .k{font-weight:800;display:block}
#book li.no{border-style:dashed}
#book li.no .k::after{content:" ?"}
#invite{position:fixed;z-index:4;left:0;top:0;transform:translate(-50%,-100%);font-size:20px;font-weight:800;min-width:96px;min-height:48px;border-radius:16px;
  background:#f6ecd6;color:#1d1714;border:2.5px solid #1d1714;box-shadow:0 3px 0 rgba(0,0,0,.35);visibility:hidden}
#invite::after{content:"";position:absolute;left:50%;bottom:-11px;width:14px;height:14px;background:#f6ecd6;border-right:2.5px solid #1d1714;border-bottom:2.5px solid #1d1714;transform:translateX(-50%) rotate(45deg)}
#invite[hidden]{display:none}
#toast{position:fixed;z-index:5;left:50%;transform:translateX(-50%);bottom:calc(14px + env(safe-area-inset-bottom));
  width:min(92vw,460px);background:var(--chrome);color:var(--ink);border:2px solid var(--line);border-radius:16px;
  padding:10px 14px;font-size:18px;font-weight:700;line-height:1.3;text-align:center;box-shadow:0 4px 0 rgba(0,0,0,.35)}
#toast b{color:var(--accent)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
/* scene life */
.drift{animation:drift 60s linear infinite}
@keyframes drift{from{transform:translateX(-30px)}to{transform:translateX(60px)}}
.smoke circle{transform-box:fill-box;transform-origin:center;animation:smoke 6s linear infinite}
@keyframes smoke{0%{transform:translate(0,0) scale(.4);opacity:0}15%{opacity:.75}100%{transform:translate(28px,-120px) scale(2.1);opacity:0}}
.gear{transform-box:fill-box;transform-origin:center;animation:spin 9s linear infinite}
.gear.rev{animation-direction:reverse;animation-duration:6s}
@keyframes spin{to{transform:rotate(360deg)}}
.leaf{transform-box:fill-box;transform-origin:center;animation:leaf 9s linear infinite}
@keyframes leaf{0%{transform:translate(0,0) rotate(0);opacity:0}8%{opacity:1}100%{transform:translate(-70px,300px) rotate(540deg);opacity:0}}
.flicker{animation:flick 5s steps(1) infinite}
@keyframes flick{0%,40%,44%,100%{opacity:1}42%{opacity:.35}}
.bonie{transform-box:fill-box;transform-origin:50% 100%}
.bonie.chuckle{animation:chuck .16s ease-in-out 10 alternate}
@keyframes chuck{from{transform:translateY(0) rotate(-3deg)}to{transform:translateY(-4px) rotate(3deg)}}
.bonie.fall{animation:fall 2.6s ease-in-out 1}
@keyframes fall{0%{transform:rotate(0)}12%{transform:translateY(-8px) rotate(-14deg)}30%{transform:translate(18px,8px) rotate(95deg)}60%{transform:translate(18px,8px) rotate(95deg)}80%{transform:translate(8px,-4px) rotate(30deg)}100%{transform:rotate(0)}}
.bonie.hop{animation:hop .3s ease-out 1}
@keyframes hop{50%{transform:translateY(-10px)}}
[role=button]{cursor:grab}
@media (prefers-reduced-motion: reduce){ .drift,.smoke circle,.gear,.leaf{animation:none} }
</style>
</head>

/* ---------- physics ---------- */
var SX=118,SY=GROUND-24,SL=54,plankA=0,plankT=0;
function seesaw(b,dt){if(b.held||b.off)return;var dx=b.x-SX;if(Math.abs(dx)>SL)return;
  var surf=SY+dx*Math.tan(plankA)-5,bottom=b.y+b.r;if(bottom<surf||bottom-surf>26||b.vy<0)return;
  var side=dx>0?1:-1,imp=b.vy;b.y=surf-b.r;
  if(imp>300&&Math.abs(dx)>18){plankT=side*.32;S.clang();
    bodies.forEach(function(o){if(o===b||o.held||o.off)return;var odx=o.x-SX;if(Math.abs(odx)>SL+6||odx*side>0)return;var os=SY+odx*Math.tan(plankA)-5;if(Math.abs(o.y+o.r-os)>14)return;
      var kick=Math.min(1500,imp*1.2*clamp(b.m/o.m,.6,3));o.vy=-kick;o.vx=-side*rnd(20,90);o.ground=false;o.y-=4;if(o.kind==='char'){o.st='air';o.av=rnd(-500,500);o.launched=true;if(kick>600)gag('chain-seesaw',true)}})}
  var wasG=b.wasG;b.vy=0;b.vx+=Math.tan(plankA)*300*dt;b.vx*=Math.pow(.2,dt);b.onPlank=true;b.ground=true;if(!wasG&&imp>140)landed(b,imp)}
function stepBody(b,dt){if(b.off)return;if(b.held||b.pinned){return}

  if(b.kind==='feather'&&!b.ground){b.vx+=Math.sin(now*3+b.x*.01)*90*dt}
  b.x+=b.vx*dt;b.y+=b.vy*dt;
  if(b.zoom&&b.y<70){b.y=70;b.vy=Math.abs(b.vy)}
  if(b.y<-300&&b.vy<0)b.vy*=.5;
  if(b.entering){if(b.x>WL+b.r+6&&b.x<WR-b.r-6)b.entering=false}
  else{
  if(b.x-b.r<WL){b.x=WL+b.r;if(b.vx<-40){wallHit(b,b.vx)}b.vx=Math.abs(b.vx)*.55}
  if(b.x+b.r>WR){b.x=WR-b.r;if(b.vx>40){wallHit(b,b.vx)}b.vx=-Math.abs(b.vx)*.55}}
  var wasG=b.ground;b.wasG=wasG;b.ground=false;b.onPlank=false;
  if(b.y+b.r>=GROUND){var imp=b.vy;b.y=GROUND-b.r;
    if(b.kind==='char'&&b.bounces>0&&imp>150){b.bounces--;var n=3-b.bounces;b.vy=-Math.min(1250,Math.max(imp*1.05,520+n*160));b.puffT=1.3+n*.35;b.sx=1.5;b.sy=.6;S.boing(0,1+n*.22);dust(b.x,6);quake(2);
      if(b.bounces===0)later(.9,function(){b.puffT=1})}
    else{if(imp>80&&b.e>0)b.vy=-imp*b.e;else b.vy=0;b.ground=true;
      if(!wasG&&imp>140)landed(b,imp)}
    var fr=b.slide>0?.7:(b.kind==='char'?.0005:.03);if(b.ground&&!(b.kind==='char'&&b.slide>0&&b.key==='mote'))b.vx*=Math.pow(fr,dt);

function wallHit(b,v){if(Math.abs(v)<200)return;stars(b.x+(v>0?b.r:-b.r),b.y-b.r*.4);S.bonk();
  if(b.kind==='char'&&b.blindWalk){}}
function landed(b,imp){

    ch.sx=1.3;ch.sy=.7;if(imp>300)dust(ch.x,5);

function norm(a){a=((a+180)%360+360)%360-180;return a}

function collide(a,b){if(a.off||b.off||a.pinned||b.pinned||(a.held&&b.held))return;if(a.ghost>now||b.ghost>now)return;
  if(a.kind==='feather'||b.kind==='feather')return;

function special(p,ch,nx,ny,sp){if(ch.kind!=='char'||ch.held)return false;
  if(p.kind==='pie'&&!p.held&&!p.pinned){if(p.ghostOf===ch&&p.ghostUntil>now)return true;
    if(p.karma&&p.target===ch){R.flip.karma(ch,p);return true}
    var v=Math.hypot(p.vx,p.vy);if(v>140&&!isBusy(ch)){var r=R[ch.key].pie(ch,p);if(r===true)return true;return true}

var beat=0;
function stepChar(ch,dt){

function placeInvite(){if(!invited||!C.mote)return;var m=C.mote,p=svg.createSVGPoint();p.x=clamp(m.x,60,300);p.y=m.y-m.r-12;var q=p.matrixTransform(svg.getScreenCTM());
  var iv=$('invite');iv.style.left=q.x.toFixed(0)+'px';iv.style.top=q.y.toFixed(0)+'px';iv.style.visibility='visible'}
function pt(e){var p=svg.createSVGPoint();p.x=e.clientX;p.y=e.clientY;return p.matrixTransform(svg.getScreenCTM().inverse())}
function pick(x,y){var best=null,bs=1e9;bodies.forEach(function(b){if(b.off)return;var d=Math.hypot(b.x-x,b.y-y),lim=Math.max(24,b.r+14);if(d<lim){var s=d/lim+(b.kind==='char'?.15:0);if(s<bs){bs=s;best=b}}});return best}
svg.addEventListener('pointerdown',function(e){ac();dropInvite();var p=pt(e);
  if(p.x<74&&p.y>556&&p.y<640&&!pick(p.x,p.y)){crateTap();return}
  var b=pick(p.x,p.y);if(!b)return;e.preventDefault();try{svg.setPointerCapture(e.pointerId)}catch(_){}
  if(b.kind==='char'&&b.float){b.float=false;b.grav=1;b.puffT=1;S.down()}
  drag={b:b,id:e.pointerId,ox:b.x-p.x,oy:b.y-p.y,sx:p.x,sy:p.y,t0:now,lx:p.x,ly:p.y,lt:now,vx:0,vy:0,moved:0,rev:0,lastSign:0,revT:now};
  b.held=true;b.pinned=false;b.vx=b.vy=0;b.ground=false;if(b.kind==='char'){b.face('oh',99);b.tween=null;b.frozen=false;b.headstand=false;b.slide=0;b.landHook=null;if(!b.zoom)b.busyT=0;b.bounces=0;b.ring=0}});
svg.addEventListener('pointermove',function(e){if(!drag||e.pointerId!==drag.id)return;var p=pt(e),b=drag.b,dt=Math.max(.008,now-drag.lt);
  var nx=clamp(p.x+drag.ox,WL+b.r,WR-b.r),ny=Math.min(p.y+drag.oy,GROUND-b.r);
  var vx=(nx-b.x)/dt,vy=(ny-b.y)/dt;drag.vx=drag.vx*.6+vx*.4;drag.vy=drag.vy*.6+vy*.4;drag.moved+=Math.hypot(p.x-drag.lx,p.y-drag.ly);
  var sg=Math.abs(drag.vx)>380?(drag.vx>0?1:-1):0;if(sg&&sg!==drag.lastSign){if(now-drag.revT<.45)drag.rev++;else drag.rev=1;drag.lastSign=sg;drag.revT=now}
  if(b.kind==='char'&&drag.rev>=4){drag.rev=0;shaken(b)}
  if(b.kind==='feather'){var mv=Math.hypot(nx-b.x,ny-b.y);for(var k in C){var c=C[k];if(Math.hypot(c.x-nx,c.y-ny)<c.r+16)tickle(c,mv)}}
  b.x=nx;b.y=ny;b.vx=drag.vx;b.vy=drag.vy;drag.lx=p.x;drag.ly=p.y;drag.lt=now});
function release(e){if(!drag||(e&&e.pointerId!==drag.id))return;var b=drag.b;b.held=false;
  if(b.kind==='char'){b.face(b.key==='bloat'||b.key==='flip'?'smile':'flat',.1);if(b.key==='bloat'&&!b.zoom)b.puffT=1}
  if(drag.moved<10&&now-drag.t0<.4){b.vx=b.vy=0;if(b.kind==='char')poke(b);drag=null;return}
  var v=Math.hypot(drag.vx,drag.vy),k=v>1700?1700/v:1;b.vx=drag.vx*k;b.vy=drag.vy*k;
  if(b.kind==='char'){b.st='air';b.flung=true;b.av=clamp(b.vx*.5,-700,700);if(b.y+b.r>GROUND-6&&v<200){b.flung=false;settle(b)}}
  else b.av=rnd(-600,600);
  if(b.kind==='feather'&&v<60){b.vx=0;b.vy=0}
  drag=null}
svg.addEventListener('pointerup',release);svg.addEventListener('pointercancel',release);
function poke(ch){if(isBusy(ch)&&!(ch.key==='bloat'&&!ch.zoom))return;S.squeak();R[ch.key].poke(ch)}
function shaken(ch){if(ch.key==='tock'){R.tock.alarm(ch);return}
  if(ch.key==='bloat'){ch.puffT=1.8;ch.face('wobble',1);S.giggle(0,4,.7);later(.7,function(){ch.puffT=1.15})}
  else if(ch.key==='mote'){if(!ch.bub)say(ch,'hm.');S.hm()}
  else if(ch.key==='flip'){S.whoosh()}}
function tickle(ch,mv){if(ch.held||isBusy(ch))return;ch.tickle+=mv;var need=ch.key==='mote'?1400:ch.key==='bloat'?260:320;
  if(Math.random()<.08){S.squeak();ch.sx=1.06;if(ch.key==='mote'){blink(ch)}else ch.face('laugh',.3)}
  if(ch.tickle>need){ch.tickle=0;R[ch.key].feather(ch)}}
function crateTap(){S.pop();var b=makePeel(40,560,rnd(60,170),-rnd(380,520));live('A banana peel hops out of the crate.')}

/* ---------- keyboard and voice control ---------- */
var selected=null;
function bindKeys(b){b.el.addEventListener('keydown',function(e){ac();dropInvite();
  if(b.kind==='char'){if(e.key==='Enter'||e.key===' '){e.preventDefault();if(selected){hand(selected,b);selected=null}else poke(b)}
    else if(e.key==='f'||e.key==='F'){e.preventDefault();b.vy=-900;b.vx=rnd(-120,120);b.ground=false;b.st='air';b.flung=true;b.av=rnd(-500,500);live(b.name+' flies up.')}}
  else if(e.key==='Enter'||e.key===' '){e.preventDefault();selected=b;live(b.el.getAttribute('aria-label').split('.')[0]+' picked up. Now choose a robot and press Enter.')}});
  b.el.addEventListener('click',function(){})}
$('crate').addEventListener('keydown',function(e){if(e.key==='Enter'||e.key===' '){e.preventDefault();ac();crateTap()}});
function hand(p,ch){if(p.off)return;p.pinned=false;
  if(p.kind==='pie'){var side=ch.x>180?-1:1;p.x=ch.x+side*110;p.y=ch.y-ch.r*.4;p.vx=-side*520;p.vy=-40}
  else if(p.kind==='bucket'){if(ch.hat)return;p.x=ch.x;p.y=ch.y-ch.r-140;p.vx=0;p.vy=60}
  else if(p.kind==='peel'){p.x=clamp(ch.x+ch.dir*(ch.r+30),30,330);p.y=GROUND-12;p.vx=p.vy=0;ch.pauseT=5;ch.busyT=0}
  else if(p.kind==='feather'){if(!isBusy(ch))R[ch.key].feather(ch)}}

/* ---------- chrome ---------- */
var MODES=['light','dark','sharp'],MN={light:'Light',dark:'Dark',sharp:'Sharp'};
var mode=(window.matchMedia&&matchMedia('(prefers-color-scheme: dark)').matches)?'dark':'light';
function applyMode(){document.documentElement.setAttribute('data-comfort',mode);var nx=MODES[(MODES.indexOf(mode)+1)%3];$('modeBtn').setAttribute('aria-label','Mode: '+MN[mode]+'. Switch to '+MN[nx]+'.')}
$('modeBtn').onclick=function(){mode=MODES[(MODES.indexOf(mode)+1)%3];applyMode();live(MN[mode]+' mode')};applyMode();
$('soundBtn').onclick=function(){soundOn=!soundOn;$('soundBtn').setAttribute('aria-pressed',soundOn);$('soundBtn').setAttribute('aria-label',soundOn?'Sound on. Switch off.':'Sound off. Switch on.');
  $('sWave').setAttribute('visibility',soundOn?'visible':'hidden');$('sX').setAttribute('visibility',soundOn?'hidden':'visible')};
function setMenu(o){$('topbar').classList.toggle('open',o);$('menuBtn').setAttribute('aria-expanded',o);if(o)$('modeBtn').focus()}
$('menuBtn').onclick=function(){setMenu(!$('topbar').classList.contains('open'))};$('menuClose').onclick=function(){setMenu(false);$('menuBtn').focus()};
$('bookBtn').onclick=function(){renderBook();$('book').hidden=false;$('bookClose').focus()};
$('bookClose').onclick=function(){$('book').hidden=true;$('bookBtn').focus()};
document.addEventListener('keydown',function(e){if(e.key==='Escape'){if(!$('book').hidden){$('book').hidden=true;$('bookBtn').focus()}else setMenu(false)}});
$('resetBtn').onclick=function(){bucket.off=false;for(var k in C){var c=C[k];if(c.hat)hatOff(c);c.held=false;c.float=false;c.grav=1;c.puffT=1;c.rot=upright(c);c.st='walk';c.busyT=0;c.y=GROUND-c.R;c.vx=c.vy=0}
  bucket.x=282;bucket.y=GROUND-18;bucket.vx=bucket.vy=0;bucket.el.setAttribute('visibility','visible');bucket.sh.setAttribute('visibility','visible');
  feather.pinned=true;feather.x=231;feather.y=440;feather.vx=feather.vy=0;feather.rot=0;
  if(pie&&!pie.off){pie.pinned=true;pie.x=316;pie.y=543;pie.vx=pie.vy=0;pie.rot=0}
  while(peels.length){var p=peels.pop();kill(p)}setMenu(false);live('The yard is tidy.')};

/* ---------- start: scene first, no wall ---------- */
makeChar('mote',150,GROUND-20);
var tk=makeChar('tock',392,GROUND-30);tk.dir=-1;tk.entering=true;
makePie();makePeel(86,GROUND-11);
/* test hook for the studio playtest harness; inert for players */
window.__fb={C:C,bodies:bodies,GAG:GAG,R:R,poke:poke,hand:hand,pie:function(){return pie},bucket:bucket,feather:feather,peels:peels,arrivals:arrivals,shaken:shaken,tickle:tickle,get now(){return now},setNow:function(t){now=t}};

var last=performance.now(),acc=0;
function frame(t){var dt=Math.min(.05,(t-last)/1000);last=t;now+=dt;
  runTimers();
  var sub=3,h=dt/sub;for(var s=0;s<sub;s++){bodies.forEach(function(b){stepBody(b,h)});
    for(var i=0;i<bodies.length;i++)for(var j=i+1;j<bodies.length;j++)collide(bodies[i],bodies[j])}
  for(var k in C)stepChar(C[k],dt);
  plankA=ease(plankA,plankT,dt*14);plankT=ease(plankT,0,dt*1.2);
  for(var li=leaves.length-1;li>=0;li--){var L=leaves[li];L.t+=dt;L.y+=60*dt;L.x+=Math.sin(L.t*4)*20*dt;L.e.setAttribute('transform','translate('+L.x.toFixed(1)+' '+L.y.toFixed(1)+') rotate('+(L.t*200%360).toFixed(0)+')');
    if(L.y>L.ch.y+L.ch.r-8||L.t>4){L.e.remove();leaves.splice(li,1)}}
  bonies.forEach(function(b){if(b.t>0){b.t-=dt;if(b.t<=0)bonieFace(b,'bored')}});
  if(toastT&&now>toastT){$('toast').hidden=true;toastT=0}
  if(shake>0)shake=Math.max(0,shake-dt*14);
  if(Math.floor(now)%5===0)arrivals();
  stepParts(dt);draw();placeInvite();requestAnimationFrame(frame)}
requestAnimationFrame(frame);
})();
</script>
