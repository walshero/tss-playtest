<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>The Laugh Workshop v9.1</title>
<meta name="description" content="Two parts. Two kinds of funny. The order between them is the whole joke.">
<meta name="spec-source" content="funnybonies/SPEC-LINK-v9.md">
<meta name="audience" content="kids, grades 3 to 6">
<style>
/* ===========================================================
   The Laugh Workshop  ·  v9.1
   Funnybonies, rebuilt on the Laughter Foundry lineage.
   Spec: funnybonies/SPEC-LINK-v9.md
   Audience: kids, grades 3 to 6.
   Onion layers built here: 4 (Too much), 2 (Surprise), 3 (Again but different).
   Register: Samorost + Lumino City. A miniature that was BUILT and LIT.
   Layered cardboard, cut paper, one warm lamp, real cast shadow.
   Light theme = the shutters are open. Dark theme = the work lamp at night.
   Nothing is stored. In memory only.
   =========================================================== */
:root{
  color-scheme: light dark;
  --room:#D9C3A0; --wall:#CBB08A; --panel:#E3D2B4;
  --card:#C9A97C; --card2:#A8845A; --card3:#8C6B45;
  --cut:#F4EADC; --ink:#2E241C; --soft:#5C4A3A;
  --shade:rgba(46,36,28,.30);
  --lamp:#B34E0B; --onlamp:#FFFFFF; --lamp-ink:#8A3907; --glow:#E8913A;
  --rule:#A8916E;
  --pad:18px; --r:12px;
}
/* the work lamp at night. same room, later hour. */
@media (prefers-color-scheme: dark){
  :root{
    --room:#141010; --wall:#1E1714; --panel:#241C17;
    --card:#6B4E30; --card2:#4A351F; --card3:#332415;
    --cut:#D9CBB6; --ink:#EFE2CE; --soft:#BCA88C;
    --shade:rgba(0,0,0,.55);
    --lamp:#FFB347; --onlamp:#1B1008; --lamp-ink:#FFC46B; --glow:#FFB347;
    --rule:#3A2E24;
  }
}
body.dusk{
  --room:#3A2C20; --wall:#463628; --panel:#4E3C2C;
  --card:#8A6845; --card2:#63482D; --card3:#48331F;
  --cut:#E6D9C4; --ink:#F2E7D5; --soft:#C9B69A;
  --shade:rgba(0,0,0,.45);
  --lamp:#FFA93A; --onlamp:#241503; --lamp-ink:#FFBF66; --glow:#FFA93A;
  --rule:#5A4632;
}
body.night{
  --room:#141010; --wall:#1E1714; --panel:#241C17;
  --card:#6B4E30; --card2:#4A351F; --card3:#332415;
  --cut:#D9CBB6; --ink:#EFE2CE; --soft:#BCA88C;
  --shade:rgba(0,0,0,.55);
  --lamp:#FFB347; --onlamp:#1B1008; --lamp-ink:#FFC46B; --glow:#FFB347;
  --rule:#3A2E24;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--room); color:var(--ink);
  font:400 20px/1.45 "Avenir Next","Segoe UI",Roboto,system-ui,-apple-system,sans-serif;
  -webkit-text-size-adjust:100%; padding:0 0 40px;
}
.wrap{max-width:560px; margin:0 auto; padding:0 var(--pad)}

h1{font-size:32px; line-height:1.08; margin:14px 0 6px; letter-spacing:-.4px}
h2{font-size:25px; line-height:1.2; margin:0 0 6px}
p{margin:0 0 14px}
.lede{font-size:21px; margin:0 0 14px}
.tiny{font-size:18px}
.ver{display:inline-block; font-size:20px; font-weight:700; letter-spacing:0;
  color:var(--lamp-ink); border:2.5px solid var(--lamp-ink); border-radius:9px;
  padding:1px 9px; vertical-align:middle; white-space:nowrap}

button{font:inherit; color:inherit; cursor:pointer; -webkit-tap-highlight-color:transparent}
.primary{display:block; width:100%; min-height:60px; padding:15px 20px;
  background:var(--lamp); color:var(--onlamp); border:none; border-radius:var(--r);
  font-size:22px; font-weight:700; box-shadow:0 3px 0 var(--card3)}
.primary:active{transform:translateY(2px); box-shadow:0 1px 0 var(--card3)}
.primary[disabled]{background:var(--panel); color:var(--ink);
  border:2.5px dashed var(--rule); box-shadow:none}
.ghost{min-height:52px; padding:12px 16px; background:transparent; color:var(--ink);
  border:2.5px solid var(--ink); border-radius:var(--r); font-size:19px; font-weight:600}
.navbar{display:flex; gap:10px; padding:12px 0 8px}
.navbar button{flex:1}
button:focus-visible,[tabindex]:focus-visible{outline:4px solid var(--lamp-ink); outline-offset:3px}

.screen{display:none}
.screen.on{display:block}

/* ---- the stage: one built room, reused everywhere ---- */
.stage{width:100%; display:block; margin:0 0 14px; border-radius:var(--r);
  background:var(--wall); box-shadow:0 6px 0 var(--card3)}

/* ---- part cards on the bench ---- */
.parts{display:grid; gap:12px; margin:0 0 16px}
.part{display:flex; align-items:center; gap:14px; width:100%; text-align:left;
  background:var(--panel); border:3px solid var(--ink); border-radius:var(--r);
  padding:12px 14px; min-height:88px}
.part.known{border-color:var(--lamp-ink); box-shadow:inset 0 0 0 2px var(--lamp-ink)}
.part svg{width:56px; height:56px; flex:0 0 56px}
.part .col{flex:1; min-width:0; display:block}
.part .nm{font-size:21px; font-weight:700; display:block}
.part .why{font-size:18px; display:block; color:var(--soft)}
.part .tag{font-size:18px; font-weight:700; color:var(--lamp-ink); display:block}

/* ---- the order rail ---- */
.rail{display:grid; gap:10px; margin:0 0 16px}
.slot .ord{font-size:18px; color:var(--soft); font-weight:700}
.slot{display:flex; flex-direction:row; align-items:center; gap:12px; min-height:76px; border:3px dashed var(--rule); border-radius:var(--r);
  background:var(--panel); font-size:19px; font-weight:700; padding:8px 14px}
.slot.filled{border-style:solid; border-color:var(--ink)}
.slot svg{width:44px; height:44px; flex:0 0 44px}
.arrow{flex:0 0 26px}
.arrow svg{width:26px; height:26px; display:block}

.say{border-left:5px solid var(--lamp-ink); padding:8px 0 8px 14px; margin:0 0 16px;
  font-size:19px}
.foot{border-top:2px solid var(--rule); margin-top:24px; padding-top:14px; font-size:18px}

/* ---- ambient life: the set breathes when nobody touches it ---- */
@keyframes mote{0%{transform:translate(0,0);opacity:0}
  12%{opacity:.75} 88%{opacity:.55} 100%{transform:translate(26px,-96px);opacity:0}}
@keyframes flick{0%,100%{opacity:.30} 45%{opacity:.38} 70%{opacity:.27}}
@keyframes sway{0%,100%{transform:rotate(-1.2deg)} 50%{transform:rotate(1.2deg)}}
.mote{animation:mote 11s linear infinite}
.mote:nth-of-type(2){animation-duration:14s; animation-delay:-4s}
.mote:nth-of-type(3){animation-duration:9s;  animation-delay:-7s}
#beam,.beam{animation:flick 6s ease-in-out infinite}
#hang{transform-origin:172px 6px; animation:sway 7s ease-in-out infinite}
/* Cleese rule (studio canon): the player laughs before they read. The splash does
   the joke by itself, on a loop, so nothing has to be understood first. */
@keyframes plop{
  0%,48%{opacity:0; transform:translate(0,0)}
  50%{opacity:1; transform:translate(0,0)}
  63%{opacity:1; transform:translate(4px,36px)}
  69%{opacity:1; transform:translate(7px,20px)}
  76%{opacity:1; transform:translate(14px,36px)}
  80%{opacity:1; transform:translate(19px,29px)}
  85%{opacity:1; transform:translate(26px,36px)}
  99%{opacity:1; transform:translate(96px,36px)}
  100%{opacity:0; transform:translate(100px,36px)}}
#plop{animation:plop 5.5s cubic-bezier(.5,0,.85,.5) infinite}

/* ---- THE JACK: crank, the pause, the pop ---- */
#crank{transform-origin:250px 214px; transition:transform .40s cubic-bezier(.4,0,.5,1)}
#lid{transform-origin:222px 190px; transition:transform .34s cubic-bezier(.2,1.6,.5,1)}
#spring{transform-origin:250px 196px; transform:scaleY(.06); opacity:0;
  transition:transform .34s cubic-bezier(.2,1.7,.5,1), opacity .1s}
#head{transform-origin:250px 150px; transform:translateY(46px) scale(.5); opacity:0;
  transition:transform .34s cubic-bezier(.2,1.9,.5,1), opacity .12s}
.jack-open #spring{transform:scaleY(1); opacity:1}
.jack-open #head{transform:translateY(0) scale(1); opacity:1}
.jack-open #lid{transform:rotate(-118deg) translate(-8px,-6px)}
.jack-wob #head{animation:wob .5s ease-out 1}
@keyframes wob{0%{transform:translateY(-7px) scale(1.06)}
  45%{transform:translateY(2px) scale(.97)} 100%{transform:translateY(0) scale(1)}}

/* ---- THE ECHO: two the same makes a rule, the third one breaks it ---- */
#arm{transform-origin:140px 50px; transition:transform .26s cubic-bezier(.35,0,.4,1)}
.arm-up   #arm{transform:translateX(0px)   rotate(-30deg)}
.arm-hit1 #arm{transform:translateX(40px)  rotate(6deg)}
.arm-hit2 #arm{transform:translateX(82px)  rotate(6deg)}
.arm-hit3 #arm{transform:translateX(124px) rotate(96deg)}
.bell{transform-origin:center top; transition:transform .3s cubic-bezier(.3,1.5,.5,1)}
.ring1 #bell1,.ring2 #bell2{animation:ring .46s ease-out 1}
@keyframes ring{0%{transform:rotate(0)} 22%{transform:rotate(13deg)}
  55%{transform:rotate(-9deg)} 80%{transform:rotate(4deg)} 100%{transform:rotate(0)}}
#bell3{transition:transform .34s cubic-bezier(.3,0,.4,1)}
.bolt #bell3{transform:translateY(-118px)}
.wave{opacity:0}
.ring1 .w1,.ring2 .w2{animation:wave .55s ease-out 1}
@keyframes wave{0%{opacity:.9; transform:scale(.4)} 100%{opacity:0; transform:scale(1.9)}}

/* ---- THE AVALANCHE: it does not know when to stop ---- */
#hopper{transform-origin:96px 168px; transition:transform .35s cubic-bezier(.4,0,.4,1)}
.hop-back #hopper{transform:rotate(-5deg)}
.hop-pour #hopper{transform:rotate(42deg)}
.hop-shake #hopper{animation:shake .16s linear 5}
@keyframes shake{0%,100%{transform:rotate(42deg)} 50%{transform:rotate(38deg)}}
#hopper2{transform:translateY(-190px); opacity:0;
  transition:transform .5s cubic-bezier(.35,0,.4,1), opacity .2s}
#hopper2.in{transform:translateY(0) rotate(34deg); opacity:1}
.pel{opacity:0}
.pel.go{animation:drop var(--d,1.1s) cubic-bezier(.45,0,.75,.55) forwards}
@keyframes drop{0%{opacity:1; transform:translate(0,0)}
  70%{opacity:1} 100%{opacity:1; transform:translate(var(--dx,0px),var(--dy,150px))}}
#puff{opacity:0; transform-origin:150px 330px}
#puff.go{animation:puff .9s ease-out 1}
@keyframes puff{0%{opacity:.0; transform:scale(.4)} 25%{opacity:.55}
  100%{opacity:0; transform:scale(1.7)}}

@media (prefers-reduced-motion: reduce){
  *{animation:none !important; transition:none !important}
  .primary:active{transform:none}
}
</style>
</head>
<body>

<div class="wrap">

<!-- ================= SCREEN 0 : the workshop ================= -->
<section class="screen on" id="s0" aria-labelledby="t0">
  <h1 id="t0">The Laugh Workshop <span class="ver">v9.1</span></h1>

  <svg class="stage" viewBox="0 0 360 372" role="img"
       aria-label="A workshop built out of cardboard. A lamp hangs over a bench and lights it. On the bench sit a hopper full of paper balls and a box with a crank. Both throw shadows.">
    <defs>
      <clipPath id="room"><rect x="0" y="0" width="360" height="372" rx="12"/></clipPath>
      <!-- the lamp actually lights the room: falloff, not an overlay triangle -->
      <radialGradient id="fall0" cx="172" cy="70" r="270" gradientUnits="userSpaceOnUse">
        <stop offset="0" stop-color="var(--glow)" stop-opacity=".55"/>
        <stop offset=".42" stop-color="var(--glow)" stop-opacity=".18"/>
        <stop offset="1" stop-color="var(--glow)" stop-opacity="0"/>
      </radialGradient>
      <radialGradient id="vig0" cx="180" cy="190" r="270" gradientUnits="userSpaceOnUse">
        <stop offset=".45" stop-color="#000" stop-opacity="0"/>
        <stop offset="1" stop-color="#000" stop-opacity=".42"/>
      </radialGradient>
      <!-- cardboard fibre. corrugation is what makes it read as a built thing -->
      <pattern id="grain0" width="7" height="7" patternUnits="userSpaceOnUse">
        <path d="M0 0 L0 7" stroke="var(--card3)" stroke-width="1" opacity=".22"/>
      </pattern>
      <pattern id="corr0" width="6" height="5" patternUnits="userSpaceOnUse">
        <path d="M3 0 L3 5" stroke="var(--card3)" stroke-width="1.6" opacity=".55"/>
      </pattern>
    </defs>
    <g clip-path="url(#room)">
      <rect x="0" y="0" width="360" height="372" fill="var(--wall)"/>
      <rect x="0" y="0" width="360" height="372" fill="url(#grain0)"/>
      <g stroke="var(--card3)" stroke-width="1.4" opacity=".38">
        <path d="M0 34 H360"/><path d="M0 78 H360"/><path d="M0 122 H360"/><path d="M0 166 H360"/>
      </g>
      <rect x="0" y="0" width="360" height="372" fill="url(#fall0)"/>

      <!-- the hopper: cut edge behind the face, shadow thrown away from the lamp -->
      <ellipse cx="105" cy="291" rx="30" ry="7" fill="#000" opacity=".30"/>
      <g transform="translate(30,164) scale(.62)">
        <path d="M68 126 L92 206 L164 206 L188 126 Z" fill="var(--card3)"/>
        <path d="M60 120 L84 200 L156 200 L180 120 Z" fill="var(--card)" stroke="var(--ink)" stroke-width="4" stroke-linejoin="round"/>
        <path d="M60 120 L180 120 L176 132 L64 132 Z" fill="url(#corr0)" stroke="var(--ink)" stroke-width="4" stroke-linejoin="round"/>
        <circle cx="98" cy="156" r="11" fill="var(--cut)" stroke="var(--ink)" stroke-width="3"/>
        <circle cx="126" cy="152" r="11" fill="var(--cut)" stroke="var(--ink)" stroke-width="3"/>
        <circle cx="112" cy="178" r="11" fill="var(--cut)" stroke="var(--ink)" stroke-width="3"/>
      </g>

      <!-- the box: same treatment, shadow falls right because the lamp is left of it -->
      <ellipse cx="261" cy="291" rx="38" ry="7" fill="#000" opacity=".30"/>
      <g transform="translate(214,198) scale(.62)">
        <rect x="27" y="67" width="112" height="86" rx="6" fill="var(--card3)"/>
        <rect x="20" y="60" width="112" height="86" rx="6" fill="var(--card)" stroke="var(--ink)" stroke-width="4"/>
        <rect x="20" y="60" width="112" height="13" fill="url(#corr0)" stroke="var(--ink)" stroke-width="4"/>
        <circle cx="146" cy="112" r="9" fill="var(--card2)" stroke="var(--ink)" stroke-width="4"/>
        <path d="M146 112 L170 96" stroke="var(--ink)" stroke-width="5" stroke-linecap="round"/>
      </g>

      <!-- the bench, with its cut edge and a dark front rail: three depth layers -->
      <rect x="0" y="288" width="360" height="16" fill="var(--card)" stroke="var(--ink)" stroke-width="2.5"/>
      <rect x="0" y="304" width="360" height="12" fill="url(#corr0)"/>
      <rect x="0" y="304" width="360" height="12" fill="var(--card3)" opacity=".55"/>
      <rect x="34" y="316" width="14" height="56" fill="var(--card2)" stroke="var(--ink)" stroke-width="2"/>
      <rect x="308" y="316" width="14" height="56" fill="var(--card2)" stroke="var(--ink)" stroke-width="2"/>

      <!-- the lamp last, so it sits in front of its own light -->
      <g id="hang">
        <path d="M172 0 L172 34" stroke="var(--card3)" stroke-width="3"/>
        <path d="M143 72 L172 32 L201 72 Z" fill="var(--card3)"/>
        <path d="M146 70 L172 34 L198 70 Z" fill="var(--card2)" stroke="var(--ink)" stroke-width="2.5" stroke-linejoin="round"/>
        <ellipse cx="172" cy="70" rx="26" ry="6" fill="var(--glow)"/>
        <ellipse cx="172" cy="70" rx="14" ry="3.5" fill="var(--cut)" opacity=".8"/>
      </g>
      <circle class="mote" cx="140" cy="252" r="2.6" fill="var(--cut)" opacity="0"/>
      <circle class="mote" cx="182" cy="266" r="2" fill="var(--cut)" opacity="0"/>
      <circle class="mote" cx="164" cy="242" r="2.3" fill="var(--cut)" opacity="0"/>
      <circle id="plop" cx="104" cy="252" r="9" fill="var(--cut)" stroke="var(--ink)" stroke-width="2.5"/>
      <rect x="0" y="0" width="360" height="372" fill="url(#vig0)"/>
    </g>
  </svg>

  <button class="primary" id="startBtn">Start</button>
  <p class="foot tiny">Nothing is saved. Tight Spiral Studios.</p>
</section>

<!-- ================= SCREEN 1 : the bench ================= -->
<section class="screen" id="s1" aria-labelledby="t1">
  <div class="navbar">
    <button class="ghost" id="backBtn">Back</button>
    <button class="ghost" id="homeBtn" aria-label="Start over from the beginning">Start over</button>
  </div>
  <h2 id="t1">Tap a part</h2>
  <p class="tiny" id="benchHint">It will go, then tell you what kind of funny it is.</p>

  <svg class="stage" id="bench" viewBox="0 0 360 380" role="img" aria-labelledby="benchDesc">
    <desc id="benchDesc">The workshop bench. A hopper of paper balls on the left, a box with a crank on the right.</desc>
    <defs>
      <clipPath id="room2"><rect x="0" y="0" width="360" height="380" rx="12"/></clipPath>
      <radialGradient id="fall1" cx="180" cy="10" r="300" gradientUnits="userSpaceOnUse">
        <stop offset="0" stop-color="var(--glow)" stop-opacity=".50"/>
        <stop offset=".45" stop-color="var(--glow)" stop-opacity=".16"/>
        <stop offset="1" stop-color="var(--glow)" stop-opacity="0"/>
      </radialGradient>
      <radialGradient id="vig1" cx="180" cy="190" r="270" gradientUnits="userSpaceOnUse">
        <stop offset=".45" stop-color="#000" stop-opacity="0"/>
        <stop offset="1" stop-color="#000" stop-opacity=".40"/>
      </radialGradient>
      <pattern id="grain1" width="7" height="7" patternUnits="userSpaceOnUse">
        <path d="M0 0 L0 7" stroke="var(--card3)" stroke-width="1" opacity=".22"/>
      </pattern>
      <pattern id="corr1" width="6" height="5" patternUnits="userSpaceOnUse">
        <path d="M3 0 L3 5" stroke="var(--card3)" stroke-width="1.6" opacity=".55"/>
      </pattern>
    </defs>
    <g clip-path="url(#room2)">
      <rect x="0" y="0" width="360" height="380" fill="var(--wall)"/>
      <rect x="0" y="0" width="360" height="380" fill="url(#grain1)"/>
      <g stroke="var(--card3)" stroke-width="1.4" opacity=".34">
        <path d="M0 40 H360"/><path d="M0 86 H360"/><path d="M0 132 H360"/>
      </g>
      <rect id="beam" x="0" y="0" width="360" height="380" fill="url(#fall1)"/>
      <ellipse cx="96" cy="326" rx="34" ry="8" fill="#000" opacity=".30"/>
      <ellipse cx="250" cy="292" rx="60" ry="10" fill="#000" opacity=".26"/>
      <circle class="mote" cx="150" cy="280" r="2.6" fill="var(--cut)" opacity="0"/>
      <circle class="mote" cx="206" cy="300" r="2" fill="var(--cut)" opacity="0"/>
      <circle class="mote" cx="176" cy="266" r="2.3" fill="var(--cut)" opacity="0"/>

      <!-- ===== THE ECHO: three bells, one hammer, and a rule to break ===== -->
      <g id="echoGroup">
        <path d="M120 8 L120 62 M300 8 L300 46" stroke="var(--card3)" stroke-width="2.5"/>
        <path d="M120 46 H300" stroke="var(--card3)" stroke-width="4"/>
        <g class="bell" id="bell1">
          <path d="M180 46 L180 62" stroke="var(--card3)" stroke-width="2"/>
          <path d="M168 92 C168 74 172 64 180 64 C188 64 192 74 192 92 Z" fill="var(--card)" stroke="var(--ink)" stroke-width="3"/>
          <path d="M164 92 H196" stroke="var(--ink)" stroke-width="3"/>
        </g>
        <g class="bell" id="bell2">
          <path d="M222 46 L222 62" stroke="var(--card3)" stroke-width="2"/>
          <path d="M210 92 C210 74 214 64 222 64 C230 64 234 74 234 92 Z" fill="var(--card)" stroke="var(--ink)" stroke-width="3"/>
          <path d="M206 92 H238" stroke="var(--ink)" stroke-width="3"/>
        </g>
        <g id="bell3">
          <path d="M264 46 L264 62" stroke="var(--card3)" stroke-width="2"/>
          <path d="M252 92 C252 74 256 64 264 64 C272 64 276 74 276 92 Z" fill="var(--card)" stroke="var(--ink)" stroke-width="3"/>
          <path d="M248 92 H280" stroke="var(--ink)" stroke-width="3"/>
        </g>
        <circle class="wave w1" cx="180" cy="80" r="16" fill="none" stroke="var(--lamp)" stroke-width="3.5" opacity="0"/>
        <circle class="wave w2" cx="222" cy="80" r="16" fill="none" stroke="var(--lamp)" stroke-width="3.5" opacity="0"/>
        <g id="arm">
          <path d="M140 50 L140 80" stroke="var(--ink)" stroke-width="5" stroke-linecap="round"/>
          <rect x="129" y="78" width="22" height="15" rx="3" fill="var(--card3)"/>
          <rect x="127" y="76" width="22" height="15" rx="3" fill="var(--card2)" stroke="var(--ink)" stroke-width="3"/>
        </g>
        <circle cx="140" cy="50" r="6" fill="var(--card3)" stroke="var(--ink)" stroke-width="3"/>
      </g>

      <!-- ===== THE AVALANCHE ===== -->
      <g id="avaGroup">
        <g id="pellets"></g>
        <g id="hopper2" transform="translate(0,0)">
          <g transform="translate(52,20)">
            <path d="M44 60 L62 118 L114 118 L132 60 Z" fill="var(--card2)" stroke="var(--ink)" stroke-width="3.5" stroke-linejoin="round"/>
            <path d="M44 60 L132 60" stroke="var(--ink)" stroke-width="3.5"/>
          </g>
        </g>
        <g id="hopper">
          <path d="M62 134 L82 202 L142 202 L162 134 Z" fill="var(--card3)"/>
          <path d="M56 128 L76 196 L136 196 L156 128 Z" fill="var(--card)" stroke="var(--ink)" stroke-width="3.5" stroke-linejoin="round"/>
          <path d="M56 128 L156 128 L153 140 L59 140 Z" fill="url(#corr1)" stroke="var(--ink)" stroke-width="3.5" stroke-linejoin="round"/>
          <path d="M56 128 L48 122 M156 128 L164 122" stroke="var(--ink)" stroke-width="3.5" stroke-linecap="round"/>
          <circle cx="86" cy="154" r="9" fill="var(--cut)" stroke="var(--ink)" stroke-width="2.5"/>
          <circle cx="110" cy="150" r="9" fill="var(--cut)" stroke="var(--ink)" stroke-width="2.5"/>
          <circle cx="126" cy="160" r="9" fill="var(--cut)" stroke="var(--ink)" stroke-width="2.5"/>
          <circle cx="100" cy="174" r="9" fill="var(--cut)" stroke="var(--ink)" stroke-width="2.5"/>
        </g>
        <rect x="88" y="196" width="14" height="126" fill="var(--card3)" stroke="var(--ink)" stroke-width="2.5"/>
        <ellipse id="puff" cx="150" cy="330" rx="34" ry="12" fill="var(--cut)" opacity="0"/>
      </g>

      <!-- ===== THE JACK ===== -->
      <g id="jackGroup">
        <g id="spring">
          <path d="M250 196 L232 182 L268 168 L232 154 L268 140 L250 126"
                fill="none" stroke="var(--ink)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
        </g>
        <g id="head">
          <circle cx="250" cy="126" r="24" fill="var(--cut)" stroke="var(--ink)" stroke-width="3.5"/>
          <path d="M239 119 C242 113 247 113 250 119" fill="none" stroke="var(--ink)" stroke-width="3" stroke-linecap="round"/>
          <path d="M254 119 C257 113 262 113 265 119" fill="none" stroke="var(--ink)" stroke-width="3" stroke-linecap="round"/>
          <ellipse cx="252" cy="136" rx="8" ry="10" fill="var(--lamp)" stroke="var(--ink)" stroke-width="3"/>
        </g>
        <g id="lid">
          <rect x="204" y="180" width="92" height="14" rx="3" fill="var(--card2)" stroke="var(--ink)" stroke-width="3.5"/>
        </g>
        <rect x="210" y="200" width="92" height="86" rx="5" fill="var(--card3)"/>
        <rect x="204" y="194" width="92" height="86" rx="5" fill="var(--card)" stroke="var(--ink)" stroke-width="3.5"/>
        <rect x="204" y="194" width="92" height="13" fill="url(#corr1)" stroke="var(--ink)" stroke-width="3.5"/>
        <g id="crank">
          <circle cx="250" cy="214" r="0" fill="none"/>
          <g transform="translate(0,0)">
            <circle cx="304" cy="238" r="8" fill="var(--card2)" stroke="var(--ink)" stroke-width="3.5"/>
            <path d="M304 238 L324 224" stroke="var(--ink)" stroke-width="4.5" stroke-linecap="round"/>
          </g>
        </g>
        <rect x="196" y="280" width="108" height="10" fill="var(--card3)" stroke="var(--ink)" stroke-width="2.5"/>
      </g>

      <rect x="0" y="322" width="360" height="16" fill="var(--card)" stroke="var(--ink)" stroke-width="3"/>
      <rect x="0" y="338" width="360" height="14" fill="url(#corr1)"/>
      <rect x="0" y="338" width="360" height="42" fill="var(--card3)" opacity=".7"/>
      <rect x="0" y="0" width="360" height="380" fill="url(#vig1)"/>
    </g>
  </svg>

  <div class="parts" id="parts"></div>

  <div id="orderBlock" hidden>
  <h2 id="t1b">Now put them in order</h2>
  <p class="tiny">Tap a part, then tap a slot.</p>
  <div class="rail" id="rail">
    <div class="slot" id="slot0" role="button" tabindex="0" aria-label="First slot, empty">1st</div>
    <div class="slot" id="slot1" role="button" tabindex="0" aria-label="Second slot, empty">2nd</div>
    <div class="slot" id="slot2" role="button" tabindex="0" aria-label="Third slot, empty">3rd</div>
  </div>
  <button class="primary" id="runBtn" disabled>Fill all three slots to run it</button>
  </div>
</section>

<!-- ================= SCREEN 2 : the run ================= -->
<section class="screen" id="s2" aria-labelledby="t2">
  <div class="navbar">
    <button class="ghost back">Back</button>
    <button class="ghost home" aria-label="Start over from the beginning">Start over</button>
  </div>
  <h2 id="t2">Run it</h2>
  <div id="stageHost"></div>
  <div class="say" id="verdict" role="status" aria-live="polite"></div>
  <button class="primary" id="swapBtn">Shift the order and run it again</button>
  <div class="navbar"><button class="ghost" id="benchBtn">Back to the bench</button></div>
</section>

</div>

<script>
(function(){
"use strict";
var $ = function(id){ return document.getElementById(id); };
var reduced = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

var PARTS = {
  ava: {
    name: "The Avalanche",
    layer: "Too much",
    why: "It does not know when to stop. The funny is that it keeps going after you thought it was done.",
    glyph: '<path d="M14 20 L22 44 L44 44 L52 20 Z"/><path d="M14 20 L52 20"/>' +
           '<circle cx="26" cy="30" r="5"/><circle cx="40" cy="28" r="5"/><circle cx="33" cy="38" r="5"/>'
  },
  echo: {
    name: "The Echo",
    layer: "Again, but different",
    why: "Two the same makes a rule. The third one breaks it. Break it too early and there was never a rule.",
    glyph: '<path d="M10 14 H54"/><path d="M20 14 L20 22"/><path d="M32 14 L32 22"/><path d="M44 14 L44 22"/>' +
           '<path d="M14 40 C14 30 16 24 20 24 C24 24 26 30 26 40 Z"/>' +
           '<path d="M26 40 C26 30 28 24 32 24 C36 24 38 30 38 40 Z"/>' +
           '<path d="M44 30 L52 22 M44 22 L52 30"/>'
  },
  jack: {
    name: "The Jack",
    layer: "Surprise",
    why: "The waiting is the joke, not the popping. Take the pause away and it stops being funny.",
    glyph: '<rect x="16" y="30" width="34" height="24" rx="3"/><path d="M16 30 L50 30"/>' +
           '<path d="M33 30 L24 22 L42 16 L33 8"/><circle cx="33" cy="8" r="6"/>'
  }
};
var ORDER = [null, null, null];
var picked = null;

function glyph(k, cls){
  return '<svg class="'+(cls||"")+'" viewBox="0 0 64 64" aria-hidden="true" focusable="false" '+
    'fill="none" stroke="var(--ink)" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round">'
    + PARTS[k].glyph + '</svg>';
}
function show(n){
  var all = document.querySelectorAll(".screen");
  for (var i=0;i<all.length;i++) all[i].classList.remove("on");
  $("s"+n).classList.add("on");
  window.scrollTo(0,0);
  var h = $("s"+n).querySelector("h1,h2");
  if (h){ h.setAttribute("tabindex","-1"); h.focus(); }
}

/* ---------- build the pellets once ---------- */
function makePellets(){
  var g = $("pellets"), h = "";
  for (var i=0;i<34;i++){
    var x = 96 + (i%7)*3 - 9;
    h += '<circle class="pel" data-i="'+i+'" cx="'+x+'" cy="188" r="8" '+
         'fill="var(--cut)" stroke="var(--ink)" stroke-width="2.5"/>';
  }
  g.innerHTML = h;
}
function resetStage(){
  var s = $("bench");
  s.classList.remove("hop-back","hop-pour","hop-shake","jack-open","jack-wob",
    "arm-up","arm-hit1","arm-hit2","arm-hit3","ring1","ring2","bolt");
  $("hopper2").classList.remove("in");
  $("puff").classList.remove("go");
  $("crank").style.transform = "";
  var p = s.querySelectorAll(".pel");
  for (var i=0;i<p.length;i++){ p[i].classList.remove("go"); p[i].style.cssText=""; }
}

/* ---------- the three performances ---------- */
var T = [];
function at(ms, fn){ T.push(setTimeout(fn, ms)); }
function clearAll(){ for (var i=0;i<T.length;i++) clearTimeout(T[i]); T = []; }

function fireAvalanche(t0, done){
  var s = $("bench");
  var pel = s.querySelectorAll(".pel");
  function drop(i, delay, dur, dx, dy){
    at(t0+delay, function(){
      var e = pel[i]; if(!e) return;
      e.style.setProperty("--dx", dx+"px");
      e.style.setProperty("--dy", dy+"px");
      e.style.setProperty("--d", dur+"ms");
      e.classList.add("go");
    });
  }
  at(t0,     function(){ s.classList.add("hop-back"); });                 // anticipation
  at(t0+160, function(){ s.classList.remove("hop-back"); s.classList.add("hop-pour"); });
  drop(0, 520, 620, 18, 140);                                            // ONE. plink.
  at(t0+900, function(){ /* THE PAUSE. nothing happens. */ });
  for (var i=1;i<6;i++)  drop(i, 1300 + i*70,  700, 10+i*9,  138);
  at(t0+1700, function(){ s.classList.add("hop-shake"); });
  for (var j=6;j<20;j++) drop(j, 1720 + j*32,  760, -30+j*6, 136);
  at(t0+2300, function(){ $("hopper2").classList.add("in"); });           // a SECOND hopper
  for (var k=20;k<34;k++) drop(k, 2460 + k*26, 820, -46+k*5, 190);
  at(t0+2900, function(){ $("puff").classList.add("go"); });
  drop(33, 3120, 560, 4, 138);                                           // one last, late
  at(t0+3300, done);
}

function fireJack(t0, done){
  var s = $("bench"), c = $("crank"), deg = 0;
  for (var i=1;i<=3;i++){
    (function(n){ at(t0 + n*400, function(){ deg += 360; c.style.transform = "rotate("+deg+"deg)"; }); })(i-1);
  }
  /* THE PAUSE. 900ms of nothing at all. This is the joke. */
  at(t0+2100, function(){ s.classList.add("jack-open"); });
  at(t0+2380, function(){ s.classList.add("jack-wob"); });
  at(t0+2900, function(){ s.classList.remove("jack-wob"); done && done(); });
}

function fireEcho(t0, done){
  var s = $("bench");
  function swing(delay, hit, ring){
    at(t0+delay,      function(){ s.classList.remove("arm-hit1","arm-hit2","arm-hit3"); s.classList.add("arm-up"); });
    at(t0+delay+240,  function(){ s.classList.remove("arm-up"); s.classList.add(hit); });
    if (ring) at(t0+delay+380, function(){ s.classList.add(ring); });
    at(t0+delay+900,  function(){ if(ring) s.classList.remove(ring); });
  }
  swing(0,    "arm-hit1", "ring1");        // one. a thing happened.
  swing(1000, "arm-hit2", "ring2");        // two. now it is a RULE.
  at(t0+2000, function(){ /* THE PAUSE. the rule is hanging there. */ });
  at(t0+2350, function(){ s.classList.add("bolt"); });   // the bell leaves
  swing(2400, "arm-hit3", null);                          // three. nothing to hit.
  at(t0+3500, function(){ s.classList.remove("bolt","arm-hit3"); done && done(); });
}

var FIRE = { ava: fireAvalanche, jack: fireJack, echo: fireEcho };
var DUR  = { ava: 3300, jack: 2900, echo: 3500 };

/* ---------- screen 1: the bench ---------- */
function drawParts(){
  var h = "", ks = ["echo","ava","jack"];
  for (var i=0;i<ks.length;i++){
    var k = ks[i], p = PARTS[k], known = !!p.seen;
    h += '<button class="part'+(known?" known":"")+'" data-part="'+k+'" '+
      'aria-label="'+(known ? p.name+". "+p.layer+". "+p.why : "Unlabelled part "+(i+1)+". Tap to make it go.")+'">'+
      glyph(k) + '<span class="col">' +
      (known
        ? '<span class="tag">'+p.layer+'</span><span class="nm">'+p.name+'</span><span class="why">'+p.why+'</span>'
        : '<span class="nm">Part '+(i+1)+'</span><span class="why">Tap it and see what it does.</span>') +
      '</span></button>';
  }
  $("parts").innerHTML = h;
  var all = PARTS.echo.seen && PARTS.ava.seen && PARTS.jack.seen;
  $("orderBlock").hidden = !all;
  $("t1").textContent   = all ? "You have all three" : "Tap a part";
  $("benchHint").textContent = all
    ? "Now the order is up to you. Put them in the slots below."
    : "It will go, then tell you what kind of funny it is.";
}
var ORD = ["1st","2nd","3rd"];
function drawRail(){
  for (var i=0;i<3;i++){
    var el = $("slot"+i), k = ORDER[i];
    if (k){
      el.className = "slot filled";
      el.innerHTML = '<span class="ord">'+ORD[i]+'</span>' + glyph(k) + '<span>'+PARTS[k].name+'</span>';
      el.setAttribute("aria-label", ORD[i]+": "+PARTS[k].name+". Tap to clear.");
    } else {
      el.className = "slot";
      el.innerHTML = '<span class="ord">'+ORD[i]+'</span><span>empty</span>';
      el.setAttribute("aria-label", ORD[i]+" slot, empty."+(picked?" Tap to put "+PARTS[picked].name+" here.":""));
    }
  }
  var n = 0; for (var j=0;j<3;j++) if (ORDER[j]) n++;
  $("runBtn").disabled = n < 3;
  $("runBtn").textContent = n < 3 ? "Fill all three slots to run it" : "Run the machine";
}
function place(i){
  if (ORDER[i]){ ORDER[i] = null; drawRail(); return; }
  if (!picked) return;
  for (var o=0;o<3;o++) if (ORDER[o] === picked) ORDER[o] = null;   // a part sits in one slot only
  ORDER[i] = picked; picked = null;
  var ps = document.querySelectorAll("[data-part]");
  for (var n=0;n<ps.length;n++) ps[n].style.outline = "";
  drawRail();
}

/* ---------- screen 2: run, then say what happened ---------- */
/* Six orders, judged on principle instead of a lookup table: what it costs to OPEN
   with a kind of funny, and what it earns to END on one. The middle is the middle. */
var OPENS = {
  echo: "You opened with a rule. Two the same, then a break. Everything after that had a shape to sit in.",
  ava:  "You opened with the flood. Loud, and it used up most of the room straight away.",
  jack: "You opened with the pop. It went off before anything had built, so it was only a noise."
};
var ENDS = {
  jack: "Ending on the surprise worked. The room went quiet, and then one small thing moved.",
  ava:  "Ending on the flood buried whatever came before it. Big is not the same as last.",
  echo: "Ending on the rule is a strange place to put it. By then nobody was counting, so the break had nothing to break."
};
var BEST = "Rule, then flood, then one small pop into the quiet. That is the shape comedy usually wants: " +
           "something to set up, something to build, and something small to finish it.";

function runIt(){
  show(2);
  $("stageHost").appendChild($("bench"));
  $("verdict").textContent = "";
  resetStage(); clearAll();
  if (reduced){
    $("bench").classList.add("hop-pour","jack-open","arm-hit3");
    $("hopper2").classList.add("in");
    tell(true); return;
  }
  /* fire the three in the chosen order, each waiting on the one before it */
  var i = 0;
  (function next(){
    if (i >= 3){ at(450, function(){ tell(false); }); return; }
    var k = ORDER[i]; i++;
    FIRE[k](i === 1 ? 260 : 0, function(){ at(650, next); });
  })();
}
function tell(still){
  var o = ORDER, names = PARTS[o[0]].name + ", then " + PARTS[o[1]].name + ", then " + PARTS[o[2]].name + ". ";
  var lead = still ? "Still picture, because motion is turned down. " + names : "";
  var body = (o[0] === "echo" && o[1] === "ava" && o[2] === "jack")
    ? BEST
    : OPENS[o[0]] + " " + ENDS[o[2]];
  $("verdict").textContent = lead + body;
}

/* ---------- wiring ---------- */
makePellets(); drawParts(); drawRail();

$("parts").addEventListener("click", function(e){
  var t = e.target.closest("[data-part]"); if (!t) return;
  var k = t.getAttribute("data-part");
  resetStage(); clearAll();
  FIRE[k](160, function(){
    at(220, function(){ PARTS[k].seen = true; drawParts(); });
  });
  picked = k;
  var ps = document.querySelectorAll("[data-part]");
  for (var n=0;n<ps.length;n++) ps[n].style.outline = "";
  t.style.outline = "4px solid var(--lamp-ink)";
  drawRail();
});
$("slot0").onclick = function(){ place(0); };
$("slot1").onclick = function(){ place(1); };
$("slot2").onclick = function(){ place(2); };
$("slot0").onkeydown = $("slot1").onkeydown = $("slot2").onkeydown = function(e){
  if (e.key === "Enter" || e.key === " "){ e.preventDefault(); this.click(); }
};

$("startBtn").onclick = function(){ show(1); };
$("runBtn").onclick   = runIt;
/* rotate rather than swap: with three parts, a rotation reaches a new order every tap */
$("swapBtn").onclick  = function(){ ORDER.push(ORDER.shift()); drawRail(); runIt(); };
$("benchBtn").onclick = function(){
  clearAll(); resetStage();
  $("s1").insertBefore($("bench"), $("parts"));
  drawRail(); show(1);
};
$("backBtn").onclick  = function(){ show(0); };

var backs = document.querySelectorAll(".ghost.back");
for (var i=0;i<backs.length;i++) backs[i].onclick = function(){ $("benchBtn").click(); };
var homes = document.querySelectorAll("#homeBtn, .ghost.home");
for (var j=0;j<homes.length;j++) homes[j].onclick = function(){
  clearAll(); resetStage(); ORDER = [null,null,null]; picked = null;
  PARTS.ava.seen = PARTS.jack.seen = PARTS.echo.seen = false;
  $("s1").insertBefore($("bench"), $("parts"));
  drawParts(); drawRail(); show(0);
};
})();
</script>
</body>
</html>
