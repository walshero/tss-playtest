<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Funny Boney's Factory v10.0</title>
<meta name="description" content="Put parts on the track. Press GO. Watch what happens to the ball.">
<meta name="spec-source" content="funnybonies/SPEC-LINK-v10.md">
<meta name="audience" content="kids, grades 3 to 6">
<style>
/* ===========================================================
   Funny Boney's Factory  ·  v10.0
   Spec: funnybonies/SPEC-LINK-v10.md
   Audience: kids, grades 3 to 6.

   v10 REBUILD, founder-called 2026-08-28. Two rulings:
     "The echo makes no sense. I can't hear anything."
     "The game makes no intuitive sense."
   v9 asked a kid to ORDER three abstractions and read a paragraph of
   comedy theory. It also built a joke out of a bell, in a game with no
   sound. Both are gone.

   v10 is ONE TRACK, ONE BALL, THREE SOCKETS. Parts go on the track.
   Press GO. The ball travels left to right and each part does something
   visibly stupid to it. Nothing is scored. Nothing is wrong.
   The naming arrives AFTER the laugh and never blocks play.

   EVERY GAG IS VISIBLE. Nothing here depends on hearing anything.

   Register: Samorost + Lumino City. Built and lit, not drawn flat.
   Light theme = shutters open. Dark theme = the work lamp at night.
   Nothing is stored. In memory only.
   =========================================================== */
:root{
  color-scheme: light dark;
  --room:#D9C3A0; --wall:#CBB08A; --panel:#E3D2B4;
  --card:#C9A97C; --card2:#A8845A; --card3:#8C6B45;
  --cut:#F4EADC; --ink:#2E241C; --soft:#5C4A3A;
  --shade:rgba(46,36,28,.30);
  --lamp:#B34E0B; --onlamp:#FFFFFF; --lamp-ink:#8A3907; --glow:#E8913A;
  --rule:#A8916E;
  --pad:18px; --r:12px;
}
@media (prefers-color-scheme: dark){
  :root{
    --room:#141010; --wall:#1E1714; --panel:#241C17;
    --card:#6B4E30; --card2:#4A351F; --card3:#332415;
    --cut:#D9CBB6; --ink:#EFE2CE; --soft:#BCA88C;
    --shade:rgba(0,0,0,.55);
    --lamp:#FFB347; --onlamp:#1B1008; --lamp-ink:#FFC46B; --glow:#FFB347;
    --rule:#3A2E24;
  }
}
body.dusk{
  --room:#3A2C20; --wall:#463628; --panel:#4E3C2C;
  --card:#8A6845; --card2:#63482D; --card3:#48331F;
  --cut:#E6D9C4; --ink:#F2E7D5; --soft:#C9B69A;
  --shade:rgba(0,0,0,.45);
  --lamp:#FFA93A; --onlamp:#241503; --lamp-ink:#FFBF66; --glow:#FFA93A;
  --rule:#5A4632;
}
body.night{
  --room:#141010; --wall:#1E1714; --panel:#241C17;
  --card:#6B4E30; --card2:#4A351F; --card3:#332415;
  --cut:#D9CBB6; --ink:#EFE2CE; --soft:#BCA88C;
  --shade:rgba(0,0,0,.55);
  --lamp:#FFB347; --onlamp:#1B1008; --lamp-ink:#FFC46B; --glow:#FFB347;
  --rule:#3A2E24;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--room); color:var(--ink);
  font:400 20px/1.45 "Avenir Next","Segoe UI",Roboto,system-ui,-apple-system,sans-serif;
  -webkit-text-size-adjust:100%; padding:0 0 40px;
}
.wrap{max-width:560px; margin:0 auto; padding:0 var(--pad)}
h1{font-size:30px; line-height:1.08; margin:14px 0 10px; letter-spacing:-.4px}
.ver{
  display:inline-block; font-size:20px; font-weight:700; color:var(--lamp-ink);
  border:2px solid var(--lamp-ink); border-radius:8px; padding:1px 8px;
  vertical-align:3px; white-space:nowrap;
}
p{margin:0 0 12px}
.tiny{font-size:18px; color:var(--soft)}

/* ---------- the machine ---------- */
.stage{
  position:relative; width:100%; border-radius:var(--r); overflow:hidden;
  box-shadow:0 6px 0 var(--shade); background:var(--wall);
}
.stage svg{display:block; width:100%; height:auto}

/* ---------- the tray ---------- */
.trayhead{margin:16px 0 8px; font-size:21px; font-weight:700}
.tray{display:grid; grid-template-columns:repeat(3,1fr); gap:10px}
.part{
  min-height:112px; border:3px solid var(--card3); border-radius:var(--r);
  background:var(--panel); color:var(--ink); padding:8px 6px 10px;
  display:flex; flex-direction:column; align-items:center; justify-content:flex-start;
  gap:4px; cursor:pointer; font:inherit; font-size:18px; font-weight:700;
  box-shadow:0 4px 0 var(--shade);
}
.part:active{transform:translateY(2px); box-shadow:0 2px 0 var(--shade)}
.part:disabled{opacity:.42; cursor:default}
.part svg{width:52px; height:44px; display:block}
.part:focus-visible, .primary:focus-visible, .ghost:focus-visible, .socketbtn:focus-visible{
  outline:4px solid var(--lamp-ink); outline-offset:3px;
}

/* ---------- controls ---------- */
.row{display:flex; gap:10px; margin-top:14px}
.primary{
  flex:1; min-height:64px; border:0; border-radius:var(--r);
  background:var(--lamp); color:var(--onlamp);
  font:inherit; font-size:26px; font-weight:800; letter-spacing:.5px;
  cursor:pointer; box-shadow:0 5px 0 var(--shade);
}
.primary:active{transform:translateY(2px); box-shadow:0 3px 0 var(--shade)}
.primary[disabled]{background:var(--panel); color:var(--ink); opacity:.55; cursor:default}
.ghost{
  min-height:64px; min-width:112px; border:3px solid var(--card3); border-radius:var(--r);
  background:transparent; color:var(--ink); font:inherit; font-size:20px; font-weight:700;
  cursor:pointer;
}

/* ---------- the naming, after the fact ---------- */
.after{margin-top:16px; border-top:3px solid var(--rule); padding-top:12px}
.after[hidden]{display:none}
.named{font-size:23px; font-weight:800; margin:0 0 6px}
.why{font-size:20px; margin:0 0 10px; color:var(--soft)}
.chip{
  display:inline-block; border:2px solid var(--rule); border-radius:8px;
  padding:2px 8px; font-size:18px; font-weight:700; margin:0 6px 6px 0;
}
footer{margin-top:22px; border-top:2px solid var(--rule); padding-top:10px}

@media (prefers-reduced-motion: reduce){
  .ball, .rig, .lidg, .extra{transition:none !important}
}
</style>
</head>
<body>

<div class="wrap">

<h1>Funny Boney's Factory <span class="ver">v10.0</span></h1>

<div class="stage">
<svg id="scene" viewBox="0 0 360 300" role="img"
     aria-label="A workshop bench under a hanging lamp. A track runs left to right with three empty sockets on it.">
  <defs>
    <radialGradient id="lampfall" cx="50%" cy="6%" r="85%">
      <stop offset="0%" stop-color="var(--glow)" stop-opacity=".55"/>
      <stop offset="55%" stop-color="var(--glow)" stop-opacity=".12"/>
      <stop offset="100%" stop-color="var(--glow)" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="plank" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="var(--card)"/>
      <stop offset="100%" stop-color="var(--card2)"/>
    </linearGradient>
    <clipPath id="stageclip"><rect x="0" y="0" width="360" height="300"/></clipPath>
  </defs>

  <g clip-path="url(#stageclip)">
    <!-- back wall -->
    <rect x="0" y="0" width="360" height="300" fill="var(--wall)"/>
    <rect x="0" y="0" width="360" height="300" fill="url(#lampfall)"/>
    <!-- wall boards, faint depth -->
    <g stroke="var(--card3)" stroke-opacity=".18" stroke-width="1">
      <line x1="0" y1="58" x2="360" y2="58"/>
      <line x1="0" y1="112" x2="360" y2="112"/>
      <line x1="0" y1="166" x2="360" y2="166"/>
    </g>

    <!-- the lamp -->
    <line x1="180" y1="0" x2="180" y2="26" stroke="var(--card3)" stroke-width="3"/>
    <path d="M156 56 L180 26 L204 56 Z" fill="var(--card2)" stroke="var(--card3)" stroke-width="3"/>
    <ellipse cx="180" cy="56" rx="24" ry="7" fill="var(--lamp)"/>
    <ellipse cx="180" cy="55" rx="13" ry="4" fill="var(--cut)" fill-opacity=".85"/>

    <!-- the bench -->
    <rect x="0" y="228" width="360" height="14" fill="url(#plank)" stroke="var(--card3)" stroke-width="3"/>
    <rect x="0" y="242" width="360" height="10" fill="var(--card3)" fill-opacity=".55"/>
    <rect x="38" y="252" width="14" height="48" fill="var(--card2)" stroke="var(--card3)" stroke-width="3"/>
    <rect x="308" y="252" width="14" height="48" fill="var(--card2)" stroke="var(--card3)" stroke-width="3"/>

    <!-- three sockets, drawn as notches in the bench -->
    <g id="sockets">
      <g class="sock" data-i="0">
        <rect x="52" y="216" width="64" height="14" rx="4"
              fill="none" stroke="var(--card3)" stroke-width="3" stroke-dasharray="7 6"/>
      </g>
      <g class="sock" data-i="1">
        <rect x="148" y="216" width="64" height="14" rx="4"
              fill="none" stroke="var(--card3)" stroke-width="3" stroke-dasharray="7 6"/>
      </g>
      <g class="sock" data-i="2">
        <rect x="244" y="216" width="64" height="14" rx="4"
              fill="none" stroke="var(--card3)" stroke-width="3" stroke-dasharray="7 6"/>
      </g>
    </g>

    <!-- installed parts get drawn here -->
    <g id="rigs"></g>

    <!-- the bucket at the end -->
    <path d="M330 196 L356 196 L352 228 L334 228 Z"
          fill="var(--card2)" stroke="var(--card3)" stroke-width="3"/>

    <!-- extra balls the parts spit out -->
    <g id="extras"></g>

    <!-- the one ball -->
    <g id="ball" class="ball" transform="translate(14,217)">
      <circle r="11" fill="var(--cut)" stroke="var(--card3)" stroke-width="3"/>
      <circle cx="-3" cy="-4" r="3" fill="var(--card3)" fill-opacity=".35"/>
    </g>
  </g>
</svg>
</div>

<div class="trayhead" id="trayhead">Tap a part to put it on the track</div>

<div class="tray">
  <button class="part" id="p-hopper" data-k="hopper">
    <svg viewBox="0 0 52 44" aria-hidden="true">
      <path d="M8 6 H44 L34 30 H18 Z" fill="var(--card)" stroke="var(--card3)" stroke-width="3"/>
      <circle cx="22" cy="16" r="4" fill="var(--cut)" stroke="var(--card3)" stroke-width="2"/>
      <circle cx="32" cy="18" r="4" fill="var(--cut)" stroke="var(--card3)" stroke-width="2"/>
      <circle cx="26" cy="38" r="4" fill="var(--cut)" stroke="var(--card3)" stroke-width="2"/>
    </svg>
    Hopper
  </button>
  <button class="part" id="p-jack" data-k="jack">
    <svg viewBox="0 0 52 44" aria-hidden="true">
      <rect x="10" y="16" width="32" height="24" fill="var(--card)" stroke="var(--card3)" stroke-width="3"/>
      <rect x="8" y="10" width="36" height="7" fill="var(--card2)" stroke="var(--card3)" stroke-width="3"/>
      <path d="M26 16 v-8" stroke="var(--card3)" stroke-width="3" fill="none"/>
    </svg>
    Jack
  </button>
  <button class="part" id="p-triplet" data-k="triplet">
    <svg viewBox="0 0 52 44" aria-hidden="true">
      <path d="M6 34 Q26 6 46 34" fill="none" stroke="var(--card3)" stroke-width="3"/>
      <circle cx="14" cy="34" r="5" fill="var(--cut)" stroke="var(--card3)" stroke-width="2"/>
      <circle cx="26" cy="34" r="5" fill="var(--cut)" stroke="var(--card3)" stroke-width="2"/>
      <circle cx="40" cy="32" r="9" fill="var(--cut)" stroke="var(--card3)" stroke-width="2"/>
    </svg>
    Triplet
  </button>
</div>

<div class="row">
  <button class="primary" id="go" disabled>GO</button>
  <button class="ghost" id="clear">Clear</button>
</div>

<div class="after" id="after" hidden>
  <p class="named" id="named"></p>
  <p class="why" id="why"></p>
  <div id="chips"></div>
</div>

<footer>
  <p class="tiny">Nothing is saved. Tight Spiral Studios.</p>
</footer>

</div>

<script>
(function(){
"use strict";
var $ = function(id){ return document.getElementById(id); };
var REDUCED = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;

/* Socket geometry, in the scene's own viewBox units. */
var SOCK_X = [84, 180, 276];   /* centres */
var TRACK_Y = 217;
var END_X   = 343;

/* The three parts. Each gag is VISIBLE. None of them makes a sound,
   because a kid holding a muted phone must get the whole joke. */
var PARTS = {
  hopper: {
    name: "The Hopper",
    line: "It does not know when to stop.",
    made: "You made it not stop.",
    dur:  1500
  },
  jack: {
    name: "The Jack",
    line: "The waiting is the joke, not the popping.",
    made: "You made everybody wait.",
    dur:  1700
  },
  triplet: {
    name: "The Triplet",
    line: "Two the same makes a rule. The third one breaks it.",
    made: "You set up a rule and broke it.",
    dur:  1600
  }
};

var slots = [null, null, null];
var running = false;

/* ---------- drawing the installed parts ---------- */
function svgEl(n, attrs){
  var e = document.createElementNS("http://www.w3.org/2000/svg", n);
  for (var k in attrs) e.setAttribute(k, attrs[k]);
  return e;
}
function rigFor(kind, cx){
  var g = svgEl("g", {"class":"rig", "data-kind":kind});
  if (kind === "hopper"){
    g.appendChild(svgEl("path", {d:"M"+(cx-30)+" 166 H"+(cx+30)+" L"+(cx+16)+" 228 H"+(cx-16)+" Z",
      fill:"var(--card)", stroke:"var(--card3)", "stroke-width":"3"}));
    g.appendChild(svgEl("line", {x1:cx-22, y1:178, x2:cx+22, y2:178,
      stroke:"var(--card3)", "stroke-width":"2", "stroke-opacity":".5"}));
  } else if (kind === "jack"){
    var lid = svgEl("g", {"class":"lidg", "data-cx":cx});
    lid.appendChild(svgEl("rect", {x:cx-30, y:178, width:60, height:11,
      fill:"var(--card2)", stroke:"var(--card3)", "stroke-width":"3"}));
    g.appendChild(svgEl("rect", {x:cx-28, y:189, width:56, height:39,
      fill:"var(--card)", stroke:"var(--card3)", "stroke-width":"3"}));
    g.appendChild(lid);
  } else {
    g.appendChild(svgEl("path", {d:"M"+(cx-30)+" 228 Q"+cx+" 166 "+(cx+30)+" 228",
      fill:"none", stroke:"var(--card3)", "stroke-width":"4"}));
  }
  return g;
}
function drawRigs(){
  var host = $("rigs");
  while (host.firstChild) host.removeChild(host.firstChild);
  slots.forEach(function(k, i){ if (k) host.appendChild(rigFor(k, SOCK_X[i])); });
  Array.prototype.forEach.call(document.querySelectorAll("#sockets .sock"), function(el){
    el.style.opacity = slots[+el.getAttribute("data-i")] ? "0" : "1";
  });
  syncControls();
}
function syncControls(){
  var placed = slots.filter(Boolean).length;
  $("go").disabled = (placed === 0) || running;
  $("clear").disabled = (placed === 0) || running;
  $("trayhead").textContent = running ? "Watch the ball."
    : placed === 0 ? "Tap a part to put it on the track"
    : placed < 3   ? "Add another, or press GO"
    : "Track is full. Press GO";

  ["hopper","jack","triplet"].forEach(function(k){
    $("p-" + k).disabled = running || (placed >= 3) || slots.indexOf(k) !== -1;
  });
}

/* ---------- animation helpers ---------- */
function moveBall(x, y, ms){
  var b = $("ball");
  b.style.transition = REDUCED ? "none" : "transform " + ms + "ms linear";
  b.style.transform = "";
  b.setAttribute("transform", "translate(" + x + "," + y + ")");
}
function ballTo(x, y, ms, ease){
  var b = $("ball");
  b.style.transition = REDUCED ? "none" : "transform " + ms + "ms " + (ease || "linear");
  b.setAttribute("transform", "translate(" + x + "," + y + ")");
}
function spawnExtra(x, y, r){
  var g = svgEl("g", {"class":"extra", transform:"translate(" + x + "," + y + ")"});
  g.appendChild(svgEl("circle", {r:r, fill:"var(--cut)", stroke:"var(--card3)", "stroke-width":"3"}));
  $("extras").appendChild(g);
  return g;
}
function slideExtra(g, x, y, ms){
  g.style.transition = REDUCED ? "none" : "transform " + ms + "ms cubic-bezier(.3,0,.5,1)";
  g.setAttribute("transform", "translate(" + x + "," + y + ")");
}
function clearExtras(){
  var e = $("extras");
  while (e.firstChild) e.removeChild(e.firstChild);
}

/* ---------- the gags ---------- */
/* Each returns the timeline entries it wants, relative to its own start.
   The ball is AT the socket centre when a gag begins, and each gag is
   responsible for leaving the ball travelling right again. */
function gagHopper(cx, t, push){
  /* ball vanishes into the funnel, then far too many come back out */
  push(t, function(){ ballTo(cx, 176, 220, "cubic-bezier(.4,0,.7,1)"); });
  push(t + 240, function(){ $("ball").style.opacity = "0"; });
  /* THE PAUSE: one beat of nothing, so the flood is a surprise */
  push(t + 520, function(){
    for (var i = 0; i < 14; i++){
      (function(i){
        var g = spawnExtra(cx, 184, 8);
        setTimeout(function(){
          slideExtra(g, cx + 26 + i * 5, TRACK_Y + (i % 3) * 4, 520 + i * 22);
        }, i * 34);
      })(i);
    }
  });
  push(t + 1180, function(){
    $("ball").style.opacity = "1";
    moveBall(cx + 20, TRACK_Y, 0);
  });
  return 1500;
}
function gagJack(cx, t, push){
  /* ball goes in. Then nothing. Then nothing. Then the lid leaves. */
  push(t, function(){ ballTo(cx, 204, 200, "cubic-bezier(.4,0,.7,1)"); });
  push(t + 220, function(){ $("ball").style.opacity = "0"; });
  /* the wait IS the joke. Two small wobbles so the box looks like it is
     holding something in, then a long flat pause with nothing at all. */
  push(t + 500,  function(){ wobble(cx, 3); });
  push(t + 820,  function(){ wobble(cx, -2); });
  push(t + 1320, function(){
    var lid = document.querySelector('.lidg[data-cx="' + cx + '"]');
    if (lid){
      lid.style.transition = REDUCED ? "none" : "transform 420ms cubic-bezier(.2,1.6,.4,1)";
      lid.setAttribute("transform", "translate(" + (cx * 0) + ",-74) rotate(-18)");
    }
    $("ball").style.opacity = "1";
    moveBall(cx, 204, 0);
    ballTo(cx + 18, 128, 300, "cubic-bezier(.15,.9,.4,1)");
  });
  push(t + 1620, function(){ ballTo(cx + 34, TRACK_Y, 220, "cubic-bezier(.5,0,.9,.6)"); });
  return 1700;
}
function gagTriplet(cx, t, push){
  /* same, same, then absurdly not the same */
  push(t, function(){ ballTo(cx - 6, 194, 200, "cubic-bezier(.4,0,.7,1)"); });
  push(t + 210, function(){ $("ball").style.opacity = "0"; });
  push(t + 420, function(){
    var a = spawnExtra(cx, 198, 11); slideExtra(a, cx + 16, TRACK_Y, 360);
  });
  push(t + 760, function(){
    var b = spawnExtra(cx, 198, 11); slideExtra(b, cx + 16, TRACK_Y, 360);
  });
  /* THE PAUSE. The rule is established, so the break needs room. */
  push(t + 1260, function(){
    var c = spawnExtra(cx, 184, 24);
    slideExtra(c, cx + 22, TRACK_Y - 12, 420);
  });
  push(t + 1480, function(){
    $("ball").style.opacity = "1";
    moveBall(cx + 20, TRACK_Y, 0);
  });
  return 1600;
}
function wobble(cx, deg){
  var rig = document.querySelector('.rig[data-kind="jack"]');
  if (!rig) return;
  rig.style.transition = "transform 160ms ease-out";
  rig.style.transformOrigin = cx + "px 228px";
  rig.style.transform = "rotate(" + deg + "deg)";
  setTimeout(function(){ rig.style.transform = "rotate(0deg)"; }, 170);
}

/* ---------- the run ---------- */
function run(){
  if (running) return;
  running = true;
  $("after").hidden = true;
  clearExtras();
  $("ball").style.opacity = "1";
  moveBall(14, TRACK_Y, 0);
  syncControls();

  var timeline = [];
  var push = function(t, fn){ timeline.push([t, fn]); };
  var t = 260;

  for (var i = 0; i < 3; i++){
    var cx = SOCK_X[i];
    var kind = slots[i];
    (function(cx){ push(t, function(){ ballTo(cx, TRACK_Y, 620, "linear"); }); })(cx);
    t += 640;
    if (kind === "hopper")  t += gagHopper(cx, t, push);
    if (kind === "jack")    t += gagJack(cx, t, push);
    if (kind === "triplet") t += gagTriplet(cx, t, push);
  }
  push(t, function(){ ballTo(END_X, TRACK_Y, 520, "cubic-bezier(.4,0,.8,1)"); });
  t += 560;
  push(t, function(){ ballTo(END_X, 212, 220, "cubic-bezier(.4,0,1,1)"); });
  t += 300;
  push(t, function(){ running = false; syncControls(); tellThem(); });

  if (REDUCED){
    /* no motion: jump to the end state and go straight to the telling */
    moveBall(END_X, 212, 0);
    running = false; syncControls(); tellThem();
    return;
  }
  timeline.forEach(function(step){ setTimeout(step[1], step[0]); });
}

/* ---------- the naming, AFTER the laugh ---------- */
function tellThem(){
  var used = slots.filter(Boolean);
  if (!used.length) return;
  var last = used[used.length - 1];
  $("named").textContent = PARTS[last].made;
  $("why").textContent = used.length > 1
    ? "Three things in a row. The last one is the one they remember."
    : PARTS[last].line;
  var chips = $("chips");
  while (chips.firstChild) chips.removeChild(chips.firstChild);
  used.forEach(function(k){
    var s = document.createElement("span");
    s.className = "chip";
    s.textContent = PARTS[k].name + ": " + PARTS[k].line;
    chips.appendChild(s);
  });
  $("after").hidden = false;
}

/* ---------- input ---------- */
["hopper","jack","triplet"].forEach(function(k){
  $("p-" + k).addEventListener("click", function(){
    if (running) return;
    var i = slots.indexOf(null);
    if (i === -1) return;
    slots[i] = k;
    $("after").hidden = true;
    drawRigs();
  });
});
$("go").addEventListener("click", run);
$("clear").addEventListener("click", function(){
  if (running) return;
  slots = [null, null, null];
  clearExtras();
  moveBall(14, TRACK_Y, 0);
  $("after").hidden = true;
  drawRigs();
});

drawRigs();
})();
</script>
</body>
</html>
