<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Dessert Tray v11.0</title>
<meta name="description" content="Stack the dessert tray. The chef wants it higher. The waiter has to carry it.">
<meta name="spec-source" content="funnybonies/SPEC-LINK-v11.md">
<meta name="audience" content="kids, grades 3 to 6">
<style>
/* ===========================================================
   Dessert Tray  ·  Funnybonies v11.0
   Spec: funnybonies/SPEC-LINK-v11.md
   Audience: kids, grades 3 to 6.

   v11 RE-SPINE, founder-called 2026-08-29:
     "Funnybonies isn't quite intuitive enough, and it's not funny."
     "It's a legit rotate and place and change view puzzle game with a
      funny lose state and a funny win state."

   The Goldberg machine is POSTPONED, not cancelled. v10 was a demo with
   no jeopardy, and comedy needs jeopardy. So: Jenga, at a restaurant.

   THREE VERBS. Rotate swaps a dessert's footprint. Place drops it.
   TURN THE TRAY is the actual puzzle: you only ever see one axis, and
   the stack drifts on the axis you are not watching.

   THE CHEF wants it higher, always, forever. THE WAITER has to carry
   this and never says a word about it. Amanita register: eyebrows,
   shoulders, one exhausted arm.

   COLOUR, per founder call. The kraft and cocoa motif of v8 to v10 is
   dead. Patisserie brights. No green anywhere, standing floor.
   Nothing depends on sound. Nothing is stored.
   =========================================================== */
:root{
  color-scheme: light dark;
  --room:#FFE3D3; --wall:#FFD2C2; --wall2:#FFC0B4; --panel:#FFF3E8;
  --ink:#3A1F2B; --soft:#7A4B58; --line:#5A2A38;
  --cream:#FFF6EA; --rasp:#E01E62; --plum:#8B3FBF; --apricot:#FF8A1E;
  --lemon:#FFC61A; --berry:#3D5BD9; --gold:#D99A16; --cocoa:#6B3B2E;
  --shade:rgba(90,42,56,.22);
  --hot:#E01E62; --onhot:#FFFFFF; --hot-ink:#B00A48;
  --tray:#D8D2E6; --tray2:#A9A2C4;
  --pad:16px; --r:14px;
}
@media (prefers-color-scheme: dark){
  :root{
    --room:#1B1220; --wall:#241832; --wall2:#2E1F40; --panel:#2A1C38;
    --ink:#FFEAF0; --soft:#D3A9BC; --line:#12080F;
    --cream:#FFF0DC; --rasp:#FF5E90; --plum:#C07BEE; --apricot:#FFA544;
    --lemon:#FFD447; --berry:#7E97FF; --gold:#F0BE45; --cocoa:#8A5240;
    --shade:rgba(0,0,0,.55);
    --hot:#FF5E90; --onhot:#2A0413; --hot-ink:#FF80A8;
    --tray:#6E6796; --tray2:#4A4470;
  }
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--room); color:var(--ink);
  font:400 20px/1.4 "Avenir Next","Segoe UI",Roboto,system-ui,-apple-system,sans-serif;
  -webkit-text-size-adjust:100%; padding:0 0 34px;
}
.wrap{max-width:560px; margin:0 auto; padding:0 var(--pad)}
h1{font-size:21px; line-height:1.15; margin:12px 0 8px; letter-spacing:-.2px}
.ver{
  display:inline-block; font-size:20px; font-weight:700; color:var(--hot-ink);
  border:2px solid var(--hot-ink); border-radius:8px; padding:1px 8px;
  vertical-align:3px; white-space:nowrap;
}
.tsp-lab{ display:inline-block; font-family:ui-monospace,SFMono-Regular,Menlo,monospace;
  font-size:20px; line-height:1; font-weight:700; letter-spacing:.09em; text-transform:uppercase;
  color:currentColor; border:2px dashed currentColor; border-radius:3px;
  padding:.16em .42em; margin-left:.45em; vertical-align:.1em; white-space:nowrap; }

.stage{
  position:relative; width:100%; border-radius:var(--r); overflow:hidden;
  box-shadow:0 6px 0 var(--shade); background:var(--wall); touch-action:none;
}
.stage svg{display:block; width:100%; height:auto}

.say{
  margin:12px 0 8px; font-size:21px; font-weight:700; min-height:29px;
}
.pad{display:grid; grid-template-columns:1fr 1fr 1fr; gap:9px; margin-bottom:9px}
button{font:inherit; cursor:pointer}
.b{
  min-height:60px; border:3px solid var(--line); border-radius:var(--r);
  background:var(--panel); color:var(--ink); font-size:19px; font-weight:800;
  box-shadow:0 4px 0 var(--shade); letter-spacing:.2px;
}
.b:active{transform:translateY(2px); box-shadow:0 2px 0 var(--shade)}
.b:disabled{opacity:.4; cursor:default}
.b.wide{grid-column:1 / -1}
.b.turn{background:var(--berry); color:var(--cream); border-color:var(--line)}
.b.go{
  background:var(--hot); color:var(--onhot); border-color:var(--line);
  font-size:24px; min-height:66px;
}
.b:focus-visible{outline:4px solid var(--hot-ink); outline-offset:3px}
.tiny{font-size:18px; color:var(--soft); margin:10px 0 0}
footer{margin-top:16px; border-top:2px solid var(--soft); padding-top:9px}
@media (prefers-reduced-motion: reduce){
  .anim{transition:none !important}
}
</style>
</head>
<body>

<div class="wrap">

<h1>Dessert Tray <span class="ver">v11.0</span> <span class="tsp-lab" title="Lab: an experiment on the bench, not a finished game">Lab</span></h1>

<div class="stage" id="stage">
<svg id="scene" viewBox="0 0 360 430" role="img"
     aria-label="A restaurant pass. A chef on the left holds his hand at a height he wants. A waiter on the right waits. A silver tray sits between them.">
  <defs>
    <radialGradient id="lamp" cx="50%" cy="0%" r="80%">
      <stop offset="0%" stop-color="var(--lemon)" stop-opacity=".40"/>
      <stop offset="60%" stop-color="var(--lemon)" stop-opacity=".08"/>
      <stop offset="100%" stop-color="var(--lemon)" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="trayg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="var(--tray)"/>
      <stop offset="100%" stop-color="var(--tray2)"/>
    </linearGradient>
    <clipPath id="clipall"><rect x="0" y="0" width="360" height="430"/></clipPath>
  </defs>

  <g clip-path="url(#clipall)">
    <rect x="0" y="0" width="360" height="430" fill="var(--wall)"/>
    <rect x="0" y="0" width="360" height="430" fill="url(#lamp)"/>
    <!-- tiled back wall, the only straight lines in the room -->
    <g stroke="var(--wall2)" stroke-width="3" opacity=".9">
      <line x1="0" y1="86" x2="360" y2="86"/>
      <line x1="0" y1="150" x2="360" y2="150"/>
      <line x1="0" y1="214" x2="360" y2="214"/>
    </g>

    <!-- ============ THE CHEF, left. He wants it higher. ============ -->
    <g id="chef">
      <!-- toque -->
      <path d="M22 176 q0 -30 14 -30 q4 -16 20 -16 q16 0 20 16 q14 0 14 30 z"
            fill="var(--cream)" stroke="var(--line)" stroke-width="3"/>
      <rect x="24" y="176" width="66" height="15" rx="4" fill="var(--cream)" stroke="var(--line)" stroke-width="3"/>
      <!-- face -->
      <rect x="32" y="191" width="50" height="44" rx="16" fill="var(--apricot)" stroke="var(--line)" stroke-width="3"/>
      <g id="chefBrow">
        <rect x="40" y="200" width="14" height="4" rx="2" fill="var(--line)"/>
        <rect x="60" y="200" width="14" height="4" rx="2" fill="var(--line)"/>
      </g>
      <circle cx="47" cy="211" r="4" fill="var(--line)"/>
      <circle cx="67" cy="211" r="4" fill="var(--line)"/>
      <path id="chefMouth" d="M46 224 q11 8 22 0" fill="none" stroke="var(--line)" stroke-width="3" stroke-linecap="round"/>
      <!-- body -->
      <rect x="26" y="235" width="62" height="80" rx="12" fill="var(--cream)" stroke="var(--line)" stroke-width="3"/>
      <path d="M46 235 v80 M68 235 v80" stroke="var(--line)" stroke-width="2" opacity=".35"/>
      <g id="chefArm">
        <path id="armOut" d="M84 258 L92 200" stroke="var(--line)" stroke-width="20"
              stroke-linecap="round" fill="none"/>
        <path id="armIn" d="M84 258 L92 200" stroke="var(--cream)" stroke-width="13"
              stroke-linecap="round" fill="none"/>
        <circle id="chefHand" cx="92" cy="200" r="12" fill="var(--apricot)"
                stroke="var(--line)" stroke-width="3"/>
      </g>
    </g>

    <!-- ============ THE WAITER, right. He has to carry this. ============ -->
    <g id="waiter">
      <g id="waiterHead">
        <rect x="288" y="188" width="48" height="46" rx="17" fill="var(--apricot)" stroke="var(--line)" stroke-width="3"/>
        <path d="M288 200 q24 -20 48 0 v-6 q-24 -18 -48 0 z" fill="var(--line)"/>
        <g id="wBrow">
          <rect x="296" y="200" width="15" height="4" rx="2" fill="var(--line)"/>
          <rect x="315" y="200" width="15" height="4" rx="2" fill="var(--line)"/>
        </g>
        <circle cx="303" cy="211" r="4" fill="var(--line)"/>
        <circle cx="322" cy="211" r="4" fill="var(--line)"/>
        <path id="wMouth" d="M302 225 q10 -5 20 0" fill="none" stroke="var(--line)" stroke-width="3" stroke-linecap="round"/>
      </g>
      <g id="waiterBody">
        <rect x="284" y="234" width="56" height="82" rx="12" fill="var(--line)"/>
        <path d="M312 234 l-13 16 l13 12 l13 -12 z" fill="var(--cream)"/>
        <rect x="306" y="234" width="12" height="10" fill="var(--rasp)"/>
      </g>
      <g id="waiterArm">
        <path d="M286 248 L274 298" stroke="var(--cream)" stroke-width="19"
              stroke-linecap="round" fill="none" opacity=".9"/>
        <path d="M286 248 L274 298" stroke="var(--line)" stroke-width="13"
              stroke-linecap="round" fill="none"/>
        <circle cx="273" cy="302" r="11" fill="var(--apricot)" stroke="var(--line)" stroke-width="3"/>
      </g>
      <!-- what lands on him when it all goes wrong -->
      <g id="splat" opacity="0"></g>
    </g>

    <!-- ============ the chef's demand, a line in the air ============ -->
    <g id="targetG">
      <line id="targetLine" x1="96" y1="200" x2="266" y2="200"
            stroke="var(--hot)" stroke-width="4" stroke-dasharray="10 8" stroke-linecap="round"/>
      <path id="targetArrow" d="M96 200 l14 -9 v18 z" fill="var(--hot)"/>
    </g>

    <!-- ============ the counter and the tray ============ -->
    <rect x="90" y="352" width="180" height="14" rx="4" fill="var(--wall2)" stroke="var(--line)" stroke-width="3"/>
    <rect x="118" y="366" width="124" height="64" fill="var(--wall2)" opacity=".55"/>
    <ellipse id="trayTop" cx="180" cy="348" rx="72" ry="12" fill="url(#trayg)" stroke="var(--line)" stroke-width="3"/>

    <!-- the stack, and the piece in the air -->
    <g id="stackG"></g>
    <g id="curG"></g>

    <!-- which way we are looking -->
    <g id="viewTag">
      <rect x="120" y="382" width="120" height="30" rx="8" fill="var(--panel)" stroke="var(--line)" stroke-width="3"/>
      <text id="viewText" x="180" y="403" text-anchor="middle"
            font-family="ui-monospace,Menlo,monospace" font-size="19" font-weight="700" fill="var(--ink)">FRONT</text>
    </g>
  </g>
</svg>
</div>

<p class="say" id="say">Slide it. Turn the tray to check the other side. Then place it.</p>

<div class="pad">
  <button class="b" id="left" aria-label="Slide left">&#9664;</button>
  <button class="b" id="rot">Rotate</button>
  <button class="b" id="right" aria-label="Slide right">&#9654;</button>
  <button class="b turn wide" id="turn">Turn the tray</button>
  <button class="b go wide" id="place">Place it</button>
  <button class="b wide" id="again" hidden>Again</button>
</div>

<footer>
  <p class="tiny" id="hud">Round 1. Nothing is saved.</p>
</footer>

</div>

<script>
(function(){
"use strict";
var $ = function(id){ return document.getElementById(id); };
var NS = "http://www.w3.org/2000/svg";
var REDUCED = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;

var CX = 180, TRAY_Y = 344, TRAY_R = 66;

/* Every dessert is a rectangle with a DIFFERENT width and depth, so rotating
   always changes something. A square piece would make the verb a lie. */
var KINDS = [
  { n:"eclair",  w:76, d:26, h:22, fill:"var(--cocoa)",   top:"var(--gold)"   },
  { n:"slice",   w:52, d:34, h:42, fill:"var(--plum)",    top:"var(--cream)"  },
  { n:"macaron", w:46, d:30, h:26, fill:"var(--rasp)",    top:"var(--cream)"  },
  { n:"jelly",   w:36, d:54, h:34, fill:"var(--apricot)", top:"var(--lemon)"  },
  { n:"sundae",  w:32, d:32, h:54, fill:"var(--cream)",   top:"var(--rasp)"   },
  { n:"tart",    w:58, d:40, h:20, fill:"var(--lemon)",   top:"var(--berry)"  }
];

var stack = [];        /* placed pieces, bottom first */
var cur = null;        /* the one in the air */
var view = "front";    /* front reads x, side reads z */
var round = 1;
var target = 152;      /* how high the chef wants it, in scene units */
var mode = "play";     /* play | falling | won */
var queue = 0;

function wOf(p){ return p.rot ? p.k.d : p.k.w; }
function dOf(p){ return p.rot ? p.k.w : p.k.d; }
function spanOf(p){ return view === "front" ? wOf(p) : dOf(p); }
function posOf(p){ return view === "front" ? p.x : p.z; }
function setPos(p, v){ if (view === "front") p.x = v; else p.z = v; }
function perpOf(p){ return view === "front" ? p.z : p.x; }
function stackH(){ var t = 0; for (var i=0;i<stack.length;i++) t += stack[i].k.h; return t; }

/* ---------- drawing ---------- */
function el(n, a){ var e = document.createElementNS(NS, n); for (var k in a) e.setAttribute(k, a[k]); return e; }

function drawPiece(p, yTop, ghost){
  var g = el("g", {"class":"anim"});
  var sp = spanOf(p), x = CX + posOf(p) - sp/2, per = perpOf(p);
  /* depth cue: a sliver of the side face, leaning the way the piece sits on the
     axis you CANNOT see. It hints. It is never enough to be sure. */
  var lean = Math.max(-9, Math.min(9, per * 0.16));
  if (!ghost){
    g.appendChild(el("path", {
      d:"M"+(x+sp)+" "+yTop+" l"+lean+" -6 v"+(p.k.h)+" l"+(-lean)+" 6 z",
      fill:"var(--line)", opacity:".26" }));
  }
  g.appendChild(el("rect", {x:x, y:yTop, width:sp, height:p.k.h, rx:7,
    fill:p.k.fill, stroke:"var(--line)", "stroke-width":"3",
    opacity: ghost ? ".55" : "1"}));
  /* a little icing so a stack of blocks reads as a stack of puddings */
  g.appendChild(el("rect", {x:x+5, y:yTop+4, width:Math.max(8, sp-10), height:7, rx:3.5,
    fill:p.k.top, opacity: ghost ? ".5" : ".95"}));
  if (p.k.n === "sundae"){
    g.appendChild(el("circle", {cx:x+sp/2, cy:yTop-2, r:6, fill:"var(--rasp)",
      stroke:"var(--line)", "stroke-width":"3"}));
  }
  if (p.k.n === "jelly"){
    g.appendChild(el("path", {d:"M"+(x+4)+" "+(yTop+p.k.h-6)+" q"+(sp/4)+" 7 "+(sp/2)+" 0 q"+(sp/4)+" -7 "+(sp/2-4)+" 0",
      fill:"none", stroke:"var(--line)", "stroke-width":"2", opacity:".5"}));
  }
  return g;
}

function render(){
  var sg = $("stackG"); while (sg.firstChild) sg.removeChild(sg.firstChild);
  var y = TRAY_Y;
  for (var i=0;i<stack.length;i++){
    y -= stack[i].k.h;
    stack[i]._y = y;
    sg.appendChild(drawPiece(stack[i], y, false));
  }
  var cg = $("curG"); while (cg.firstChild) cg.removeChild(cg.firstChild);
  if (cur && mode === "play"){
    var cy = y - 30 - cur.k.h;
    cur._y = cy;
    cg.appendChild(drawPiece(cur, cy, true));
    /* a dropline, so a low vision player can see where it will land */
    var lx = CX + posOf(cur);
    cg.appendChild(el("line", {x1:lx, y1:cy + cur.k.h, x2:lx, y2:y,
      stroke:"var(--hot)", "stroke-width":"3", "stroke-dasharray":"5 6", opacity:".85"}));
  }
  $("viewText").textContent = view === "front" ? "FRONT" : "SIDE";
  var ty = TRAY_Y - target;
  $("targetLine").setAttribute("y1", ty); $("targetLine").setAttribute("y2", ty);
  $("targetArrow").setAttribute("d", "M96 "+ty+" l14 -9 v18 z");
  var hy = Math.max(24, ty);
  $("armOut").setAttribute("d", "M84 258 L92 " + hy);
  $("armIn").setAttribute("d",  "M84 258 L92 " + hy);
  $("chefHand").setAttribute("cy", hy);
  $("hud").textContent = "Round " + round + ". Height " + Math.round(stackH()) +
    " of " + target + ". Nothing is saved.";
}

/* ---------- faces ---------- */
function chefFace(kind){
  $("chefMouth").setAttribute("d", kind === "glad" ? "M44 220 q13 14 26 0" : "M46 224 q11 8 22 0");
  $("chefBrow").setAttribute("transform", kind === "glad" ? "translate(0,-4)" : "translate(0,0)");
}
function waiterFace(kind){
  var m = $("wMouth"), b = $("wBrow");
  if (kind === "grump"){ m.setAttribute("d", "M302 227 q10 -7 20 0"); b.setAttribute("transform","translate(0,3) rotate(-4 311 202)"); }
  else if (kind === "flat"){ m.setAttribute("d", "M302 226 h20"); b.setAttribute("transform","translate(0,5)"); }
  else if (kind === "proud"){ m.setAttribute("d", "M303 223 q9 6 18 0"); b.setAttribute("transform","translate(0,-3)"); }
  else { m.setAttribute("d", "M302 225 q10 -5 20 0"); b.setAttribute("transform","translate(0,0)"); }
}
/* the grumble. Same shape every round, a little worse each time. */
function grumble(){
  var n = Math.min(6, stack.length);
  var arm = $("waiterArm"), body = $("waiterBody");
  waiterFace("grump");
  arm.style.transition = REDUCED ? "none" : "transform 260ms cubic-bezier(.3,1.5,.5,1)";
  arm.style.transformOrigin = "286px 250px";
  arm.style.transform = "rotate(" + (-14 - n*4) + "deg)";
  body.style.transition = REDUCED ? "none" : "transform 260ms ease-out";
  body.style.transform = "translateY(-" + (2 + n) + "px)";
  setTimeout(function(){
    arm.style.transform = "rotate(0deg)";
    body.style.transform = "translateY(0)";
    waiterFace("flat");
  }, 620);
}

/* ---------- the honest physics ---------- */
function mass(p){ return (p.k.w * p.k.d * p.k.h) / 900; }
/* the running centre of mass of everything from level k up must sit over the
   thing holding it. No fudge factor. This is the whole game. */
function comFrom(k){
  var mx=0, mz=0, m=0;
  for (var i=k;i<stack.length;i++){
    var q = mass(stack[i]); m += q; mx += stack[i].x*q; mz += stack[i].z*q;
  }
  return {x: mx/m, z: mz/m};
}
function failingLevel(){
  for (var k=0;k<stack.length;k++){
    var c = comFrom(k);
    if (k === 0){
      if (Math.sqrt(c.x*c.x + c.z*c.z) > TRAY_R) return 0;
    } else {
      var s = stack[k-1];
      if (Math.abs(c.x - s.x) > wOf(s)/2) return k;
      if (Math.abs(c.z - s.z) > dOf(s)/2) return k;
    }
  }
  return -1;
}

/* ---------- turns ---------- */
function nextPiece(){
  var k = KINDS[(queue++ * 3 + round) % KINDS.length];
  var top = stack.length ? stack[stack.length-1] : null;
  cur = { k:k, rot:0, x: top ? top.x : 0, z: top ? top.z : 0 };
  render();
}

function place(){
  if (mode !== "play" || !cur) return;
  var p = cur;
  /* it settles a little crooked on the axis you were NOT watching.
     This is why the third verb exists: drift you cannot see accumulates. */
  var drift = (Math.random() - 0.5) * (5 + stackH() / 26);
  if (view === "front") p.z += drift; else p.x += drift;
  stack.push(p); cur = null;
  render();

  var lvl = failingLevel();
  if (lvl >= 0){ collapse(lvl); return; }

  if (stackH() >= target){ win(); return; }

  grumble();
  say(pick([
    "The waiter has seen this before.",
    "It holds. Nobody is happy about it.",
    "That one is going to matter later.",
    "The chef would like it higher."
  ]));
  nextPiece();
}

function say(t){ $("say").textContent = t; }
function pick(a){ return a[Math.floor(Math.random()*a.length)]; }

/* ---------- the lose state, which is the best animation in here ---------- */
function collapse(lvl){
  mode = "falling";
  buttons(false);
  chefFace("glad");
  waiterFace("flat");
  say("");

  var gs = $("stackG").childNodes;
  /* BEAT ONE: the lean. Everything above the bad level tips, slowly. */
  for (var i=lvl;i<gs.length;i++){
    (function(g,i){
      g.style.transition = REDUCED ? "none" : "transform 520ms cubic-bezier(.4,0,.6,1)";
      g.style.transformOrigin = CX + "px " + TRAY_Y + "px";
      g.style.transform = "rotate(" + (2 + (i-lvl)*1.4) + "deg)";
    })(gs[i], i);
  }
  /* BEAT TWO: the pause. It might hold. It will not. */
  setTimeout(function(){
    say("...");
  }, 560);
  /* BEAT THREE: all of it, at once, onto the waiter. */
  setTimeout(function(){
    for (var i=lvl;i<gs.length;i++){
      (function(g,i){
        var spin = 60 + Math.random()*220;
        var dx = 60 + Math.random()*120, dy = 120 + Math.random()*90;
        g.style.transition = REDUCED ? "none" : "transform 760ms cubic-bezier(.3,.1,.7,1), opacity 760ms linear";
        g.style.transform = "translate(" + dx + "px," + dy + "px) rotate(" + spin + "deg)";
      })(gs[i], i);
    }
    splat();
  }, 1180);
  /* BEAT FOUR: he wipes one eye. He looks at you. He keeps looking. */
  setTimeout(function(){
    var arm = $("waiterArm");
    arm.style.transition = "transform 340ms ease-in-out";
    arm.style.transformOrigin = "286px 250px";
    arm.style.transform = "rotate(-108deg)";
    setTimeout(function(){ arm.style.transform = "rotate(0deg)"; }, 700);
  }, 2000);
  setTimeout(function(){
    waiterFace("flat");
    say("The waiter is looking at you.");
    $("again").hidden = false;
    $("again").focus();
  }, 2900);

  if (REDUCED){
    splat();
    say("It all came down. The waiter is looking at you.");
    $("again").hidden = false;
  }
}
function splat(){
  var s = $("splat"); while (s.firstChild) s.removeChild(s.firstChild);
  var cols = ["var(--rasp)","var(--lemon)","var(--apricot)","var(--plum)","var(--cream)"];
  for (var i=0;i<9;i++){
    s.appendChild(el("circle", {
      cx: 286 + Math.random()*52, cy: 190 + Math.random()*120,
      r: 5 + Math.random()*11, fill: cols[i % cols.length],
      stroke:"var(--line)", "stroke-width":"2.5" }));
  }
  s.setAttribute("opacity","1");
}

/* ---------- the win state ---------- */
function win(){
  mode = "won";
  buttons(false);
  chefFace("glad");
  waiterFace("proud");
  var arm = $("chefArm");
  arm.style.transition = "transform 220ms ease-out";
  say("The chef is happy. Briefly.");
  setTimeout(function(){
    waiterFace("flat");
    round += 1;
    target += 68;
    say("He wants it higher.");
    setTimeout(function(){
      stack = []; mode = "play";
      $("splat").setAttribute("opacity","0");
      buttons(true); nextPiece(); render();
      say("Slide it. Turn the tray to check. Then place it.");
    }, 1100);
  }, 1500);
}

/* ---------- input ---------- */
function buttons(on){
  ["left","right","rot","turn","place"].forEach(function(id){ $(id).disabled = !on; });
  $("again").hidden = on;
}
function nudge(d){
  if (!cur || mode !== "play") return;
  setPos(cur, posOf(cur) + d);
  render();
}
$("left").addEventListener("click", function(){ nudge(-7); });
$("right").addEventListener("click", function(){ nudge(7); });
$("rot").addEventListener("click", function(){
  if (!cur || mode !== "play") return;
  cur.rot = cur.rot ? 0 : 1; render();
  say(view === "front" ? "Wider one way, deeper the other." : "Same piece, turned.");
});
$("turn").addEventListener("click", function(){
  if (mode !== "play") return;
  view = (view === "front") ? "side" : "front";
  render();
  say(view === "side" ? "Now you can see the other axis. Anything hanging off?"
                      : "Back to the front.");
});
$("place").addEventListener("click", place);
$("again").addEventListener("click", function(){
  stack = []; mode = "play"; round = 1; target = 152;
  $("splat").setAttribute("opacity","0");
  chefFace("normal"); waiterFace("normal");
  var gs = $("stackG"); while (gs.firstChild) gs.removeChild(gs.firstChild);
  buttons(true); nextPiece(); render();
  say("Slide it. Turn the tray to check. Then place it.");
});

/* drag on the scene, because buttons are slow and kids drag */
(function(){
  var st = $("stage"), dragging = false;
  function toScene(ev){
    var r = st.getBoundingClientRect();
    return ((ev.clientX - r.left) / r.width) * 360;
  }
  st.addEventListener("pointerdown", function(ev){
    if (!cur || mode !== "play") return;
    dragging = true; st.setPointerCapture(ev.pointerId);
    setPos(cur, toScene(ev) - CX); render();
  });
  st.addEventListener("pointermove", function(ev){
    if (!dragging || !cur) return;
    setPos(cur, toScene(ev) - CX); render();
  });
  st.addEventListener("pointerup", function(){ dragging = false; });
  st.addEventListener("pointercancel", function(){ dragging = false; });
})();

chefFace("normal"); waiterFace("normal");
nextPiece(); render();
})();
</script>
</body>
